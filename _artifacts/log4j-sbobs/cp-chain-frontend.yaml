apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ContainerProfile
metadata:
  name: chain-frontend
  namespace: log4j-poc
spec:
  architectures:
  - amd64
  imageID: docker.io/library/nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
  imageTag: docker.io/library/nginx:1.27-alpine
  capabilities:
  - CAP_CHOWN
  - CAP_DAC_OVERRIDE
  - CAP_NET_BIND_SERVICE
  - CAP_SETGID
  - CAP_SETUID
  execs:
  - path: /usr/sbin/nginx
    args:
    - nginx
    - -g
    - daemon off;
  opens:
  - path: /etc/nginx/nginx.conf
    flags:
    - O_RDONLY
  - path: /etc/nginx/conf.d
    flags:
    - O_RDONLY
  - path: /etc/nginx/mime.types
    flags:
    - O_RDONLY
  - path: /etc/resolv.conf
    flags:
    - O_RDONLY
  - path: /etc/hosts
    flags:
    - O_RDONLY
  - path: /etc/nsswitch.conf
    flags:
    - O_RDONLY
  - path: /etc/localtime
    flags:
    - O_RDONLY
  - path: /var/log/nginx
    flags:
    - O_WRONLY
    - O_APPEND
    - O_CREAT
  - path: /var/cache/nginx
    flags:
    - O_RDWR
    - O_CREAT
  - path: /run/nginx.pid
    flags:
    - O_WRONLY
    - O_CREAT
  seccompProfile:
    spec:
      defaultAction: ''
  endpoints:
  - endpoint: :8080/api/products
    direction: inbound
    methods:
    - GET
    internal: false
  - endpoint: :8080/api/login
    direction: inbound
    methods:
    - POST
    internal: false
  - endpoint: :8080/healthz
    direction: inbound
    methods:
    - GET
    internal: false
  matchLabels:
    app: chain-frontend
  ingress:
  - identifier: ingress-external
    ipAddress: ''
    dns: ''
    dnsNames: null
    ports:
    - name: TCP-8080
      port: 8080
      protocol: TCP
    podSelector: null
    namespaceSelector: null
    type: external
  egress:
  - identifier: egress-kube-dns
    ipAddress: ''
    dns: ''
    dnsNames: null
    ports:
    - name: UDP-53
      port: 53
      protocol: UDP
    - name: TCP-53
      port: 53
      protocol: TCP
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        k8s-app: kube-dns
    type: internal
  - identifier: egress-chain-backend
    ipAddress: ''
    dns: ''
    dnsNames: null
    ports:
    - name: TCP-8080
      port: 8080
      protocol: TCP
    podSelector:
      matchLabels:
        app: chain-backend
    namespaceSelector: null
    type: internal
