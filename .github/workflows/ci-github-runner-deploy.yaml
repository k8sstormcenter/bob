name: CI - github-runner deploy guards

# Flux applies example/github-runner/deploy/ directly, so the extension's render guards never run on
# that path. The same guards run here, on every change to the directory.
on:
  pull_request:
    paths:
      - 'example/github-runner/**'
      - '.github/workflows/ci-github-runner-deploy.yaml'
  push:
    branches:
      - main
    paths:
      - 'example/github-runner/**'

permissions:
  contents: read

jobs:
  deploy-guards:
    name: deploy/ is bindable
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python (for PyYAML)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Profiles
        run: python3 example/github-runner/harness/check_deploy.py example/github-runner/deploy --workload arc-runner=runner,dind

      - name: Runner profiles compose from sbobs/runner-family
        run: |
          curl -sSfL -o /usr/local/bin/bobctl https://github.com/k8sstormcenter/bob/releases/download/v0.1.10/bobctl-linux-amd64
          echo "1509b4b075d27f41d1026f948a2c26ce7cc0c923d02d0e9507ad71f704909af1  /usr/local/bin/bobctl" | sha256sum -c -
          chmod +x /usr/local/bin/bobctl
          example/github-runner/harness/compose.sh
          git diff --exit-code -- example/github-runner/deploy

      - name: Kustomize build
        run: kubectl kustomize example/github-runner/deploy > /dev/null
