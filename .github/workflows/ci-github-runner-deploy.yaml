name: CI - github-runner deploy guards

# Flux applies example/github-runner/deploy/ directly, so the extension's render guards never run on
# that path. The same guards run here, on every change to the directory.
on:
  pull_request:
    paths:
      - 'example/github-runner/**'
      - '.github/workflows/ci-github-runner-deploy.yaml'
  push:
    branches:
      - main
    paths:
      - 'example/github-runner/**'

permissions:
  contents: read

jobs:
  deploy-guards:
    name: deploy/ is bindable
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python (for PyYAML)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Profiles
        run: python3 example/github-runner/harness/check_deploy.py example/github-runner/deploy --workload arc-runner=runner,dind

      - name: Install bobctl (verified)
        env:
          BOBCTL_VERSION: v0.1.14
          BOBCTL_SHA256_AMD64: "114adcf62562f7cb0d87f564d04d2625878d5accbe87401f10842d36e2c3102e"
        run: |
          set -euo pipefail
          base="https://github.com/${{ github.repository }}/releases/download/${BOBCTL_VERSION}"
          curl -sSfL -o /tmp/bobctl "${base}/bobctl-linux-amd64"
          curl -sSfL -o /tmp/bobctl.intoto.jsonl "${base}/bobctl.intoto.jsonl"
          echo "${BOBCTL_SHA256_AMD64}  /tmp/bobctl" | sha256sum -c -

      - name: Install slsa-verifier
        uses: slsa-framework/slsa-verifier/actions/installer@3714a2a4684014deb874a0e737dffa0ee02dd647 # v2.6.0

      - name: Runner profiles compose from sbobs/runner-family (verify provenance + drift)
        run: |
          set -euo pipefail
          slsa-verifier verify-artifact /tmp/bobctl \
            --provenance-path /tmp/bobctl.intoto.jsonl \
            --source-uri github.com/${{ github.repository }} \
            --source-tag v0.1.14
          sudo install -m 0755 /tmp/bobctl /usr/local/bin/bobctl
          example/github-runner/harness/compose.sh
          git diff --exit-code -- example/github-runner/deploy

      - name: Kustomize build
        run: kubectl kustomize example/github-runner/deploy > /dev/null
