name: CI - java-poc images

# Builds and publishes the four example/java-poc demo images to GHCR.
# Mirrors ci-chain-images.yaml's shape; uses immutable GitHub Actions
# SHAs per the repo's pinning policy.
#
# Tags pushed (per component):
#   - ghcr.io/k8sstormcenter/java-poc-<component>:<short-sha>
#   - ghcr.io/k8sstormcenter/java-poc-<component>:<branch>
#   - ghcr.io/k8sstormcenter/java-poc-<component>:latest    (main only)
#
# Replaces the ttl.sh 24h-rot path that was breaking fresh-PG
# provisioning. Consumers are example/java-poc/{30-backend,50-pathogen,
# backend-b,backend-c}.yaml.

on:
  push:
    branches:
      - main
    paths:
      - 'example/java-poc/backend/**'
      - 'example/java-poc/pathogen/**'
      - '.github/workflows/ci-java-poc-images.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: ${{ matrix.component }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: java-poc-backend-vulnerable
            context: example/java-poc/backend
            dockerfile: example/java-poc/backend/Dockerfile.vulnerable
          - component: java-poc-backend-contained
            context: example/java-poc/backend
            dockerfile: example/java-poc/backend/Dockerfile.contained
          - component: java-poc-backend-patched
            context: example/java-poc/backend
            dockerfile: example/java-poc/backend/Dockerfile.patched
          - component: java-poc-pathogen
            context: example/java-poc/pathogen
            dockerfile: example/java-poc/pathogen/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Compute image tags
        id: tags
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH_SAFE="${GITHUB_REF_NAME//\//-}"
          IMG=ghcr.io/${{ github.repository_owner }}/${{ matrix.component }}
          TAGS="${IMG}:${SHORT_SHA},${IMG}:${BRANCH_SAFE}"
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            TAGS="${TAGS},${IMG}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "primary=${IMG}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # amd64 only — the demo cluster runs amd64 (oracle-vm runner)
          # and the maven builds + JDK base images take significantly
          # longer multi-arch. arm64 can be added if a consumer needs it.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
