name: CI - php2shell k3s RULES detection demo

# Alternative PHP2Shell detection demo (CVE-2026-109618 / CVE-2026-109619) — the
# RULES arm. Byte-for-byte the same target, image, order, exploit and log read as
# ci-php2shell-k3s-demo.yaml, EXCEPT the detection mechanism: instead of binding a
# learned/generalized ContainerProfile (the SBoB arm, R0001), it applies a special
# profile-independent rule (R1505, profileDependency=NotRequired) that fires when a
# web-server/PHP process spawns a shell — the advisory-backed php2shell signal
# (Falco spawn_shell_under_httpd / "Suspicious Command Executed by Web Server",
# MITRE T1505.003 Web Shell / T1059). The two runs form a side-by-side: SBoB vs rule.
#
# Requires: secrets.ENTLEIN_PAT, secrets.DOCKERHUB_USERNAME, secrets.DOCKERHUB_PAT.

on:
  workflow_dispatch:
    inputs:
      command:
        description: command to land via system() (<=14 bytes — the single-shot carrier limit)
        default: id>/tmp/p2s
      strict:
        description: fail the job if no R1505 lands on php2shell
        default: "false"
      chart_ver:
        description: kubescape-operator chart version to install
        default: 1.41.0-duckling119
      na_tag:
        description: override node-agent image tag (empty = chart default)
        default: ""
      na_digest:
        description: override node-agent image digest sha256:... (with na_tag)
        default: ""

permissions:
  contents: read

concurrency:
  group: php2shell-k3s-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    name: Deploy, exploit & read RULE detection on in-runner k3s
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout (with sealed exploit submodule)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          token: ${{ secrets.ENTLEIN_PAT }}

      - name: Log in to Docker Hub (private node-agent image for the chart)
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Build php2shell-vulnerable image
        run: |
          set -euo pipefail
          docker build -t php2shell-vulnerable:demo \
            -f example/php2shell/Dockerfile example/php2shell

      - name: Set up k3s + helm
        uses: jupyterhub/action-k3s-helm@502a9ff4d816dad543e359971fe2c3128d0f4c6e # v4
        with:
          k3s-version: v1.33.3+k3s1

      - name: Import the app image into k3s containerd
        run: |
          set -euo pipefail
          docker save php2shell-vulnerable:demo | sudo k3s ctr images import -
          sudo k3s ctr images ls | grep php2shell-vulnerable

      - name: Install kubescape (our chart) + alertmanager FIRST
        run: |
          set -euo pipefail
          EXTRA="--set logger.level=debug"
          NA_TAG="${{ github.event.inputs.na_tag }}"
          NA_DIGEST="${{ github.event.inputs.na_digest }}"
          if [ -n "$NA_TAG" ]; then
            EXTRA="$EXTRA --set nodeAgent.image.tag=$NA_TAG"
            [ -n "$NA_DIGEST" ] && EXTRA="$EXTRA --set nodeAgent.image.digest=$NA_DIGEST"
            echo "node-agent image override: $NA_TAG ${NA_DIGEST:-(no digest)}"
          fi
          make kubescape KUBESCAPE_CHART_VER=${{ github.event.inputs.chart_ver || '1.41.0-duckling119' }} KS_EXTRA="$EXTRA"
          make alertmanager

      - name: Wait for node-agent to be up and TRACING, then settle 2 min
        run: |
          set -euo pipefail
          kubectl wait --for=condition=ready pod -l app=node-agent   -n honey --timeout=300s
          kubectl wait --for=condition=ready pod -l app=storage      -n honey --timeout=300s
          kubectl wait --for=condition=ready pod -l app=alertmanager -n honey --timeout=120s || true
          APOD=$(kubectl -n honey get pods -l app=node-agent --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}')
          echo "node-agent pod: $APOD"
          for i in $(seq 1 60); do
            kubectl -n honey logs "$APOD" 2>/dev/null | grep -q 'ContainerWatcher started successfully' && { echo "node-agent tracing after ~$((i*5))s"; break; }
            sleep 5
          done
          echo "tracers started: $(kubectl -n honey logs "$APOD" 2>/dev/null | grep -c 'Started tracer')"
          sleep 120

      - name: Deploy the php2shell RULE + the app together, then settle 2 min
        run: |
          set -euo pipefail
          kubectl create namespace php2shell --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f example/php2shell/rules/php2shell-rules.yaml
          sed 's#ghcr.io/k8sstormcenter/php2shell-vulnerable:latest#php2shell-vulnerable:demo#' \
            example/php2shell/php2shell.yaml | kubectl apply -f -
          kubectl -n php2shell rollout status deployment/php2shell --timeout=180s
          kubectl -n php2shell get pods -o wide
          APOD=$(kubectl -n honey get pods -l app=node-agent --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}')
          echo "=== node-agent rule-load + php2shell lines ==="
          kubectl -n honey logs "$APOD" 2>/dev/null | grep -iE 'R1505|rule.*load|RuntimeRuleAlertBinding|php2shell' | head -10 || echo "(none yet)"
          sleep 120

      - name: Exploit (sealed PoC against the pod IP)
        id: exploit
        env:
          COMMAND: ${{ github.event.inputs.command || 'id>/tmp/p2s' }}
        run: |
          set -uo pipefail
          POD=$(kubectl -n php2shell get pod -l app=php2shell -o jsonpath='{.items[0].metadata.name}')
          POD_IP=$(kubectl -n php2shell get pod "$POD" -o jsonpath='{.status.podIP}')
          echo "target pod=$POD ip=$POD_IP"
          echo "pod=$POD" >> "$GITHUB_OUTPUT"
          WORK=/tmp/php2shell-poc
          mkdir -p "$WORK"
          [ -d "$WORK/src" ] || git clone --depth 1 https://github.com/devploit/php2shell "$WORK/src"
          [ -f "$WORK/src/requirements.txt" ] && python3 -m pip install --user -r "$WORK/src/requirements.txt" || true
          ATTEMPTS="${ATTEMPTS:-8}"
          landed=0
          for try in $(seq 1 "$ATTEMPTS"); do
            echo "================= exploit pass $try/$ATTEMPTS ================="
            bash pkg/attack/php2shell/private/run-php2shell.sh "http://$POD_IP/index.php" "$COMMAND" "$WORK" || true
            if kubectl -n php2shell exec "$POD" -- sh -c 'test -s /tmp/p2s' 2>/dev/null; then
              echo "stage-3 LANDED on pass $try (proof file written => sh/id executed)"; landed=1; break
            fi
            echo "pass $try: no exec yet; re-grooming"
          done
          echo "landed=$landed" >> "$GITHUB_OUTPUT"
          [ "$landed" = 1 ] || echo "::warning::exploit did not land in $ATTEMPTS passes; node-agent log read next anyway"

      - name: Confirm RCE (independent of the PoC's blind verdict)
        if: always()
        run: |
          set -uo pipefail
          POD=${{ steps.exploit.outputs.pod }}
          echo "proof file (id output, if stage-3 landed the exec):"
          kubectl -n php2shell exec "$POD" -- sh -c 'cat /tmp/p2s 2>/dev/null || echo "(no proof file; stage-3 exec may not have landed)"'

      - name: Read detections (node-agent stdout) — PLAIN LOGS
        id: detect
        if: always()
        run: |
          set -uo pipefail
          mkdir -p artifacts
          APOD=$(kubectl -n honey get pods -l app=node-agent --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}')
          echo "node-agent pod: ${APOD:-<none>}  restarts=$(kubectl -n honey get pod "$APOD" -o jsonpath='{.status.containerStatuses[0].restartCount}' 2>/dev/null)"
          kubectl -n honey logs "$APOD" --since=40m > artifacts/node-agent.log 2>/dev/null || true
          timeout 150 kubectl -n honey logs "$APOD" -f --since=1s >> artifacts/node-agent.log 2>/dev/null || true
          echo "===================== node-agent log (plain — full run + 150s live follow) ====================="
          cat artifacts/node-agent.log
          echo "==============================================================================================="
          grep -iE 'R1505|spawned a shell' artifacts/node-agent.log | grep -i php2shell > artifacts/r1505-php2shell.txt || true
          n=$(wc -l < artifacts/r1505-php2shell.txt | tr -d ' '); n=${n:-0}
          echo "R1505(php2shell) detection lines: $n"
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "=== R1505(php2shell) ==="; cat artifacts/r1505-php2shell.txt || true

      - name: Upload detection evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: php2shell-k3s-rules-detections
          path: artifacts/
          if-no-files-found: warn

      - name: Verdict
        if: always()
        run: |
          set -uo pipefail
          n=${{ steps.detect.outputs.count || '0' }}
          {
            echo "## php2shell k3s detection demo — RULES arm"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| target | php2shell (php:8.4.26-apache, unpatched) |"
            echo "| command | ${{ github.event.inputs.command || 'id>/tmp/p2s' }} |"
            echo "| mechanism | rule R1505 (web server spawned a shell, no profile) |"
            echo "| R1505 events (php2shell) | ${n} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${n:-0}" -ge 1 ]; then
            echo "PASS: node-agent raised R1505 on php2shell ($n) — the web-server->shell spawn fired the profile-independent rule."
          elif [ "${{ github.event.inputs.strict || 'true' }}" = "true" ]; then
            echo "FAIL: no R1505 for php2shell. See artifacts/node-agent.log for the real log format."
            exit 1
          else
            echo "WARN: no R1505 for php2shell (strict=false)."
          fi
