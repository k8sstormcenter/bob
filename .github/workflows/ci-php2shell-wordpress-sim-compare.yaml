name: CI - php2shell wordpress k3s, simulation compared with the real run

on:
  push:
    branches: [ci/signature-contrast]
    paths:
      - '.github/workflows/ci-php2shell-wordpress-sim-compare.yaml'
  workflow_dispatch:
    inputs:
      command:
        description: command to land via system() (<=14 bytes)
        default: id>uploads/p
      chart_ver:
        description: kubescape-operator chart (empty = the promoted latest)
        default: ''
      pkg_ref:
        description: commit of the pkg submodule to build
        default: 7b6bef4e596bb301106ae6ffcb8b8408756830fe

permissions:
  contents: read

jobs:
  demo:
    name: WordPress + loadgen, exploit & read detection on in-runner k3s
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      COMMAND: ${{ github.event.inputs.command || 'id>uploads/p' }}
      CHART_VER: ${{ github.event.inputs.chart_ver }}
      PKG_REF: ${{ github.event.inputs.pkg_ref || '7b6bef4e596bb301106ae6ffcb8b8408756830fe' }}
      GOWORK: 'off'
      GOPRIVATE: github.com/k8sstormcenter/storage
    steps:
      - name: Checkout (with sealed exploit submodule)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          token: ${{ secrets.ENTLEIN_PAT }}


      - name: Select the pkg revision
        run: |
          set -euo pipefail
          git -C pkg fetch -q origin "$PKG_REF"
          git -C pkg checkout -q FETCH_HEAD
          git -C pkg rev-parse --short HEAD

      - name: Private storage module
        env:
          STORAGE_TOKEN: ${{ secrets.ENTLEIN_PAT }}
        run: |
          git config --global url."https://x-access-token:${STORAGE_TOKEN}@github.com/k8sstormcenter/storage".insteadOf "https://github.com/k8sstormcenter/storage"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: pkg/go.mod
          cache-dependency-path: pkg/go.sum

      - name: Build bobctl from pkg
        working-directory: pkg
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/bin"
          go build -tags internal -ldflags "-X github.com/entlein/bob/cmd.GitCommit=$(git rev-parse --short HEAD)" -o "$GITHUB_WORKSPACE/bin/bobctl-pkg" .

      - name: Fetch the php2shell-wordpress image (build only if the registry has none)
        run: |
          set -euo pipefail
          echo "${{ secrets.ENTLEIN_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMG=ghcr.io/${{ github.repository_owner }}/php2shell-wordpress
          if docker pull -q "$IMG:${GITHUB_REF_NAME//\//-}" 2>/dev/null; then
            docker tag "$IMG:${GITHUB_REF_NAME//\//-}" php2shell-wordpress:demo
          elif docker pull -q "$IMG:latest" 2>/dev/null; then
            docker tag "$IMG:latest" php2shell-wordpress:demo
          else
            echo "::notice::no published image yet; building once on this runner"
            docker build -t php2shell-wordpress:demo -f example/php2shell-wordpress/Dockerfile example/php2shell-wordpress
          fi
          docker image inspect php2shell-wordpress:demo --format '{{.Id}}'

      - name: Set up k3s natively on the runner VM
        run: |
          set -euo pipefail
          curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION=v1.33.3+k3s1 sh -s - --write-kubeconfig-mode 644
          mkdir -p ~/.kube && sudo cp /etc/rancher/k3s/k3s.yaml ~/.kube/config && sudo chown "$(id -u):$(id -g)" ~/.kube/config
          command -v helm >/dev/null 2>&1 || curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          kubectl wait --for=condition=ready node --all --timeout=150s
          kubectl get nodes -o wide
          uname -r

      - name: Import the app image into k3s containerd
        run: |
          set -euo pipefail
          docker save php2shell-wordpress:demo | sudo k3s ctr images import -
          sudo k3s ctr images ls | grep php2shell-wordpress

      - name: Install kubescape (our chart) + alertmanager
        run: |
          set -euo pipefail
          make kubescape ${CHART_VER:+KUBESCAPE_CHART_VER=$CHART_VER}
          make alertmanager

      - name: Wait for node-agent fully running, pre-load the SBoB, then settle
        run: |
          set -euo pipefail
          kubectl wait --for=condition=ready pod -l app=node-agent   -n honey --timeout=300s
          kubectl wait --for=condition=ready pod -l app=storage      -n honey --timeout=300s
          kubectl wait --for=condition=ready pod -l app=alertmanager -n honey --timeout=120s || true
          APOD=$(kubectl -n honey get pods -l app=node-agent --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}')
          echo "node-agent pod: $APOD image: $(kubectl -n honey get pod "$APOD" -o jsonpath='{.spec.containers[0].image}')"
          for i in $(seq 1 120); do
            L=$(kubectl -n honey logs "$APOD" 2>/dev/null || true)
            cw=$(printf '%s' "$L" | grep -c 'ContainerWatcher started successfully' || true)
            tr=$(printf '%s' "$L" | grep -c 'Started tracer' || true)
            rs=$(printf '%s' "$L" | grep -c 'RulesWatcher - synced rules from cluster' || true)
            if [ "${cw:-0}" -ge 1 ] && [ "${tr:-0}" -ge 15 ] && [ "${rs:-0}" -ge 1 ]; then
              echo "node-agent fully running after ~$((i*5))s (ContainerWatcher up, ${tr} tracers, rules synced)"; break
            fi
            sleep 5
          done
          kubectl create namespace wordpress --dry-run=client -o yaml | kubectl apply -f -
          curl -sSfL -o "$RUNNER_TEMP/bobctl" https://github.com/k8sstormcenter/bob/releases/download/v0.1.25/bobctl-linux-amd64 && chmod +x "$RUNNER_TEMP/bobctl"
          "$RUNNER_TEMP/bobctl" apply -n wordpress -f example/php2shell-wordpress/sbobs/cp-wordpress.yaml
          kubectl create namespace wordpress-db --dry-run=client -o yaml | kubectl apply -f -
          "$RUNNER_TEMP/bobctl" apply -n wordpress-db -f example/php2shell-wordpress/sbobs/cp-mariadb.yaml
          kubectl create namespace wordpress-loadgen --dry-run=client -o yaml | kubectl apply -f -
          "$RUNNER_TEMP/bobctl" apply -n wordpress-loadgen -f example/php2shell-wordpress/sbobs/cp-loadgen-wp-setup.yaml
          "$RUNNER_TEMP/bobctl" apply -n wordpress-loadgen -f example/php2shell-wordpress/sbobs/cp-loadgen-loadgen.yaml
          echo "settling 180s so node-agent is fully enforcing before the target exists"
          sleep 180

      - name: Deploy mariadb, WordPress (SBoB preloaded) and the loadgen
        run: |
          set -euo pipefail
          kubectl apply -f example/php2shell-wordpress/mariadb.yaml
          kubectl -n wordpress-db rollout status deployment/mariadb --timeout=300s
          sed 's#ghcr.io/k8sstormcenter/php2shell-wordpress:latest#php2shell-wordpress:demo#' \
            example/php2shell-wordpress/wordpress.yaml | kubectl apply -f -
          kubectl -n wordpress rollout status deployment/wordpress --timeout=300s
          sed 's#ghcr.io/k8sstormcenter/php2shell-wordpress:latest#php2shell-wordpress:demo#' \
            example/php2shell-wordpress/loadgen.yaml | kubectl apply -f -
          kubectl -n wordpress-loadgen rollout status deployment/loadgen --timeout=420s
          kubectl get pods -A -o wide | grep -E 'wordpress|loadgen|mariadb'
          APOD=$(kubectl -n honey get pods -l app=node-agent --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}')
          kubectl -n honey logs "$APOD" 2>/dev/null | grep -i wordpress | grep -iE 'processing container|user defined profile|adopted|never delivered' | head -5 || echo "(none yet)"

      - name: Benign window (loadgen only, 180s)
        id: benign
        run: |
          set -uo pipefail
          mkdir -p artifacts
          POD=$(kubectl -n wordpress get pod -l app=wordpress -o jsonpath='{.items[0].metadata.name}')
          date -u +%FT%TZ > artifacts/t_benign
          sleep 180
          date -u +%FT%TZ > artifacts/t_exploit
          L=$(kubectl -n wordpress logs "$POD" --since-time=$(cat artifacts/t_benign))
          up=$(printf '%s\n' "$L" | grep -c 'wp/v2/media HTTP/1.1" 201' || true)
          cm=$(printf '%s\n' "$L" | grep -c 'wp-comments-post.php HTTP/1.1" 302' || true)
          echo "benign window: uploads=$up comments=$cm"
          echo "uploads=$up" >> "$GITHUB_OUTPUT"

      - name: Pause the loadgen for the exploit window
        run: |
          set -uo pipefail
          kubectl -n wordpress-loadgen scale deployment/loadgen --replicas=0
          kubectl -n wordpress-loadgen wait --for=delete pod -l app=loadgen --timeout=120s || true
          sleep 10

      - name: Exploit (sealed PoC against the pod IP)
        id: exploit
        run: |
          set -uo pipefail
          POD=$(kubectl -n wordpress get pod -l app=wordpress -o jsonpath='{.items[0].metadata.name}')
          POD_IP=$(kubectl -n wordpress get pod "$POD" -o jsonpath='{.status.podIP}')
          echo "target pod=$POD ip=$POD_IP"
          echo "pod=$POD" >> "$GITHUB_OUTPUT"
          WORK=/tmp/php2shell-poc
          mkdir -p "$WORK"
          [ -d "$WORK/src" ] || git clone --depth 1 https://github.com/devploit/php2shell "$WORK/src"
          [ -f "$WORK/src/requirements.txt" ] && python3 -m pip install --user -r "$WORK/src/requirements.txt" || true
          ATTEMPTS="${ATTEMPTS:-8}"
          landed=0
          for try in $(seq 1 "$ATTEMPTS"); do
            echo "================= exploit pass $try/$ATTEMPTS ================="
            bash pkg/attack/php2shell/private/run-php2shell.sh "http://$POD_IP/wp-cron.php" "$COMMAND" "$WORK" || true
            proof=$(curl -s -m 10 "http://$POD_IP/${COMMAND##*>}" || true)
            if printf '%s' "$proof" | grep -q 'uid='; then
              echo "stage-3 LANDED on pass $try — proof over HTTP: $proof"; landed=1; break
            fi
            echo "pass $try: no exec yet; re-grooming"
          done
          echo "landed=$landed" >> "$GITHUB_OUTPUT"
          [ "$landed" = 1 ] || echo "::warning::exploit did not land in $ATTEMPTS passes; node-agent log read next anyway"

      - name: Close the real window
        if: always()
        run: |
          set -uo pipefail
          sleep 30
          date -u +%FT%TZ > artifacts/t_exploit_end
          sleep 20

      - name: Simulate on the same pod
        if: always()
        run: |
          set -uo pipefail
          mkdir -p /tmp/sim
          POD=$(kubectl -n wordpress get pod -l app=wordpress -o jsonpath='{.items[0].metadata.name}')
          kubectl label namespace wordpress bobctl.k8sstormcenter.io/simulation=allowed --overwrite
          bin/bobctl-pkg simulate --suite builtin:wordpress -n wordpress --pod "$POD" --container wordpress --record /tmp/sim/steps.json > /tmp/sim/simulate.txt 2>&1 || true
          grep -c '"landed": true' /tmp/sim/steps.json || true
          sleep 45

      - name: Restore the loadgen
        if: always()
        run: kubectl -n wordpress-loadgen scale deployment/loadgen --replicas=1 || true

      - name: Compare the two windows
        if: always()
        run: |
          set -uo pipefail
          APOD=$(kubectl -n honey get pods -l app=node-agent --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}')
          echo "node-agent pod: ${APOD:-<none>}  restarts=$(kubectl -n honey get pod "$APOD" -o jsonpath='{.status.containerStatuses[0].restartCount}' 2>/dev/null)"
          kubectl -n honey logs "$APOD" --timestamps --since=90m > /tmp/sim/agent.log 2>/dev/null || true
          bin/bobctl-pkg signatures compare --record /tmp/sim/steps.json --agent-log /tmp/sim/agent.log -n wordpress --container wordpress \
            --real-from "$(cat artifacts/t_exploit)" --real-to "$(cat artifacts/t_exploit_end)" | tee artifacts/sim-vs-real.txt
          bin/bobctl-pkg signatures verdict --record /tmp/sim/steps.json --agent-log /tmp/sim/agent.log -n wordpress --container wordpress \
            | sed '/^benign period/q' | tee artifacts/sim-verdict.txt

      - name: Upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: php2shell-wordpress-sim-vs-real
          path: artifacts/
          if-no-files-found: warn
