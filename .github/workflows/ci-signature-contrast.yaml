name: CI - signature contrast (learn, generalize, bind, simulate)

on:
  push:
    branches: [ci/signature-contrast]
    paths:
      - '.github/workflows/ci-signature-contrast.yaml'
  workflow_dispatch:
    inputs:
      pkg_ref:
        description: commit of the pkg submodule to build
        default: 7b6bef4e596bb301106ae6ffcb8b8408756830fe
      chart_ver:
        description: kubescape-operator chart version
        default: 1.41.0-duckling183
      learn:
        description: seconds of traffic before profiles are collected
        default: '600'

permissions:
  contents: read

env:
  GOWORK: 'off'
  GOPRIVATE: github.com/k8sstormcenter/storage
  PKG_REF: ${{ github.event.inputs.pkg_ref || '7b6bef4e596bb301106ae6ffcb8b8408756830fe' }}
  CHART_VER: ${{ github.event.inputs.chart_ver || '1.41.0-duckling183' }}
  LEARN: ${{ github.event.inputs.learn || '600' }}

jobs:
  contrast:
    name: ${{ matrix.app }}
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        app: [postgres, mariadb, redis, wordpress]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          token: ${{ secrets.ENTLEIN_PAT }}

      - name: Select the pkg revision
        run: |
          set -euo pipefail
          git -C pkg fetch -q origin "$PKG_REF"
          git -C pkg checkout -q FETCH_HEAD
          git -C pkg rev-parse --short HEAD

      - name: Private storage module
        env:
          STORAGE_TOKEN: ${{ secrets.ENTLEIN_PAT }}
        run: |
          git config --global url."https://x-access-token:${STORAGE_TOKEN}@github.com/k8sstormcenter/storage".insteadOf "https://github.com/k8sstormcenter/storage"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: pkg/go.mod
          cache-dependency-path: pkg/go.sum

      - name: Build bobctl
        working-directory: pkg
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/bin"
          go build -tags internal -ldflags "-X github.com/entlein/bob/cmd.GitCommit=$(git rev-parse --short HEAD)" -o "$GITHUB_WORKSPACE/bin/bobctl" .
          "$GITHUB_WORKSPACE/bin/bobctl" version

      - name: Set up k3s natively on the runner VM
        run: |
          set -euo pipefail
          curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION=v1.33.3+k3s1 sh -s - --write-kubeconfig-mode 644
          mkdir -p ~/.kube && sudo cp /etc/rancher/k3s/k3s.yaml ~/.kube/config && sudo chown "$(id -u):$(id -g)" ~/.kube/config
          command -v helm >/dev/null 2>&1 || curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          kubectl wait --for=condition=ready node --all --timeout=150s

      - name: Log in to the private image registries
        run: |
          echo "${{ secrets.DOCKERHUB_PAT }}" | docker login docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          echo "${{ secrets.ENTLEIN_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Install kubescape
        run: |
          set -euo pipefail
          make kubescape KUBESCAPE_CHART_VER=$CHART_VER KS_LEARN_PERIOD=8m
          kubectl wait --for=condition=ready pod -l app=node-agent -n honey --timeout=300s
          kubectl wait --for=condition=ready pod -l app=storage    -n honey --timeout=300s
          APOD=$(kubectl -n honey get pods -l app=node-agent --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}')
          for i in $(seq 1 120); do
            L=$(kubectl -n honey logs "$APOD" 2>/dev/null || true)
            cw=$(printf '%s' "$L" | grep -c 'ContainerWatcher started successfully' || true)
            tr=$(printf '%s' "$L" | grep -c 'Started tracer' || true)
            if [ "${cw:-0}" -ge 1 ] && [ "${tr:-0}" -ge 15 ]; then break; fi
            sleep 5
          done
          sleep 60

      - name: Learn, generalize, bind, replay, simulate
        run: |
          set -uo pipefail
          B="$GITHUB_WORKSPACE/bin/bobctl" REPLAY=240 pkg/workloads/run-live.sh "$GITHUB_WORKSPACE/out" "${{ matrix.app }}" > /tmp/run-live.out 2>&1 || true
          grep -E '^[0-9]{2}:[0-9]{2}:[0-9]{2} ' out/run.log || true

      - name: Result
        if: always()
        run: |
          set -uo pipefail
          A="${{ matrix.app }}"
          mkdir -p artifacts
          for f in verdict-public.txt offline-before.txt offline-after.txt sbob.yaml before.yaml generalize.log validate.log traffic-learn.log; do
            [ -f "out/$A/$f" ] && cp "out/$A/$f" "artifacts/$A-$f"
          done
          grep -E '^[0-9]{2}:[0-9]{2}:[0-9]{2} ' out/run.log > artifacts/run.log 2>/dev/null || true
          echo "== live verdict"; cat "artifacts/$A-verdict-public.txt" 2>/dev/null || echo "(no verdict)"
          echo "== offline, allow list alone"; tail -1 "artifacts/$A-offline-before.txt" 2>/dev/null || true
          echo "== offline, with fragments"; tail -1 "artifacts/$A-offline-after.txt" 2>/dev/null || true
          echo "== fragment entries left out"; grep 'not subtracting' "artifacts/$A-generalize.log" 2>/dev/null | cut -c1-200 || true
          kubectl get pods -A --no-headers | grep -v Running | head -20 || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signature-contrast-${{ matrix.app }}
          path: artifacts/
          if-no-files-found: warn
