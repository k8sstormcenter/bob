name: CI - php2shell k3s TWIN (SBoB vs rule, shadow diff)

# Two byte-identical php2shell workloads side by side on one node-agent:
#   php2shell   -> SBoB arm   (bound ContainerProfile, R0001 detection)
#   php2shell-2 -> rule arm   (no profile, R1505 web-shell rule)
# Both get the same image (built once, imported once), the same exploit, the same
# node-agent. Then we dump BOTH observed/shadow ContainerProfiles and diff them, to
# answer: do two identical workloads detect the same way, and are their shadows equal?
# Native k3s on the runner VM + the fallback-informer node-agent (chart duckling124),
# because the GitHub Azure-kernel runner's fanotify add-hook is blind (see
# MEMORY-CORRUPTION... / node-agent fallback).

on:
  workflow_dispatch:
    inputs:
      chart_ver:
        description: kubescape-operator chart (pins the fallback node-agent)
        default: 1.41.0-duckling124
      command:
        description: command to land via system() (<=14 bytes)
        default: id>/tmp/p2s
  push:
    branches: [demo/php2shell-k3s]
    paths: ['.github/workflows/ci-php2shell-k3s-twin.yaml']

permissions:
  contents: read

concurrency:
  group: php2shell-k3s-twin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  twin:
    name: Two identical php2shell workloads - SBoB vs rule, shadow diff
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout (with sealed exploit submodule)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {submodules: recursive, token: "${{ secrets.ENTLEIN_PAT }}"}

      - name: Log in to Docker Hub (private node-agent image)
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with: {registry: docker.io, username: "${{ secrets.DOCKERHUB_USERNAME }}", password: "${{ secrets.DOCKERHUB_PAT }}"}

      - name: Build the app image ONCE
        run: |
          set -euo pipefail
          docker build -t php2shell-vulnerable:demo -f example/php2shell/Dockerfile example/php2shell

      - name: Set up k3s NATIVELY on the runner VM (real fanotify path)
        run: |
          set -euo pipefail
          curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION=v1.33.3+k3s1 sh -s - --write-kubeconfig-mode 644
          mkdir -p ~/.kube && sudo cp /etc/rancher/k3s/k3s.yaml ~/.kube/config && sudo chown "$(id -u):$(id -g)" ~/.kube/config
          command -v helm >/dev/null 2>&1 || curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          kubectl wait --for=condition=ready node --all --timeout=150s

      - name: Import the ONE image into k3s containerd (both twins share it)
        run: |
          set -euo pipefail
          docker save php2shell-vulnerable:demo | sudo k3s ctr images import -

      - name: Install kubescape (fallback node-agent) + alertmanager FIRST
        run: |
          set -euo pipefail
          make kubescape KUBESCAPE_CHART_VER=${{ github.event.inputs.chart_ver || '1.41.0-duckling124' }}
          make alertmanager

      - name: Wait for node-agent FULLY running, pre-load SBoB + rule, settle
        run: |
          set -euo pipefail
          kubectl wait --for=condition=ready pod -l app=node-agent -n honey --timeout=300s
          kubectl wait --for=condition=ready pod -l app=storage    -n honey --timeout=300s
          AP=$(kubectl -n honey get pods -l app=node-agent --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}')
          for i in $(seq 1 120); do
            L=$(kubectl -n honey logs "$AP" 2>/dev/null || true)
            [ "$(printf '%s' "$L" | grep -c 'ContainerWatcher started successfully')" -ge 1 ] && \
            [ "$(printf '%s' "$L" | grep -c 'Started tracer')" -ge 15 ] && \
            [ "$(printf '%s' "$L" | grep -c 'RulesWatcher - synced rules')" -ge 1 ] && { echo "node-agent up (~$((i*5))s)"; break; }
            sleep 5
          done
          kubectl create ns php2shell --dry-run=client -o yaml | kubectl apply -f -
          # SBoB for twin #1 (php2shell), named <label>-<container> = php2shell-php2shell
          kubectl apply -f example/php2shell/sbobs/cp-php2shell.yaml
          # rule (R1505) for twin #2 (php2shell-2); bind to app=php2shell-2
          sed 's/app: php2shell$/app: php2shell-2/; s/name: php2shell-webshell-binding/name: php2shell2-webshell-binding/' \
            example/php2shell/rules/php2shell-rules.yaml | kubectl apply -f -
          sleep 180

      - name: Deploy BOTH identical twins, settle
        run: |
          set -euo pipefail
          # twin #1: SBoB-bound (label kubescape.io/user-defined-profile: php2shell)
          sed 's#ghcr.io/k8sstormcenter/php2shell-vulnerable:latest#php2shell-vulnerable:demo#' \
            example/php2shell/php2shell.yaml | kubectl apply -f -
          # twin #2: identical image, app=php2shell-2, NO user profile (rule arm)
          sed 's#ghcr.io/k8sstormcenter/php2shell-vulnerable:latest#php2shell-vulnerable:demo#' \
            example/php2shell/php2shell-2.yaml | kubectl apply -f -
          kubectl -n php2shell rollout status deploy/php2shell   --timeout=180s
          kubectl -n php2shell rollout status deploy/php2shell-2 --timeout=180s
          kubectl -n php2shell get pods -o wide
          sleep 150

      - name: Exploit BOTH twins
        env: {COMMAND: "${{ github.event.inputs.command || 'id>/tmp/p2s' }}"}
        run: |
          set -uo pipefail
          WORK=/tmp/poc; mkdir -p "$WORK"
          for app in php2shell php2shell-2; do
            POD=$(kubectl -n php2shell get pod -l app=$app -o jsonpath='{.items[0].metadata.name}')
            IP=$(kubectl -n php2shell get pod "$POD" -o jsonpath='{.status.podIP}')
            echo "=== exploiting $app ($POD $IP) ==="
            for t in $(seq 1 8); do
              bash pkg/attack/php2shell/private/run-php2shell.sh "http://$IP/index.php" "$COMMAND" "$WORK/$app" >/dev/null 2>&1 || true
              kubectl -n php2shell exec "$POD" -- test -s /tmp/p2s 2>/dev/null && { echo "$app RCE landed (try $t)"; break; }
            done
          done

      - name: Compare detections + dump & diff shadow profiles
        if: always()
        run: |
          set -uo pipefail
          mkdir -p artifacts
          AP=$(kubectl -n honey get pods -l app=node-agent --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}')
          kubectl -n honey logs "$AP" --since=45m > artifacts/node-agent.log 2>/dev/null || true
          timeout 120 kubectl -n honey logs "$AP" -f --since=1s >> artifacts/node-agent.log 2>/dev/null || true
          echo "=== DETECTIONS ==="
          echo "twin1 php2shell   R0001: $(grep -ac '"RuleID":"R0001"' artifacts/node-agent.log) | R1505: $(grep -ac '"RuleID":"R1505"' artifacts/node-agent.log)"
          for app in php2shell php2shell-2; do
            echo "-- $app --"
            grep -aE '"RuleID":"R0001"|"RuleID":"R1505"|spawned a shell|Unexpected process' artifacts/node-agent.log | grep -a "podName\":\"$app" | grep -oaE '"RuleID":"[^"]+"|"alertName":"[^"]+"' | sort | uniq -c | head
          done
          echo "=== SHADOW PROFILES (observed, per twin) ==="
          for app in php2shell php2shell-2; do
            n=$(kubectl -n php2shell get containerprofiles -o jsonpath="{range .items[*]}{.metadata.name}{\"\n\"}{end}" 2>/dev/null | grep -E "replicaset-$app-" | head -1)
            echo "-- shadow for $app = $n --"
            kubectl -n php2shell get containerprofile "$n" -o json 2>/dev/null \
              | jq '{execs:[.spec.execs[]?.path]|sort, opens:[.spec.opens[]?.path]|sort, caps:(.spec.capabilities//[]|sort), syscalls:(.spec.syscalls//[]|sort)}' > artifacts/shadow-$app.json || echo "{}" > artifacts/shadow-$app.json
          done
          echo "=== DIFF of the two shadows (behaviour only; empty diff => identical) ==="
          diff <(jq -S . artifacts/shadow-php2shell.json) <(jq -S . artifacts/shadow-php2shell-2.json) && echo "IDENTICAL behavioural shadow" || echo "^ shadows differ"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: php2shell-twin, path: artifacts/, if-no-files-found: warn}
