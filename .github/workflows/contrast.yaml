name: Contrast

on:
  workflow_dispatch:
    inputs:
      apps:
        description: space-separated applications, or all
        default: all
      pkg_ref:
        description: commit of the pkg submodule that holds the workloads
        default: bdddc63929ceee4524c8d4b9e76b3ef325ccce13
      bobctl_tag:
        description: tag of the bobctl build to download, or "build" to build it in each job from pkg_ref
        default: internal-bdddc63
      bobctl_sha256:
        description: sha256 of that build
        default: 04aae64a90d45e2760d83973b1f31654d8728d26612bc6302c0bb782976614f7
      chart_ver:
        description: kubescape-operator chart version
        default: 1.41.0-duckling193
  push:
    branches: [main]
    paths:
      - '.github/workflows/contrast.yaml'
      - '.github/actions/**'
      - '.github/contrast/**'

permissions:
  contents: read

env:
  PKG_REF: ${{ github.event.inputs.pkg_ref || 'bdddc63929ceee4524c8d4b9e76b3ef325ccce13' }}
  BOBCTL_TAG: ${{ github.event.inputs.bobctl_tag || 'internal-bdddc63' }}
  BOBCTL_SHA256: ${{ github.event.inputs.bobctl_sha256 || '04aae64a90d45e2760d83973b1f31654d8728d26612bc6302c0bb782976614f7' }}
  CHART_VER: ${{ github.event.inputs.chart_ver || '1.41.0-duckling193' }}
  ALL_APPS: php2shell php2shell-wordpress nginx2root postgres mariadb redis wordpress nginx envoy zot cert-manager keycloak kafka argo-workflows otel-collector falco-old+falco-new flux-source+flux-kustomize+flux-helm+flux-notification+flux-image-reflector+flux-image-automation mongodb memcached

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - name: Applications of this run
        id: apps
        env:
          WANT: ${{ github.event.inputs.apps || 'all' }}
        run: |
          [ "$WANT" = all ] && WANT="$ALL_APPS"
          echo "apps=$(printf '%s\n' $WANT | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  images:
    name: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: php2shell-wordpress, context: example/php2shell-wordpress, dockerfile: '', platforms: linux/amd64}
          - {name: php2shell-vulnerable, context: example/php2shell, dockerfile: '', platforms: 'linux/amd64,linux/arm64'}
          - {name: postgres-vuln, context: example/postgres-vuln, dockerfile: '', platforms: 'linux/amd64,linux/arm64'}
          - {name: redis-vulnerable, context: example/redis, dockerfile: example/redis/Dockerfile.redis-vulnerable, platforms: 'linux/amd64,linux/arm64'}
          - {name: chain-frontend, context: example/chain/frontend, dockerfile: '', platforms: 'linux/amd64,linux/arm64'}
          - {name: chain-backend, context: example/chain/backend, dockerfile: '', platforms: 'linux/amd64,linux/arm64'}
          - {name: java-poc-backend-vulnerable, context: example/java-poc/backend, dockerfile: example/java-poc/backend/Dockerfile.vulnerable, platforms: linux/amd64}
          - {name: java-poc-backend-contained, context: example/java-poc/backend, dockerfile: example/java-poc/backend/Dockerfile.contained, platforms: linux/amd64}
          - {name: java-poc-backend-patched, context: example/java-poc/backend, dockerfile: example/java-poc/backend/Dockerfile.patched, platforms: linux/amd64}
          - {name: java-poc-pathogen, context: example/java-poc/pathogen, dockerfile: '', platforms: linux/amd64}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Build image
        uses: ./.github/actions/build-image
        with:
          name: ${{ matrix.name }}
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          token: ${{ secrets.GITHUB_TOKEN }}

  contrast:
    name: ${{ matrix.app }}
    needs: [plan, images]
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.plan.outputs.apps) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          token: ${{ secrets.ENTLEIN_PAT }}

      - name: Generalize
        uses: ./.github/actions/generalize
        with:
          app: ${{ matrix.app }}
          pkg-ref: ${{ env.PKG_REF }}
          bobctl-tag: ${{ env.BOBCTL_TAG }}
          bobctl-sha256: ${{ env.BOBCTL_SHA256 }}
          chart-ver: ${{ env.CHART_VER }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          entlein-pat: ${{ secrets.ENTLEIN_PAT }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-pat: ${{ secrets.DOCKERHUB_PAT }}

      - name: Real exploit run
        if: hashFiles(format('.github/contrast/{0}.real.sh', matrix.app)) != ''
        run: bash ".github/contrast/${{ matrix.app }}.real.sh"

      - name: Simulate
        uses: ./.github/actions/simulate
        with:
          app: ${{ matrix.app }}
          chart-ver: ${{ env.CHART_VER }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contrast-${{ matrix.app }}
          path: artifacts/
          if-no-files-found: warn

  summary:
    name: Run summary
    needs: [contrast]
    if: ${{ always() && needs.contrast.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          token: ${{ secrets.ENTLEIN_PAT }}

      - name: Download what the applications produced
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: contrast-*
          path: dl

      - name: One record of the run
        run: |
          set -euo pipefail
          git -C pkg fetch -q origin "$PKG_REF"
          git -C pkg checkout -q FETCH_HEAD
          [ -f pkg/corpus/collect.py ] || { echo "this pkg revision has no corpus/collect.py" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          python3 -I pkg/corpus/collect.py dl "${{ github.run_id }}" "$CHART_VER" "$BOBCTL_TAG@$(git -C pkg rev-parse --short HEAD)" > run.json
          python3 -I - run.json >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          print("| application | type | known | ecosystem traits | gate | detected | missed | not landed | D | N | P |")
          print("|---|---|---|---|---|---|---|---|---|---|---|")
          for app, a in sorted(r["apps"].items()):
              n = {}
              for v in a["signatures"].values():
                  n[v["verdict"]] = n.get(v["verdict"], 0) + 1
              g = a.get("gate") or {}
              k = g.get("kpi") or {}
              print("| %s | %s | %s | %s | %s | %d | %d | %d | %s | %s | %s |" % (app, g.get("type", ""), g.get("corpus", ""), ", ".join(g.get("traits") or []), "pass" if g.get("pass") else "held", n.get("detected", 0), n.get("missed", 0), n.get("not-landed", 0), k.get("detectability"), k.get("noisiness"), k.get("portability")))
          PY

      - name: Upload the record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: run-record
          path: run.json
          if-no-files-found: ignore

  examples:
    name: Example SBoBs
    needs: [contrast]
    if: ${{ always() && needs.contrast.result != 'cancelled' && (github.event.inputs.apps || 'all') == 'all' }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout this revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: src
          persist-credentials: false

      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: main
          fetch-depth: 0

      - name: Download the SBoBs of this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbob-*
          path: dl

      - name: Place them under example/ and open a pull request
        working-directory: main
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          BR=ci/example-sbobs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin "$BR" 2>/dev/null; then
            git checkout -q -B "$BR" FETCH_HEAD
            git merge -q --no-edit origin/main || { git merge --abort; git checkout -q -B "$BR-${{ github.run_number }}" origin/main; BR="$BR-${{ github.run_number }}"; }
          else
            git checkout -q -B "$BR" origin/main
          fi
          ../src/scripts/place-example-sbobs.sh ../dl ../src/.github/contrast/examples.txt /tmp/placed.md
          { echo "### Gate: which SBoBs of this run go to the examples"; echo; cat /tmp/placed.md; echo; } >> "$GITHUB_STEP_SUMMARY"
          git add -A example
          if git diff --cached --quiet; then echo "No example file changes: the SBoBs that passed are already in example/." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          git commit -q -m "example: SBoBs from Contrast run ${{ github.run_number }}"
          git push -q origin "HEAD:$BR"
          {
            echo "The SBoBs under example/ as the Contrast workflow produced them in $RUN_URL."
            echo
            echo "Nothing here is edited by hand: each file is the artifact of that run with the licence header in front. An SBoB is placed only when its gate passed in that run: valid profile, usual traffic ran, sensor up, no alert from the allow list under usual traffic, none caused by a subtract entry, no simulated step missed."
            echo
            cat /tmp/placed.md
            echo
            echo '```'
            git diff --stat HEAD~1 | tail -40
            echo '```'
          } > /tmp/body.md
          if [ -z "$(gh pr list --head "$BR" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BR" --title "example: SBoBs from the Contrast workflow" --body-file /tmp/body.md || echo "::warning::the branch $BR is pushed, but the pull request could not be opened"
          else
            gh pr comment "$BR" --body-file /tmp/body.md || true
          fi
