name: CI - opsboard demo image

on:
  push:
    branches:
      - demo/opsboard-kagent
    paths:
      - 'example/opsboard-kagent/opsboard/**'
      - '.github/workflows/ci-opsboard-image.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & push opsboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: example/opsboard-kagent/opsboard
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/k8sstormcenter/opsboard-demo:${{ github.sha }}
            ghcr.io/k8sstormcenter/opsboard-demo:latest
