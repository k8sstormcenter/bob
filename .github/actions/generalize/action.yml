name: Generalize
description: Bring up a cluster with the agent, run the application under its usual traffic, and turn what was learned into a bound SBoB.

inputs:
  app:
    description: application to run (a row of pkg/workloads/apps.txt)
    required: true
  pkg-ref:
    description: commit of the pkg submodule that holds the workloads
    required: true
  bobctl-tag:
    description: tag of the bobctl build to download, or "build" to build it in the job from the pkg revision
    required: true
  bobctl-sha256:
    description: sha256 of that build
    required: true
  chart-ver:
    description: kubescape-operator chart version
    required: true
  enable-rules:
    description: rule ids switched on in addition to the chart's defaults
    required: false
    default: R0002
  learn:
    description: seconds of traffic before profiles are collected
    required: false
    default: '600'
  github-token:
    description: token that can read this repository's packages
    required: true
  entlein-pat:
    required: true
  dockerhub-username:
    required: true
  dockerhub-pat:
    required: true

runs:
  using: composite
  steps:
    - name: Select the pkg revision
      shell: bash
      run: |
        set -euo pipefail
        git -C pkg fetch -q origin "${{ inputs.pkg-ref }}"
        git -C pkg checkout -q FETCH_HEAD
        git -C pkg rev-parse --short HEAD

    - name: Fetch bobctl
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p bin
        API=https://api.github.com/repos/entlein/bob/releases
        ASSET=$(curl -fsSL -H "Authorization: Bearer ${{ inputs.entlein-pat }}" "$API/tags/${{ inputs.bobctl-tag }}" | jq -r '.assets[] | select(.name=="bobctl-internal-linux-amd64") | .id')
        curl -fsSL -H "Authorization: Bearer ${{ inputs.entlein-pat }}" -H "Accept: application/octet-stream" -o bin/bobctl "$API/assets/$ASSET"
        echo "${{ inputs.bobctl-sha256 }}  bin/bobctl" | sha256sum -c -
        chmod +x bin/bobctl
        bin/bobctl version

    - name: Set up k3s natively on the runner VM
      shell: bash
      run: |
        set -euo pipefail
        curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION=v1.33.3+k3s1 sh -s - --write-kubeconfig-mode 644
        mkdir -p ~/.kube && sudo cp /etc/rancher/k3s/k3s.yaml ~/.kube/config && sudo chown "$(id -u):$(id -g)" ~/.kube/config
        command -v helm >/dev/null 2>&1 || curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        for i in $(seq 1 30); do kubectl get nodes --no-headers 2>/dev/null | grep -q . && break; sleep 2; done
        kubectl wait --for=condition=ready node --all --timeout=150s

    - name: Install the agent
      shell: bash
      run: |
        set -euo pipefail
        echo "${{ inputs.dockerhub-pat }}" | docker login docker.io -u "${{ inputs.dockerhub-username }}" --password-stdin
        echo "${{ inputs.entlein-pat }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        make kubescape KUBESCAPE_CHART_VER=${{ inputs.chart-ver }} KS_LEARN_PERIOD=8m
        mkdir -p out
        if [ -n "${{ inputs.enable-rules }}" ]; then
          kubectl -n honey get rules default-rules -o json | python3 scripts/enable-rules.py "${{ inputs.enable-rules }}" | kubectl replace -f -
          echo "${{ inputs.enable-rules }}" > out/enabled-rules.txt
        fi
        kubectl -n honey rollout status ds/node-agent --timeout=600s
        kubectl -n honey rollout status deploy/storage --timeout=300s
        for i in $(seq 1 120); do
          APOD=$(kubectl -n honey get pods -l app=node-agent --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          L=$(kubectl -n honey logs "$APOD" 2>/dev/null || true)
          cw=$(printf '%s' "$L" | grep -c 'ContainerWatcher started successfully' || true)
          tr=$(printf '%s' "$L" | grep -c 'Started tracer' || true)
          if [ "${cw:-0}" -ge 1 ] && [ "${tr:-0}" -ge 15 ]; then break; fi
          sleep 5
        done
        sleep 60

    - name: Application-specific preparation
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        APP="${{ inputs.app }}"
        mkdir -p out
        for a in ${APP//+/ }; do
          if [ -f ".github/contrast/$a.pre.sh" ]; then bash ".github/contrast/$a.pre.sh"; else echo "no preparation for $a"; fi
        done

    - name: Learn, generalize, validate, apply, bind
      shell: bash
      env:
        LEARN: ${{ inputs.learn }}
      run: |
        set -uo pipefail
        APP="${{ inputs.app }}"
        B="$GITHUB_WORKSPACE/bin/bobctl" pkg/workloads/run-live.sh "$GITHUB_WORKSPACE/out" generalize ${APP//+/ } > /tmp/generalize.out 2>&1 || true
        grep -E '^[0-9]{2}:[0-9]{2}:[0-9]{2} ' out/run.log || true
        for A in ${APP//+/ }; do
          echo "== $A: fragment entries left out"; grep 'not subtracting' "out/$A/generalize.log" 2>/dev/null | cut -c1-200 || true
          test -f "out/$A/bound-at"
        done
