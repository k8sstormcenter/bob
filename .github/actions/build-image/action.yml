name: Build image
description: Build, push and sign one image, unless the registry already holds it for this content.

inputs:
  name:
    description: image name under ghcr.io/<owner>/
    required: true
  context:
    description: build context directory
    required: true
  dockerfile:
    description: Dockerfile path (default <context>/Dockerfile)
    required: false
    default: ''
  platforms:
    description: target platforms
    required: false
    default: linux/amd64
  token:
    description: token with packages write permission
    required: true

outputs:
  image:
    description: image reference tagged by the content of its context
    value: ${{ steps.ref.outputs.image }}
  built:
    description: true when this run built and pushed the image
    value: ${{ steps.ref.outputs.missing }}

runs:
  using: composite
  steps:
    - name: Resolve the content tag
      id: ref
      shell: bash
      run: |
        set -euo pipefail
        TREE=$(git rev-parse "HEAD:${{ inputs.context }}" | cut -c1-12)
        DF="${{ inputs.dockerfile }}"; [ -n "$DF" ] || DF="${{ inputs.context }}/Dockerfile"
        DFH=$(git hash-object "$DF" | cut -c1-6)
        IMG="ghcr.io/${{ github.repository_owner }}/${{ inputs.name }}"
        TAGS="$IMG:$TREE-$DFH,$IMG:${GITHUB_REF_NAME//\//-}"
        [ "$GITHUB_REF_NAME" = main ] && TAGS="$TAGS,$IMG:latest"
        echo "${{ inputs.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        if docker manifest inspect "$IMG:$TREE-$DFH" >/dev/null 2>&1; then missing=false; else missing=true; fi
        { echo "image=$IMG:$TREE-$DFH"; echo "img=$IMG"; echo "tags=$TAGS"; echo "dockerfile=$DF"; echo "missing=$missing"; } >> "$GITHUB_OUTPUT"
        echo "$IMG:$TREE-$DFH missing=$missing"

    - name: Set up Docker Buildx
      if: steps.ref.outputs.missing == 'true'
      uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

    - name: Build and push
      id: build
      if: steps.ref.outputs.missing == 'true'
      uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
      with:
        context: ${{ inputs.context }}
        file: ${{ steps.ref.outputs.dockerfile }}
        platforms: ${{ inputs.platforms }}
        push: true
        tags: ${{ steps.ref.outputs.tags }}

    - name: Install cosign
      if: steps.ref.outputs.missing == 'true'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Sign by digest
      if: steps.ref.outputs.missing == 'true'
      shell: bash
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
        IMG: ${{ steps.ref.outputs.img }}
      run: cosign sign --yes "${IMG}@${DIGEST}"
