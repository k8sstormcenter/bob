argocd-repo-server:
  function: clone git repositories and render manifests with helm/kustomize
  execs_include: [/usr/bin/git, /usr/local/bin/helm, /usr/local/bin/kustomize]
  egress_public_ip: true
  egress_include_dns: [github.com, charts.helm.sh]
  egress_ports: [TCP-443]
argocd-server:
  function: serve the API, and fan out to redis, repo-server and the apiserver
  egress_ports: [TCP-443, TCP-6379, TCP-8081]
  egress_include_ips: [10.43.0.1]
  opens_min: 15
argocd-application-controller:
  function: reconcile Applications — compare live vs desired and sync
  egress_ports: [TCP-443, TCP-6379, TCP-8081]
  egress_include_ips: [10.43.0.1]
argocd-notifications-controller:
  function: watch Application state and evaluate notification triggers
  egress_ports: [TCP-443, TCP-8081]
  egress_include_ips: [10.43.0.1]
  opens_min: 15
argocd-applicationset-controller:
  function: generate Applications from generators
  egress_ports: [TCP-443]
  egress_include_ips: [10.43.0.1]
  opens_min: 15
  weak: true
argocd-dex-server:
  function: serve OIDC/SSO and watch its config from the apiserver
  execs_include: [/shared/argocd-dex]
  egress_ports: [TCP-443]
  egress_include_ips: [10.43.0.1]
  opens_min: 10
argocd-redis:
  function: cache manifests and app state for the server and controller
  execs_include: [/usr/local/bin/redis-server]
  opens_min: 10
  weak: true
flux-helm-controller:
  function: reconcile helm-controller resources against the apiserver
  execs_include: [/usr/local/bin/helm-controller]
  egress_ports: [TCP-443]
  opens_min: 9
flux-image-automation-controller:
  function: reconcile image-automation-controller resources against the apiserver
  execs_include: [/usr/local/bin/image-automation-controller]
  egress_ports: [TCP-443]
  opens_min: 8
flux-image-reflector-controller:
  function: reconcile image-reflector-controller resources against the apiserver
  execs_include: [/usr/local/bin/image-reflector-controller]
  egress_ports: [TCP-443]
  opens_min: 8
flux-kustomize-controller:
  function: reconcile kustomize-controller resources against the apiserver
  execs_include: [/usr/local/bin/kustomize-controller]
  egress_ports: [TCP-443]
  opens_min: 9
flux-notification-controller:
  function: reconcile notification-controller resources against the apiserver
  execs_include: [/usr/local/bin/notification-controller]
  egress_ports: [TCP-443]
  opens_min: 8
flux-source-controller:
  function: reconcile source-controller resources against the apiserver
  execs_include: [/usr/local/bin/source-controller]
  egress_ports: [TCP-443]
  opens_min: 14
