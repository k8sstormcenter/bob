# Image overrides: pin the SBoB fork of node-agent + storage (the unified
# ContainerProfile stack — node-agent binds a single CP by the
# kubescape.io/user-defined-profile pod label; storage serves the ContainerProfile
# CRD). The kubescape-operator chart (KUBESCAPE_CHART_VER in the Makefile) still
# provides operator/kubevuln/etc. at their upstream versions.
# node-agent is pinned to the -fpo build (fixes the /proc path regression,
# kubescape/node-agent#721) — the redis-distro SBoBs are learned against it.
storage:
  image:
    repository: ghcr.io/k8sstormcenter/storage
    tag: sbob-rc5s
nodeAgent:
  image:
    repository: ghcr.io/k8sstormcenter/node-agent
    tag: sbob-rc5s-fpo
  config:
    # Always export alerts to the in-cluster alertmanager. Kept HERE (not set
    # post-hoc by `make alertmanager`) so it survives every `helm upgrade` —
    # a bare `helm upgrade` used to wipe it and silence all alerts. Harmless
    # if alertmanager isn't deployed (exports just fail to connect).
    alertManagerExporterUrls:
      - alertmanager.honey.svc.cluster.local:9093
    maxLearningPeriod: 2m
    learningPeriod: 2m
    updatePeriod: 10000m
    ruleCooldown:
      ruleCooldownDuration: 0h
      ruleCooldownAfterCount: 1000000000
      ruleCooldownOnProfileFailure: false
      ruleCooldownMaxSize: 20000
capabilities:
  runtimeDetection: enable
  # kubevuln (image vulnerability scanning) is not part of the SBoB runtime-
  # detection demo — disable it so it is never installed and the install does
  # not block waiting for its deployment.
  vulnerabilityScan: disable
  relevancy: disable
  # networkEventsStreaming gates the network rules R0005 (unexpected DNS/domain)
  # and R0011 (unexpected egress) — the only rules that read the shipped
  # NetworkNeighborhood. `enable` is REQUIRED here: postgres/postgres-vuln
  # expect R0005 detections and miss them all if disabled. Process/file/exec/
  # malware rules do NOT need it. It is a per-cluster knob, not part of the
  # AP/NN policy, and adds node-agent overhead (hence default-off upstream).
  # Installer guidance: docs/portability-spec.md § D7a.
  networkEventsStreaming: enable
alertCRD:
  installDefault: true
  scopeClustered: true
clusterName: bobexample
ksNamespace: honey
excludeNamespaces: "kubescape,kube-system,kube-public,kube-node-lease,local-path-storage,gmp-system,gmp-public,storm,lightening,cert-manager,kube-flannel,ingress-nginx,olm,px-operator,honey,pl,clickhouse,chain-loadgen"
