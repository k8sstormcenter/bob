# Scenario C: logging library 2.17.1 (patched) + same ubuntu base as A. JNDI substring
# arrives intact but the library does not perform the lookup.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: java-poc
  labels: { scenario: "C" }
spec:
  replicas: 1
  selector: { matchLabels: { app: backend } }
  template:
    metadata:
      labels: { app: backend, scenario: "C" }
    spec:
      containers:
      - name: backend
        image: ghcr.io/k8sstormcenter/java-poc-backend-patched:latest
        imagePullPolicy: IfNotPresent
        env:
        - { name: POSTGRES_HOST, value: "postgres" }
        - { name: POSTGRES_DB,   value: "appdb" }
        - { name: POSTGRES_USER, value: "postgres" }
        ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: backend, namespace: java-poc }
spec:
  selector: { app: backend }
  ports: [{ port: 8080, targetPort: 8080 }]
