apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ContainerProfile
metadata:
  annotations:
    kubescape.io/managed-by: User
  name: postgres
  namespace: java-poc
spec:
  architectures:
    - amd64
  capabilities:
    - CAP_CHOWN
    - CAP_DAC_OVERRIDE
    - CAP_DAC_READ_SEARCH
    - CAP_FOWNER
    - CAP_FSETID
    - CAP_KILL
    - CAP_SETGID
    - CAP_SETUID
  egress:
    - {dns: "", dnsNames: null, identifier: egress-kube-dns, ipAddress: "", namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}, podSelector: {matchLabels: {k8s-app: kube-dns}}, ports: [{name: UDP-53, port: 53, protocol: UDP}, {name: TCP-53, port: 53, protocol: TCP}], type: internal}
  endpoints:
    - {direction: inbound, endpoint: ':5432/', internal: true}
  execs:
    - {args: [/usr/bin/psql], path: /usr/bin/psql}
    - {args: [initdb], path: /usr/lib/postgresql/16/bin/initdb}
    - {args: [pg_isready], path: /usr/lib/postgresql/16/bin/pg_isready}
    - {args: [postgres], path: /usr/lib/postgresql/16/bin/postgres}
    - {args: [/usr/local/bin/docker-entrypoint.sh, postgres], path: /usr/local/bin/docker-entrypoint.sh}
  identifiedCallStacks: null
  imageID: docker.io/library/postgres@sha256:da8cf245a60506e50a0a8cbb0f39c559ca622d92490605b67fcadc74ca1ea8e4
  imageTag: docker.io/library/postgres:16
  ingress:
    - {dns: "", dnsNames: null, identifier: ingress-from-backend, ipAddress: "", namespaceSelector: null, podSelector: {matchLabels: {app: backend}}, ports: [{name: TCP-5432, port: 5432, protocol: TCP}], type: internal}
  matchLabels:
    app: postgres
  opens:
    - {flags: [O_RDONLY], path: /docker-entrypoint-initdb.d}
    - {flags: [O_RDONLY], path: /etc/group}
    - {flags: [O_RDONLY], path: /etc/hosts}
    - {flags: [O_RDONLY], path: /etc/localtime}
    - {flags: [O_RDONLY], path: /etc/nsswitch.conf}
    - {flags: [O_RDONLY], path: /etc/passwd}
    - {flags: [O_RDONLY], path: /etc/resolv.conf}
    - {flags: [O_CREAT, O_RDWR], path: /tmp}
    - {flags: [O_RDONLY], path: /usr/share/postgresql}
    - {flags: [O_CREAT, O_RDWR], path: /var/lib/postgresql/data}
    - {flags: [O_CREAT, O_RDWR], path: /var/run/postgresql}
  rulePolicies: {}
  seccompProfile:
    spec:
      defaultAction: ""
  syscalls: null
status: {}
