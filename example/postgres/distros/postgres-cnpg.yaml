# Fork 3: CloudNativePG (operator-managed `Cluster`, image cnpg/postgresql:17.5).
# The operator owns the server pod; the pg-client pod (SAME postgres:18 image as
# every other fork, so ONE portable client SBoB covers all three) is where the
# functional suite and attacks exec. Requires the CNPG operator (installed by
# deploy-distros.sh). pg-client connects to the operator's `pg-rw` service and
# reads the `pg-app` secret the operator generates.
apiVersion: v1
kind: Namespace
metadata:
  name: postgres-cnpg
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg
  namespace: postgres-cnpg
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  enableSuperuserAccess: true
  bootstrap:
    initdb:
      database: app
      owner: app
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
      postInitApplicationSQL:
        - |
          CREATE TABLE IF NOT EXISTS bobtest (
            id SERIAL PRIMARY KEY,
            key TEXT NOT NULL,
            value TEXT,
            created_at TIMESTAMPTZ DEFAULT NOW()
          );
        # postInitApplicationSQL runs as the superuser, so bobtest would be owned
        # by postgres and pg_dump as app cannot lock it. The other two distros let
        # app own its own tables; match that.
        - ALTER TABLE bobtest OWNER TO app;
        - INSERT INTO bobtest (key, value) VALUES ('init', 'baseline');
  storage:
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  postgresql:
    parameters:
      shared_buffers: "64MB"
      log_statement: "all"
---
apiVersion: v1
kind: Pod
metadata:
  name: pg-client
  namespace: postgres-cnpg
  labels:
    app: pg-client
    app.kubernetes.io/name: pg-client
spec:
  containers:
    - name: pg-client
      image: postgres:18
      command: ["sleep", "infinity"]
      env:
        - name: PGHOST
          value: "pg-rw"
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE
          value: "app"
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: pg-app
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: pg-app
              key: password
  restartPolicy: Never
---
apiVersion: v1
kind: Service
metadata:
  name: pg-client
  namespace: postgres-cnpg
spec:
  selector:
    app: pg-client
  clusterIP: None
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
