apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ContainerProfile
metadata:
  name: postgres-bitnami
  namespace: postgres-bitnami
  annotations: {kubescape.io/managed-by: User}
spec:
  architectures: [amd64]
  matchLabels: {app.kubernetes.io/component: primary, app.kubernetes.io/instance: pg-bitnami, app.kubernetes.io/name: postgresql}
  execs:
  - path: /opt/bitnami/postgresql/bin/initdb
    args: [/opt/bitnami/postgresql/bin/initdb, -E, UTF8, -D, /bitnami/postgresql/data, -U, postgres]
  - path: /opt/bitnami/postgresql/bin/pg_ctl
    args: [/opt/bitnami/postgresql/bin/pg_ctl, start, -W, -D, /bitnami/postgresql/data, -l, /opt/bitnami/postgresql/logs/postgresql.log, -o, --config-file=/opt/bitnami/postgresql/conf/postgresql.conf --external_pid_file=/opt/bitnami/postgresql/tmp/postgresql.pid --hba_file=/opt/bitnami/postgresql/conf/pg_hba.conf]
  - path: /opt/bitnami/postgresql/bin/pg_ctl
    args: [/opt/bitnami/postgresql/bin/pg_ctl, stop, -w, -D, /bitnami/postgresql/data, -m, fast, -t, '60']
  - path: /opt/bitnami/postgresql/bin/pg_isready
    args: [/opt/bitnami/postgresql/bin/pg_isready, -U, postgres, -p, '5432', -h, 127.0.0.1]
  - path: /opt/bitnami/postgresql/bin/pg_isready
    args: [/opt/bitnami/postgresql/bin/pg_isready, -U, app, -d, dbname=app, -h, 127.0.0.1, -p, '5432']
  - path: /opt/bitnami/postgresql/bin/postgres
    args: [/opt/bitnami/postgresql/bin/postgres, ⋯⋯]
  - path: /opt/bitnami/postgresql/bin/psql
    args: [/opt/bitnami/postgresql/bin/psql, --version]
  - path: /opt/bitnami/postgresql/bin/psql
    args: [/opt/bitnami/postgresql/bin/psql, -U, postgres, -p, '5432', -h, 127.0.0.1]
  - path: /opt/bitnami/postgresql/bin/psql
    args: [/opt/bitnami/postgresql/bin/psql, -U, postgres, -p, '5432', -h, 127.0.0.1, -d, app]
  - path: /usr/bin/bash
    args: [/bin/sh, -c, --, ⋯]
  - path: /usr/bin/bash
    args: [/bin/sh, ⋯, ⋯]
  - path: /usr/bin/bash
    args: [/opt/bitnami/scripts/postgresql/entrypoint.sh, /opt/bitnami/scripts/postgresql/run.sh]
  - path: /usr/bin/bash
    args: [⋯]
  - path: /usr/bin/cat
    args: [/usr/bin/cat]
  - path: /usr/bin/chmod
    args: [/usr/bin/chmod, '600', /opt/bitnami/postgresql/conf/.pgpass]
  - path: /usr/bin/chmod
    args: [/usr/bin/chmod, go-rwx, /bitnami/postgresql/data]
  - path: /usr/bin/chmod
    args: [/usr/bin/chmod, u+rwx, /bitnami/postgresql/data]
  - path: /usr/bin/cp
    args: [/usr/bin/cp, -nr, /opt/bitnami/postgresql/conf.default/., /opt/bitnami/postgresql/conf]
  - path: /usr/bin/date
    args: [/usr/bin/date, '+%T.%2N ']
  - path: /usr/bin/find
    args: [/usr/bin/find, /docker-entrypoint-initdb.d/, -type, f, -regex, .*\.\(sh\|sql\|sql.gz\)]
  - path: /usr/bin/find
    args: [/usr/bin/find, /docker-entrypoint-preinitdb.d/, -type, f, -name, '*.sh']
  - path: /usr/bin/getent
    args: [/usr/bin/getent, passwd, '1001']
  - path: /usr/bin/grep
