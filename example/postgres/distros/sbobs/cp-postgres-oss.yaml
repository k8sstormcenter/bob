  - {path: /usr/bin/dash, args: [/bin/sh, -c, --, locale -a]}
  - {path: /usr/bin/dash, args: [/bin/sh, -c, exec "/usr/lib/postgresql/17/bin/postgres" -D "/var/lib/postgresql/data/pgdata" -c listen_addresses= -p 5432  < "/dev/null" 2>&1]}
  - {path: /usr/bin/env, args: [/usr/local/bin/docker-entrypoint.sh, postgres]}
  - {path: /usr/bin/find, args: [/usr/bin/find, ⋯, '!', -user, postgres, -exec, chown, postgres, '{}', +]}
  - {path: /usr/bin/getent, args: [/usr/bin/getent, passwd, '999']}
  - {path: /usr/bin/id, args: [/usr/bin/id, -u]}
  - {path: /usr/bin/locale, args: [/usr/bin/locale, -a]}
  - {path: /usr/bin/ls, args: [/usr/bin/ls, /docker-entrypoint-initdb.d/]}
  - {path: /usr/bin/mkdir, args: [/usr/bin/mkdir, -p, ⋯]}
  - {path: /usr/bin/perl, args: [/usr/bin/psql, -v, ON_ERROR_STOP=1, --username, app, --no-password, --no-psqlrc, --dbname, app, -f, /docker-entrypoint-initdb.d/10-bobtest.sql]}
  - {path: /usr/bin/perl, args: [/usr/bin/psql, -v, ON_ERROR_STOP=1, --username, app, --no-password, --no-psqlrc, --dbname, postgres, --set, db=app]}
  - {path: /usr/bin/perl, args: [/usr/bin/psql, -v, ON_ERROR_STOP=1, --username, app, --no-password, --no-psqlrc, --dbname, postgres, --set, db=app, --tuples-only]}
