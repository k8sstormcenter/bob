  - {path: /usr/lib/postgresql/⋯/bin/psql, args: [/usr/lib/postgresql/⋯/bin/psql, -v, ON_ERROR_STOP=1, --username, app, --no-password, --no-psqlrc, --dbname, postgres, --set, db=app]}
