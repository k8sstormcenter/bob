apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ContainerProfile
metadata:
  name: postgres-oss
  namespace: postgres-oss
  annotations: {kubescape.io/managed-by: User}
spec:
  architectures: [amd64]
  matchLabels: {app.kubernetes.io/name: postgres}
  execs:
  - path: /usr/bin/bash
    args: [/usr/bin/bash, /usr/local/bin/docker-entrypoint.sh, postgres]
  - path: /usr/bin/cat
    args: [/usr/bin/cat]
  - path: /usr/bin/chmod
    args: [/usr/bin/chmod, '00700', /var/lib/postgresql/data/pgdata]
  - path: /usr/bin/chmod
    args: [/usr/bin/chmod, '03775', /var/run/postgresql]
  - path: /usr/bin/chown
    args: [/usr/bin/chown, postgres, /var/lib/postgresql/data/pgdata]
  - path: /usr/bin/dash
    args: [/bin/sh, -c, --, ⋯]
  - path: /usr/bin/dash
    args: [/bin/sh, -c, exec "/usr/lib/postgresql/17/bin/postgres" -D "/var/lib/postgresql/data/pgdata" -c listen_addresses= -p 5432  < "/dev/null" 2>&1]
  - path: /usr/bin/env
    args: [/usr/local/bin/docker-entrypoint.sh, postgres]
  - path: /usr/bin/find
    args: [/usr/bin/find, ⋯, '!', -user, postgres, -exec, chown, postgres, '{}', +]
  - path: /usr/bin/getent
    args: [/usr/bin/getent, passwd, '999']
  - path: /usr/bin/id
    args: [/usr/bin/id, -u]
  - path: /usr/bin/locale
    args: [/usr/bin/locale, -a]
  - path: /usr/bin/ls
    args: [/usr/bin/ls, /docker-entrypoint-initdb.d/]
  - path: /usr/bin/mkdir
    args: [/usr/bin/mkdir, -p, ⋯]
  - path: /usr/bin/perl
    args: [/usr/bin/psql, -v, ON_ERROR_STOP=1, --username, app, --no-password, --no-psqlrc, --dbname, app, -f, /docker-entrypoint-initdb.d/10-bobtest.sql]
  - path: /usr/bin/perl
    args: [/usr/bin/psql, -v, ON_ERROR_STOP=1, --username, app, --no-password, --no-psqlrc, --dbname, postgres, --set, db=app, --tuples-only]
  - path: /usr/bin/perl
    args: [/usr/bin/psql, -v, ON_ERROR_STOP=1, --username, app, --no-password, --no-psqlrc, --dbname, postgres, --set, db=app]
  - path: /usr/lib/postgresql/⋯/bin/initdb
    args: [/usr/lib/postgresql/⋯/bin/initdb, --username=app, --pwfile=/dev/fd/⋯]
  - path: /usr/lib/postgresql/⋯/bin/pg_ctl
    args: [/usr/lib/postgresql/⋯/bin/pg_ctl, -D, /var/lib/postgresql/data/pgdata, -m, fast, -w, stop]
  - path: /usr/lib/postgresql/⋯/bin/pg_ctl
    args: [/usr/lib/postgresql/⋯/bin/pg_ctl, -D, /var/lib/postgresql/data/pgdata, -o, '-c listen_addresses= -p 5432 ', -w, start]
  - path: /usr/lib/postgresql/⋯/bin/postgres
    args: [/usr/lib/postgresql/⋯/bin/postgres, ⋯⋯]
  - path: /usr/lib/postgresql/⋯/bin/psql
    args: [/usr/lib/postgresql/⋯/bin/psql, -v, ON_ERROR_STOP=1, --username, app, --no-password, --no-psqlrc, --dbname, app, -f, /docker-entrypoint-initdb.d/10-bobtest.sql]
  - path: /usr/lib/postgresql/⋯/bin/psql
    args: [/usr/lib/postgresql/⋯/bin/psql, -v, ON_ERROR_STOP=1, --username, app, --no-password, --no-psqlrc, --dbname, postgres, --set, db=app, --tuples-only]
  - path: /usr/lib/postgresql/⋯/bin/psql
    args: [/usr/lib/postgresql/⋯/bin/psql, -v, ON_ERROR_STOP=1, --username, app, --no-password, --no-psqlrc, --dbname, postgres, --set, db=app]
  - path: /usr/local/bin/gosu
    args: [/usr/local/bin/gosu, postgres, /usr/local/bin/docker-entrypoint.sh, postgres]
  opens:
  - path: /dev/fd/⋯
    flags: [O_RDONLY]
  - path: /dev/null
    flags: [O_CREAT, O_RDONLY, O_TRUNC, O_WRONLY]
  - path: /dev/shm/⋯
    flags: [O_CLOEXEC, O_CREAT, O_EXCL, O_NOFOLLOW, O_RDWR]
  - path: /dev/tty
    flags: [O_NONBLOCK, O_RDWR]
  - path: /dev/urandom
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /etc/gai.conf
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /etc/group
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /etc/ld.so.cache
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /etc/locale.alias
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /etc/nsswitch.conf
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /etc/passwd
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /etc/ssl/openssl.cnf
    flags: [O_RDONLY]
  - path: /proc/⋯
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /proc/⋯/kernel/*
    flags: [O_RDONLY]
  - path: /proc/⋯/task/*
    flags: [O_CLOEXEC, O_DIRECTORY, O_RDONLY]
  - path: /run/postgresql
    flags: [O_CLOEXEC, O_DIRECTORY, O_NOCTTY, O_NOFOLLOW, O_NONBLOCK, O_RDONLY]
  - path: /run/postgresql/.s.PGSQL.5432.lock
    flags: [O_CREAT, O_EXCL, O_RDWR]
  - path: /sys/kernel/mm/transparent_hugepage/hpage_pmd_size
    flags: [O_RDONLY]
  - path: /usr/lib/locale
    flags: [O_CLOEXEC, O_DIRECTORY, O_NONBLOCK, O_RDONLY]
  - path: /usr/lib/locale/C.utf8/LC_CTYPE
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /usr/lib/locale/locale-archive
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /usr/lib/postgresql
    flags: [O_CLOEXEC, O_DIRECTORY, O_NONBLOCK, O_RDONLY]
  - path: /usr/lib/postgresql/⋯/lib
    flags: [O_CLOEXEC, O_DIRECTORY, O_NONBLOCK, O_RDONLY]
  - path: /usr/lib/postgresql/⋯/lib/dict_snowball.so
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /usr/lib/postgresql/⋯/lib/plpgsql.so
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /usr/lib/x86_64-linux-gnu/*
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /usr/lib/x86_64-linux-gnu/perl-base/*
    flags: [O_RDONLY]
  - path: /usr/lib/x86_64-linux-gnu/perl-base/Exporter/⋯
    flags: [O_RDONLY]
  - path: /usr/lib/x86_64-linux-gnu/perl-base/IPC/⋯
    flags: [O_RDONLY]
  - path: /usr/lib/x86_64-linux-gnu/perl-base/Tie/⋯
    flags: [O_RDONLY]
  - path: /usr/lib/x86_64-linux-gnu/perl-base/auto/Fcntl/⋯
    flags: [O_RDONLY]
  - path: /usr/lib/x86_64-linux-gnu/perl-base/auto/POSIX/⋯
    flags: [O_RDONLY]
  - path: /usr/lib/x86_64-linux-gnu/perl-base/auto/Socket/⋯
    flags: [O_RDONLY]
  - path: /usr/lib/x86_64-linux-gnu/perl-base/warnings/⋯
    flags: [O_RDONLY]
  - path: /usr/lib/x86_64-linux-gnu/perl-base/⋯
    flags: [O_RDONLY]
  - path: /usr/lib/x86_64-linux-gnu/perl-base/⋯/*
    flags: [O_RDONLY]
  - path: /usr/lib/x86_64-linux-gnu/perl-base/⋯/⋯/*
    flags: [O_RDONLY]
  - path: /usr/lib/x86_64-linux-gnu/⋯
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /usr/local/bin/docker-entrypoint.sh
    flags: [O_RDONLY]
  - path: /usr/share/locale/en.utf8/LC_MESSAGES/*
    flags: [O_RDONLY]
  - path: /usr/share/locale/en/LC_MESSAGES/*
    flags: [O_RDONLY]
  - path: /usr/share/locale/en_US.utf8/LC_MESSAGES/*
    flags: [O_RDONLY]
  - path: /usr/share/locale/en_US/LC_MESSAGES/*
    flags: [O_RDONLY]
  - path: /usr/share/perl5/PgCommon.pm
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /usr/share/postgresql-common/pg_wrapper
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /usr/share/postgresql/*
    flags: [O_RDONLY]
  - path: /usr/share/postgresql/postgresql.conf.sample
    flags: [O_RDONLY]
  - path: /usr/share/postgresql/⋯/*
    flags: [O_RDONLY]
  - path: /usr/share/zoneinfo
    flags: [O_CLOEXEC, O_DIRECTORY, O_NONBLOCK, O_RDONLY]
  - path: /usr/share/zoneinfo/Etc
    flags: [O_CLOEXEC, O_DIRECTORY, O_NONBLOCK, O_RDONLY]
  - path: /usr/share/zoneinfo/Etc/UTC
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /usr/share/zoneinfo/share/zoneinfo/Etc/UTC
    flags: [O_RDONLY]
  - path: /usr/share/zoneinfo/zoneinfo/Etc/UTC
    flags: [O_RDONLY]
  - path: /var/lib/postgresql/data/pgdata
    flags: [O_CLOEXEC, O_DIRECTORY, O_NOCTTY, O_NOFOLLOW, O_NONBLOCK, O_RDONLY]
  - path: /var/lib/postgresql/data/pgdata/*
    flags: [O_CLOEXEC, O_CREAT, O_DIRECTORY, O_EXCL, O_NONBLOCK, O_RDONLY, O_RDWR, O_TRUNC, O_WRONLY]
  - path: /var/lib/postgresql/data/pgdata/⋯
    flags: [O_APPEND, O_CLOEXEC, O_CREAT, O_DIRECTORY, O_EXCL, O_NONBLOCK, O_RDONLY, O_RDWR, O_TRUNC, O_WRONLY]
  capabilities: [CAP_CHOWN, CAP_FOWNER, CAP_FSETID, CAP_SETGID, CAP_SETUID]
  rulePolicies:
    R0002:
      processAllowed: [postgres, 'runc:[1:INIT]', 'runc:[1:CHILD]', 'runc:[2:INIT]', 'runc:[3:INIT]']
    R0004:
      processAllowed: ['runc:[1:INIT]', 'runc:[1:CHILD]', 'runc:[2:INIT]', 'runc:[3:INIT]']
  endpoints: null
  ingress:
  - identifier: pg-client
    type: internal
    podSelector:
      matchLabels: {app: pg-client}
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: postgres-oss}
    ports:
    - {name: TCP-5432, port: 5432, protocol: TCP}
  egress: null
