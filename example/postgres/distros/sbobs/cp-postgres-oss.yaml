  - {path: /usr/bin/dash, args: [/bin/sh, -c, --, '"/usr/lib/postgresql/17/bin/postgres" --check -F -c log_checkpoints=false  -c max_connections=100 -c shared_buffers=1000 -c dynamic_shared_memory_type=posix < "/dev/null" > "/dev/null" 2>&1']}
  - {path: /usr/bin/dash, args: [/bin/sh, -c, --, '"/usr/lib/postgresql/17/bin/postgres" --check -F -c log_checkpoints=false  -c max_connections=100 -c shared_buffers=16384 -c dynamic_shared_memory_type=posix < "/dev/null" > "/dev/null" 2>&1']}
