apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ContainerProfile
metadata:
  annotations: {kubescape.io/managed-by: User}
  name: postgres-oss
  namespace: postgres-oss
spec:
  architectures: [amd64]
  capabilities: [CAP_CHOWN, CAP_FOWNER, CAP_FSETID, CAP_SETGID, CAP_SETUID]
  egress: null
  endpoints: null
  execs:
  - {path: /usr/bin/bash, args: [/usr/bin/bash, /usr/local/bin/docker-entrypoint.sh, postgres]}
  - {path: /usr/bin/cat, args: [/usr/bin/cat]}
  - {path: /usr/bin/chmod, args: [/usr/bin/chmod, '00700', /var/lib/postgresql/data/pgdata]}
  - {path: /usr/bin/chmod, args: [/usr/bin/chmod, '03775', /var/run/postgresql]}
