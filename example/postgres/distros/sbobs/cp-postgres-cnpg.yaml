apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ContainerProfile
metadata:
  name: postgres-cnpg
  namespace: postgres-cnpg
  annotations: {kubescape.io/managed-by: User}
spec:
  architectures: [amd64]
  matchLabels: {cnpg.io/cluster: pg}
  execs:
  - path: /bin/dash
    args: [⋯⋯]
  - path: /controller/manager
    args: [/controller/manager, instance, run, --status-port-tls, --log-level=info]
  - path: /usr/bin/perl
    args: [/usr/bin/pg_isready, -U, postgres, -d, postgres, -q]
  - path: /usr/lib/postgresql/⋯/bin/pg_controldata
    args: [/usr/lib/postgresql/⋯/bin/pg_controldata]
  - path: /usr/lib/postgresql/⋯/bin/pg_isready
    args: [/usr/lib/postgresql/⋯/bin/pg_isready, -U, postgres, -d, postgres, -q]
  - path: /usr/lib/postgresql/⋯/bin/postgres
    args: [/usr/lib/postgresql/⋯/bin/postgres, ⋯⋯]
  opens:
  - path: /controller/log/postgres.json
    flags: [O_RDWR, O_CREAT, O_APPEND]
  - path: /controller/manager
    flags: [O_RDONLY]
  - path: /dev/null
    flags: [O_CLOEXEC, O_RDONLY, O_WRONLY]
  - path: /dev/shm/⋯
    flags: [O_CLOEXEC, O_CREAT, O_EXCL, O_NOFOLLOW, O_RDWR]
  - path: /dev/urandom
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /etc/gai.conf
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /etc/hosts
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /etc/ld.so.cache
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /etc/locale.alias
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /etc/nsswitch.conf
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /etc/passwd
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /etc/resolv.conf
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /etc/ssl/openssl.cnf
    flags: [O_RDONLY]
  - path: /lib/x86_64-linux-gnu/*
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /plugins
    flags: [O_RDONLY]
  - path: /proc/⋯
    flags: [O_RDONLY]
  - path: /proc/⋯/coredump_filter
    flags: [O_CLOEXEC, O_CREAT, O_TRUNC, O_WRONLY]
  - path: /proc/⋯/net/*
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /proc/⋯/task/*
    flags: [O_CLOEXEC, O_DIRECTORY, O_RDONLY]
  - path: /run/secrets/kubernetes.io/serviceaccount/⋯/ca.crt
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /run/secrets/kubernetes.io/serviceaccount/⋯/token
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /sys/kernel/mm/transparent_hugepage/hpage_pmd_size
    flags: [O_RDONLY]
  - path: /usr/lib/locale/locale-archive
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /usr/lib/postgresql
    flags: [O_CLOEXEC, O_DIRECTORY, O_NONBLOCK, O_RDONLY]
  - path: /usr/lib/postgresql/⋯/lib
    flags: [O_CLOEXEC, O_DIRECTORY, O_NONBLOCK, O_RDONLY]
  - path: /usr/lib/x86_64-linux-gnu/*
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /usr/lib/x86_64-linux-gnu/*/Fcntl.so
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /usr/lib/x86_64-linux-gnu/*/Glob/Glob.so
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /usr/lib/x86_64-linux-gnu/*/POSIX.so
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /usr/lib/x86_64-linux-gnu/*/Socket.so
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /usr/lib/x86_64-linux-gnu/perl-base/*
    flags: [O_RDONLY]
  - path: /usr/lib/x86_64-linux-gnu/perl-base/⋯/*
    flags: [O_RDONLY]
  - path: /usr/lib/x86_64-linux-gnu/perl-base/⋯/⋯/*
    flags: [O_RDONLY]
  - path: /usr/lib/x86_64-linux-gnu/⋯
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /usr/share/locale/en.utf8/LC_MESSAGES/*
    flags: [O_RDONLY]
  - path: /usr/share/locale/en/LC_MESSAGES/*
    flags: [O_RDONLY]
  - path: /usr/share/locale/en_US.utf8/LC_MESSAGES/*
    flags: [O_RDONLY]
  - path: /usr/share/locale/en_US/LC_MESSAGES/*
    flags: [O_RDONLY]
  - path: /usr/share/perl5/PgCommon.pm
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /usr/share/postgresql-common/pg_wrapper
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /usr/share/postgresql/⋯/timezonesets/Default
    flags: [O_RDONLY]
  - path: /usr/share/zoneinfo
    flags: [O_CLOEXEC, O_DIRECTORY, O_NONBLOCK, O_RDONLY]
  - path: /usr/share/zoneinfo/Etc
    flags: [O_CLOEXEC, O_DIRECTORY, O_NONBLOCK, O_RDONLY]
  - path: /usr/share/zoneinfo/Etc/UTC
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /var/lib/postgresql/.pgpass
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /var/lib/postgresql/data/pgdata/*
    flags: [O_CLOEXEC, O_CREAT, O_DIRECTORY, O_NONBLOCK, O_RDONLY, O_RDWR, O_TRUNC, O_WRONLY]
  - path: /var/lib/postgresql/data/pgdata/⋯
    flags: [O_CLOEXEC, O_CREAT, O_DIRECTORY, O_EXCL, O_NONBLOCK, O_RDONLY, O_RDWR, O_TRUNC, O_WRONLY]
  capabilities: [CAP_DAC_OVERRIDE, CAP_DAC_READ_SEARCH, CAP_NET_ADMIN]
  rulePolicies:
    R0002:
      processAllowed: [postgres, 'runc:[1:INIT]', 'runc:[1:CHILD]', 'runc:[2:INIT]', 'runc:[3:INIT]']
    R0004:
      processAllowed: ['runc:[1:INIT]', 'runc:[1:CHILD]', 'runc:[2:INIT]', 'runc:[3:INIT]']
    R0006:
      processAllowed: [manager]
  endpoints: null
  ingress:
  - identifier: pg-client
    type: internal
    podSelector:
      matchLabels: {app: pg-client}
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: postgres-cnpg}
    ports:
    - {name: TCP-5432, port: 5432, protocol: TCP}
  - identifier: kubelet-probes
    type: internal
    entity: host
    ports:
    - {name: TCP-8000, port: 8000, protocol: TCP}
    ipAddresses: [10.42.0.1/32, 192.168.0.191/32]
  - identifier: cnpg-operator
    type: internal
    podSelector:
      matchLabels: {app.kubernetes.io/name: cloudnative-pg}
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: cnpg-system}
    ports:
    - {name: TCP-8000, port: 8000, protocol: TCP}
  egress: null
