# Contained in-cluster sink for exfil-http-dbdump. Plain nginx :80 so Pixie
# parses the exfil POST body into http_events (over TLS only conn_stats shows).
# Data never leaves the cluster. DNS exfil needs no sink.
apiVersion: v1
kind: Namespace
metadata:
  name: exfil
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exfil-sink
  namespace: exfil
spec:
  replicas: 1
  selector:
    matchLabels: { app: exfil-sink }
  template:
    metadata:
      labels: { app: exfil-sink }
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: exfil-sink
  namespace: exfil
spec:
  selector: { app: exfil-sink }
  ports: [{ port: 80, targetPort: 80 }]
