# argocd-redis — attack leg (one container = one suite, skill §8).
#
# redis runs a busybox/alpine base, so its baseline is tiny and any
# coreutil below is anomalous by contrast. Rule names verbatim from
# kubescape/default-rules.yaml.
#
# Honest boundaries: R0009 (bpf(2) EPERM, unprivileged) and R1001 (this
# node-agent build emits zero R1001 cluster-wide — the drifted exec trips R1000).
apiVersion: bobctl.k8sstormcenter.io/v1alpha1
kind: AttackSuite
metadata:
  name: argocd-redis-killchain
  description: >-
    Post-exploitation contrast leg for the redis container of Argo CD.
target:
  service: argocd-redis
  namespace: argocd
  port: 6379
  protocol: tcp

attacks:
  - name: exec-etc-passwd
    type: cmdinject
    exec: { command: ["cat", "/etc/passwd"] }
    successIndicators: [{ responseContains: "root:" }]
    expectedDetections:
      - { ruleID: R0001, ruleName: Unexpected process launched, containerName: redis, command: cat }
  - name: exec-etc-shadow
    type: cmdinject
    exec: { command: ["cat", "/etc/shadow"] }
    expectedDetections:
      - { ruleID: R0010, ruleName: Unexpected Sensitive File Access, containerName: redis, command: cat }
  - name: exec-proc-environ
    type: cmdinject
    exec: { command: ["cat", "/proc/1/environ"] }
    successIndicators: [{ responseContains: "PATH" }]
    expectedDetections:
      - { ruleID: R0008, ruleName: Read Environment Variables from procfs, containerName: redis, command: cat }
  - name: symlink-shadow
    type: cmdinject
    exec: { command: ["sh", "-c", "ln -sf /etc/shadow /tmp/sl_$$ && ls -l /tmp/sl_$$ >/dev/null && echo symlink_done; rm -f /tmp/sl_$$"] }
    successIndicators: [{ responseContains: "symlink_done" }]
    expectedDetections:
      - { ruleID: R1010, ruleName: Soft link created over sensitive file, containerName: redis, command: ln }
  - name: hardlink-shadow
    type: cmdinject
    exec: { command: ["sh", "-c", "ln /etc/shadow /tmp/hl_$$ >/dev/null 2>&1 && echo hardlink_done; rm -f /tmp/hl_$$"] }
    successIndicators: [{ responseContains: "hardlink_done" }]
    expectedDetections:
      - { ruleID: R1012, ruleName: Hard link created over sensitive file, containerName: redis, command: ln }
  - name: dns-anomaly-lookup
    type: cmdinject
    exec: { command: ["sh", "-c", "getent hosts scanner.evil-c2.example.com >/dev/null 2>&1 && echo dns_resolved || echo dns_attempted"] }
    successIndicators: [{ responseContains: "dns_" }]
    expectedDetections:
      - { ruleID: R0005, ruleName: DNS Anomalies in container, containerName: redis }
  - name: crypto-mining-dns
    type: cmdinject
    exec: { command: ["sh", "-c", "getent hosts xmr.pool.minergate.com >/dev/null 2>&1 && echo miner_dns_ok || echo miner_dns_attempted"] }
    successIndicators: [{ responseContains: "miner_dns_" }]
    expectedDetections:
      - { ruleID: R1008, ruleName: Crypto Mining Domain Communication, containerName: redis }
  - name: drifted-binary-exec
    type: cmdinject
    exec: { command: ["sh", "-c", "cp /bin/busybox /tmp/drifted_bob && printf '\n#bob-drift' >> /tmp/drifted_bob && chmod +x /tmp/drifted_bob && /tmp/drifted_bob true >/dev/null 2>&1 && echo drift_exec_done; rm -f /tmp/drifted_bob"] }
    successIndicators: [{ responseContains: "drift_exec_done" }]
    expectedDetections:
      - { ruleID: R1000, ruleName: Process executed from malicious source, containerName: redis }
  - name: exec-from-shm-mount
    type: cmdinject
    exec: { command: ["sh", "-c", "cp /bin/busybox /dev/shm/shm_payload && chmod +x /dev/shm/shm_payload && /dev/shm/shm_payload true && echo shm_exec_done; rm -f /dev/shm/shm_payload"] }
    successIndicators: [{ responseContains: "shm_exec_done" }]
    expectedDetections:
      - { ruleID: R1004, ruleName: Process executed from mount, containerName: redis }
  - name: egress-external-c2
    type: cmdinject
    exec: { command: ["sh", "-c", "nc -w 2 1.1.1.1 80 </dev/null >/dev/null 2>&1; echo egress_attempted"] }
    successIndicators: [{ responseContains: "egress_attempted" }]
    expectedDetections:
      - { ruleID: R0011, ruleName: Unexpected Egress Network Traffic, containerName: redis }
  # R1005 (fileless) needs memfd_create + fexecve. This is a busybox/alpine image
  # with no perl/python, so there is no way to reach the syscall. Honest boundary.
  - name: fileless-probe-unavailable
    type: cmdinject
    exec: { command: ["sh", "-c", "echo 'probe: no perl/python in this image — memfd fileless exec unreachable'; echo probe_done"] }
    successIndicators: [{ responseContains: "probe_done" }]
    expectedDetections: []

  # ── R0006 / R0007 — the SA token IS mounted here but this container NEVER reads
  # it in normal operation (its learned profile has no token opens), so unlike
  # every other Argo CD subcomponent these two rules genuinely discriminate here.
  - name: sa-token-read
    type: cmdinject
    exec: { command: ["sh", "-c", "cat /var/run/secrets/kubernetes.io/serviceaccount/token >/dev/null 2>&1 && echo sa_token_read_done || echo sa_token_absent"] }
    successIndicators: [{ responseContains: "sa_token_read_done" }]
    expectedDetections:
      - { ruleID: R0006, ruleName: Unexpected service account token access, containerName: redis, command: cat }
  - name: k8s-api-unexpected-call
    type: cmdinject
    exec: { command: ["sh", "-c", "nc -w 2 10.43.0.1 443 </dev/null >/dev/null 2>&1; echo k8s_api_probe_done"] }
    successIndicators: [{ responseContains: "k8s_api_probe_done" }]
    expectedDetections:
      - { ruleID: R0007, ruleName: Workload uses Kubernetes API unexpectedly, containerName: redis }
