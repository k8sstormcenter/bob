apiVersion: v1
kind: Service
metadata:
  name: kustomize-controller
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: flux
    control-plane: controller
spec:
  type: ClusterIP
  selector:
    app: kustomize-controller
  ports:
    - name: http-prom
      port: 8080
      targetPort: http-prom
      protocol: TCP
---
