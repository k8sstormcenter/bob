apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey-client
  namespace: valkey
  labels:
    app: valkey-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey-client
  template:
    metadata:
      labels:
        app: valkey-client
        kubescape.io/user-defined-profile: valkey-client
    spec:
      containers:
        - name: client
          image: redis:7-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              i=0
              while true; do
                redis-cli -h valkey-primary -p 6379 SET "k:$i" "v:$i" >/dev/null
                i=$((i+1)); sleep 2
              done
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
