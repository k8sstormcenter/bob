apiVersion: kubescape.io/v1
kind: Rules
metadata:
  annotations:
    signature.kubescape.io/certificate: 
    signature.kubescape.io/content: 
    signature.kubescape.io/identity: local-key
    signature.kubescape.io/issuer: local
    signature.kubescape.io/signature: MEUCICkpOEocBCEjXhflzBYM3/s2LH3LUIWIEeQ+GdefJbnGAiEAra+gfN7B3zgdlHPP9HkD7s/7atx3CWLZ7VWnE6lkSB4=
    signature.kubescape.io/timestamp: "1786709804"
  labels:
    signature.kubescape.io/fragment-class: base
  name: default-rules
  namespace: honey
spec:
  rules:
  - agentVersionRequirement: ""
    description: Detects unexpected process launches that are not in the baseline
    enabled: true
    expressions:
      message: '''Unexpected process launched: '' + event.comm + '' with PID '' +
        string(event.pid)'
      ruleExpression:
      - eventType: exec
        expression: '!cp.was_executed(event.containerId, parse.get_exec_path(event.args,
          event.comm, event.exepath))'
      uniqueId: event.comm + '_' + event.exepath
    id: R0001
    isTriggerAlert: true
    mitreTactic: TA0002
    mitreTechnique: T1059
    name: Unexpected process launched
    profileDependency: 0
    severity: 1
    supportPolicy: false
    tags:
    - anomaly
    - process
    - exec
    - applicationprofile
  - agentVersionRequirement: ""
    description: Process path is allowed by profile but argument vector does not match
      any profile entry's arg pattern (literal or wildcard ⋯/*)
    enabled: true
    expressions:
      message: '''Unexpected process arguments: '' + event.comm + '' with PID '' +
        string(event.pid)'
      ruleExpression:
      - eventType: exec
        expression: cp.was_executed(event.containerId, parse.get_exec_path(event.args,
          event.comm, event.exepath)) && !cp.was_executed_with_args(event.containerId,
          parse.get_exec_path(event.args, event.comm, event.exepath), event.args)
      uniqueId: event.comm + '_' + parse.get_exec_path(event.args, event.comm, event.exepath)
    id: R0040
    isTriggerAlert: true
    mitreTactic: TA0002
    mitreTechnique: T1059
    name: Unexpected process arguments
    profileDependency: 0
    severity: 1
    supportPolicy: false
    tags:
    - anomaly
    - process
    - exec
    - applicationprofile
  - agentVersionRequirement: ""
    description: Detects unexpected file access that is not in the baseline
    enabled: true
    expressions:
      message: '''Unexpected file access detected: '' + event.comm + '' with PID ''
        + string(event.pid) + '' to '' + event.path'
      ruleExpression:
      - eventType: open
        expression: '!cp.was_path_opened(event.containerId, event.path)'
      uniqueId: event.comm + '_' + event.path
    id: R0002
    isTriggerAlert: true
    mitreTactic: TA0009
    mitreTechnique: T1005
    name: Files Access Anomalies in container
    profileDependency: 0
    severity: 1
    supportPolicy: true
    tags:
    - anomaly
    - file
    - open
    - applicationprofile
  - agentVersionRequirement: ""
    description: Detects unexpected system calls that are not whitelisted by application
      profile
    enabled: false
    expressions:
      message: '''Unexpected system call detected: '' + event.syscallName + '' with
        PID '' + string(event.pid)'
      ruleExpression:
      - eventType: syscall
        expression: '!cp.was_syscall_used(event.containerId, event.syscallName)'
      uniqueId: event.syscallName
    id: R0003
    isTriggerAlert: false
    mitreTactic: TA0002
    mitreTechnique: T1059
    name: Syscalls Anomalies in container
    profileDependency: 0
    severity: 1
    supportPolicy: false
    tags:
    - anomaly
    - syscall
    - applicationprofile
  - agentVersionRequirement: ""
    description: Detects unexpected capabilities that are not whitelisted by application
      profile
    enabled: true
    expressions:
      message: '''Unexpected capability used: '' + event.capName + '' in syscall ''
        + event.syscallName + '' with PID '' + string(event.pid)'
      ruleExpression:
      - eventType: capabilities
        expression: '!cp.was_capability_used(event.containerId, event.capName)'
      uniqueId: event.comm + '_' + event.capName
    id: R0004
    isTriggerAlert: false
    mitreTactic: TA0002
    mitreTechnique: T1059
    name: Linux Capabilities Anomalies in container
    profileDependency: 0
    severity: 1
    supportPolicy: false
    tags:
    - anomaly
    - capabilities
    - applicationprofile
  - agentVersionRequirement: ""
    description: Detecting unexpected domain requests that are not whitelisted by
      application profile.
    enabled: true
    expressions:
      message: '''Unexpected domain communication: '' + event.name + '' from: '' +
        event.containerName'
      ruleExpression:
      - eventType: dns
        expression: '!event.name.endsWith(''.svc.cluster.local.'') && !cp.is_domain_in_egress(event.containerId,
          event.name)'
      uniqueId: event.comm + '_' + event.name
    id: R0005
    isTriggerAlert: true
    mitreTactic: TA0011
    mitreTechnique: T1071.004
    name: DNS Anomalies in container
    profileDependency: 0
    severity: 1
    supportPolicy: false
    tags:
    - dns
    - anomaly
    - networkprofile
  - agentVersionRequirement: ""
    description: Detecting unexpected access to service account token.
    enabled: true
    expressions:
      message: '''Unexpected access to service account token: '' + event.path + ''
        with flags: '' + event.flags.join('','')'
      ruleExpression:
      - eventType: open
        expression: "((event.path.startsWith('/run/secrets/kubernetes.io/serviceaccount')
          && event.path.endsWith('/token')) || \n (event.path.startsWith('/var/run/secrets/kubernetes.io/serviceaccount')
          && event.path.endsWith('/token')) ||\n (event.path.startsWith('/run/secrets/eks.amazonaws.com/serviceaccount')
          && event.path.endsWith('/token')) ||\n (event.path.startsWith('/var/run/secrets/eks.amazonaws.com/serviceaccount')
          && event.path.endsWith('/token'))) &&\n!cp.was_path_opened_with_suffix(event.containerId,
          '/token')\n"
      uniqueId: event.comm
    id: R0006
    isTriggerAlert: true
    mitreTactic: TA0006
    mitreTechnique: T1528
    name: Unexpected service account token access
    profileDependency: 0
    severity: 5
    supportPolicy: true
    tags:
    - anomaly
    - serviceaccount
    - applicationprofile
  - agentVersionRequirement: ""
    description: Detecting execution of kubernetes client
    enabled: true
    expressions:
      message: 'eventType == ''exec'' ? ''Kubernetes client ('' + event.comm + '')
        was executed with PID '' + string(event.pid) : ''Network connection to Kubernetes
        API server from container '' + event.containerName'
      ruleExpression:
      - eventType: exec
        expression: (event.comm == 'kubectl' || event.exepath.endsWith('/kubectl'))
          && !cp.was_executed(event.containerId, parse.get_exec_path(event.args, event.comm,
          event.exepath))
      - eventType: network
        expression: event.pktType == 'OUTGOING' && k8s.is_api_server_address(event.dstAddr)
          && !cp.was_address_in_egress(event.containerId, event.dstAddr)
      uniqueId: 'eventType == ''exec'' ? ''exec_'' + event.comm : ''network_'' + event.dstAddr'
    id: R0007
    isTriggerAlert: false
    mitreTactic: TA0008
    mitreTechnique: T1210
    name: Workload uses Kubernetes API unexpectedly
    profileDependency: 0
    severity: 5
    supportPolicy: false
    tags:
    - exec
    - network
    - anomaly
    - applicationprofile
  - agentVersionRequirement: ""
    description: Detecting reading environment variables from procfs.
    enabled: true
    expressions:
      message: '''Reading environment variables from procfs: '' + event.path + ''
        by process '' + event.comm'
      ruleExpression:
      - eventType: open
        expression: |
          event.path.startsWith('/proc/') &&  event.path.endsWith('/environ') && !cp.was_path_opened_with_suffix(event.containerId, '/environ')
      uniqueId: event.comm + '_' + event.path
    id: R0008
    isTriggerAlert: true
    mitreTactic: TA0006
    mitreTechnique: T1552.001
    name: Read Environment Variables from procfs
    profileDependency: 0
    severity: 5
    supportPolicy: false
    tags:
    - anomaly
    - procfs
    - environment
    - applicationprofile
  - agentVersionRequirement: ""
    description: Detecting eBPF program load.
    enabled: true
    expressions:
      message: '''bpf program load system call (bpf) was called by process ('' + event.comm
        + '') with command (BPF_PROG_LOAD)'''
      ruleExpression:
      - eventType: bpf
        expression: event.cmd == uint(5) && !cp.was_syscall_used(event.containerId,
          'bpf')
      uniqueId: event.comm + '_' + 'bpf' + '_' + string(event.cmd)
    id: R0009
    isTriggerAlert: true
    mitreTactic: TA0005
    mitreTechnique: T1218
    name: eBPF Program Load
    profileDependency: 1
    severity: 5
    supportPolicy: false
    tags:
    - bpf
    - ebpf
    - applicationprofile
  - agentVersionRequirement: ""
    description: Detecting access to sensitive files.
    enabled: true
    expressions:
      message: '''Unexpected sensitive file access: '' + event.path + '' by process
        '' + event.comm'
      ruleExpression:
      - eventType: open
        expression: event.path.startsWith('/etc/shadow') && !cp.was_path_opened(event.containerId,
          event.path)
      uniqueId: event.comm + '_' + event.path
    id: R0010
    isTriggerAlert: true
    mitreTactic: TA0006
    mitreTechnique: T1005
    name: Unexpected Sensitive File Access
    profileDependency: 1
    severity: 5
    supportPolicy: false
    tags:
    - files
    - anomaly
    - applicationprofile
  - agentVersionRequirement: ""
    description: Detecting unexpected egress network traffic that is not whitelisted
      by application profile.
    enabled: true
    expressions:
      message: '''Unexpected egress network communication to: '' + event.dstAddr +
        '':'' + string(event.dstPort) + '' using '' + event.proto + '' from: '' +
        event.containerName'
      ruleExpression:
      - eventType: network
        expression: event.pktType == 'OUTGOING' && !event.dstAddr.startsWith('127.')
          && !cp.was_address_in_egress(event.containerId, event.dstAddr) && !cp.was_selector_in_egress(event.containerId,
          event.dstNamespace, event.dstPodLabels)
      uniqueId: event.dstAddr + '_' + string(event.dstPort) + '_' + event.proto
    id: R0011
    isTriggerAlert: true
    mitreTactic: TA0010
    mitreTechnique: T1041
    name: Unexpected Egress Network Traffic
    profileDependency: 0
    severity: 5
    supportPolicy: false
    tags:
    - whitelisted
    - network
    - anomaly
    - networkprofile
  - agentVersionRequirement: ""
    description: Detecting unexpected ingress network traffic — an inbound connection
      whose peer is not whitelisted by the application profile ingress.
    enabled: true
    expressions:
      message: '''Unexpected ingress network communication from: '' + event.dstAddr
        + '':'' + string(event.dstPort) + '' using '' + event.proto + '' to: '' +
        event.containerName'
      ruleExpression:
      - eventType: network
        expression: event.pktType == 'HOST' && !event.dstAddr.startsWith('127.') &&
          !cp.was_address_in_ingress(event.containerId, event.dstAddr) && !cp.was_selector_in_ingress(event.containerId,
          event.dstNamespace, event.dstPodLabels)
      uniqueId: event.dstAddr + '_' + string(event.dstPort) + '_' + event.proto
    id: R0012
    isTriggerAlert: true
    mitreTactic: TA0011
    mitreTechnique: T1071
    name: Unexpected Ingress Network Traffic
    profileDependency: 0
    severity: 5
    supportPolicy: false
    tags:
    - whitelisted
    - network
    - anomaly
    - networkprofile
  - agentVersionRequirement: ""
    description: 'Detecting exec calls that are from malicious source like: /dev/shm'
    enabled: true
    expressions:
      message: '''Execution from malicious source: '' + event.exepath + '' in directory
        '' + event.cwd'
      ruleExpression:
      - eventType: exec
        expression: |
          (event.exepath == '/dev/shm' || event.exepath.startsWith('/dev/shm/')) || (event.cwd == '/dev/shm' || event.cwd.startsWith('/dev/shm/') ||  (parse.get_exec_path(event.args, event.comm).startsWith('/dev/shm/')))
      uniqueId: event.comm + '_' + event.exepath + '_' + event.pcomm
    id: R1000
    isTriggerAlert: true
    mitreTactic: TA0002
    mitreTechnique: T1059
    name: Process executed from malicious source
    profileDependency: 2
    severity: 8
    supportPolicy: false
    tags:
    - exec
    - signature
    - malicious
  - agentVersionRequirement: ""
    description: Detecting exec calls of binaries that are not included in the base
      image
    enabled: true
    expressions:
      message: '''Process ('' + event.comm + '') was executed and is not part of the
        image'''
      ruleExpression:
      - eventType: exec
        expression: |
          (event.upperlayer == true ||
           event.pupperlayer == true) &&
          !cp.was_executed(event.containerId, parse.get_exec_path(event.args, event.comm, event.exepath))
      uniqueId: event.comm + '_' + event.exepath + '_' + event.pcomm
    id: R1001
    isTriggerAlert: true
    mitreTactic: TA0005
    mitreTechnique: T1036
    name: Drifted process executed
    profileDependency: 1
    severity: 8
    supportPolicy: false
    tags:
    - exec
    - malicious
    - binary
    - base image
    - applicationprofile
  - agentVersionRequirement: ""
    description: Detecting Kernel Module Load.
    enabled: true
    expressions:
      message: '''Kernel module ('' + event.module + '') loading attempt with syscall
        ('' + event.syscallName + '') was called by process ('' + event.comm + '')'''
      ruleExpression:
      - eventType: kmod
        expression: event.syscallName == 'init_module' || event.syscallName == 'finit_module'
      uniqueId: event.comm + '_' + event.syscallName + '_' + event.module
    id: R1002
    isTriggerAlert: true
    mitreTactic: TA0005
    mitreTechnique: T1547.006
    name: Process tries to load a kernel module
    profileDependency: 2
    severity: 10
    supportPolicy: false
    tags:
    - kmod
    - kernel
    - module
    - load
  - agentVersionRequirement: ""
    description: Detecting ssh connection to disallowed port
    enabled: false
    expressions:
      message: '''Malicious SSH connection attempt to '' + event.dstIp + '':'' + string(dyn(event.dstPort))'
      ruleExpression:
      - eventType: ssh
        expression: dyn(event.srcPort) >= 32768 && dyn(event.srcPort) <= 60999 &&
          !(dyn(event.dstPort) in [22, 2022]) && !cp.was_address_in_egress(event.containerId,
          event.dstIp)
      uniqueId: event.comm + '_' + event.dstIp + '_' + string(dyn(event.dstPort))
    id: R1003
    isTriggerAlert: true
    mitreTactic: TA0008
    mitreTechnique: T1021.001
    name: Disallowed ssh connection
    profileDependency: 1
    severity: 5
    supportPolicy: false
    tags:
    - ssh
    - connection
    - port
    - malicious
    - networkprofile
  - agentVersionRequirement: ""
    description: Detecting exec calls from mounted paths.
    enabled: true
    expressions:
      message: '''Process ('' + event.comm + '') was executed from a mounted path'''
      ruleExpression:
      - eventType: exec
        expression: '!cp.was_executed(event.containerId, parse.get_exec_path(event.args,
          event.comm, event.exepath)) && k8s.get_container_mount_paths(event.namespace,
          event.podName, event.containerName).exists(mount, event.exepath.startsWith(mount)
          || parse.get_exec_path(event.args, event.comm, event.exepath).startsWith(mount))'
      uniqueId: event.comm
    id: R1004
    isTriggerAlert: true
    mitreTactic: TA0002
    mitreTechnique: T1059
    name: Process executed from mount
    profileDependency: 1
    severity: 5
    supportPolicy: false
    tags:
    - exec
    - mount
    - applicationprofile
  - agentVersionRequirement: ""
    description: Detecting Fileless Execution
    enabled: true
    expressions:
      message: '''Fileless execution detected: exec call "'' + event.comm + ''" is
        from a malicious source'''
      ruleExpression:
      - eventType: exec
        expression: event.exepath.contains('memfd') || event.exepath.startsWith('/proc/self/fd')
          || event.exepath.matches('/proc/[0-9]+/fd/[0-9]+')
      uniqueId: event.comm + '_' + event.exepath + '_' + event.pcomm
    id: R1005
    isTriggerAlert: true
    mitreTactic: TA0005
    mitreTechnique: T1055
    name: Fileless execution detected
    profileDependency: 2
    severity: 8
    supportPolicy: false
    tags:
    - fileless
    - execution
    - malicious
  - agentVersionRequirement: ""
    description: Detecting Unshare System Call usage, which can be used to escape
      container.
    enabled: true
    expressions:
      message: '''Unshare system call (unshare) was called by process ('' + event.comm
        + '')'''
      ruleExpression:
      - eventType: unshare
        expression: event.pcomm != 'runc' && !cp.was_syscall_used(event.containerId,
          'unshare')
      uniqueId: event.comm + '_' + 'unshare'
    id: R1006
    isTriggerAlert: true
    mitreTactic: TA0004
    mitreTechnique: T1611
    name: Process tries to escape container
    profileDependency: 2
    severity: 5
    supportPolicy: false
    tags:
    - unshare
    - escape
    - unshare
    - anomaly
    - applicationprofile
  - agentVersionRequirement: ""
    description: Detecting XMR Crypto Miners by randomx algorithm usage.
    enabled: true
    expressions:
      message: '''XMR Crypto Miner process: ('' + event.exepath + '') executed'''
      ruleExpression:
      - eventType: randomx
        expression: "true"
      uniqueId: event.exepath + '_' + event.comm
    id: R1007
    isTriggerAlert: true
    mitreTactic: TA0040
    mitreTechnique: T1496
    name: Crypto miner launched
    profileDependency: 2
    severity: 10
    supportPolicy: false
    tags:
    - crypto
    - miners
    - malicious
  - agentVersionRequirement: ""
    description: Detecting Crypto miners communication by domain
    enabled: true
    expressions:
      message: '''Communication with a known crypto mining domain: '' + event.name'
      ruleExpression:
      - eventType: dns
        expression: event.name in ['2cryptocalc.com.', '2miners.com.', 'antpool.com.',
          'asia1.ethpool.org.', 'bohemianpool.com.', 'botbox.dev.', 'btm.antpool.com.',
          'c3pool.com.', 'c4pool.org.', 'ca.minexmr.com.', 'cn.stratum.slushpool.com.',
          'dash.antpool.com.', 'data.miningpoolstats.stream.', 'de.minexmr.com.',
          'eth-ar.dwarfpool.com.', 'eth-asia.dwarfpool.com.', 'eth-asia1.nanopool.org.',
          'eth-au.dwarfpool.com.', 'eth-au1.nanopool.org.', 'eth-br.dwarfpool.com.',
          'eth-cn.dwarfpool.com.', 'eth-cn2.dwarfpool.com.', 'eth-eu.dwarfpool.com.',
          'eth-eu1.nanopool.org.', 'eth-eu2.nanopool.org.', 'eth-hk.dwarfpool.com.',
          'eth-jp1.nanopool.org.', 'eth-ru.dwarfpool.com.', 'eth-ru2.dwarfpool.com.',
          'eth-sg.dwarfpool.com.', 'eth-us-east1.nanopool.org.', 'eth-us-west1.nanopool.org.',
          'eth-us.dwarfpool.com.', 'eth-us2.dwarfpool.com.', 'eth.antpool.com.', 'eu.stratum.slushpool.com.',
          'eu1.ethermine.org.', 'eu1.ethpool.org.', 'fastpool.xyz.', 'fr.minexmr.com.',
          'kriptokyng.com.', 'mine.moneropool.com.', 'mine.xmrpool.net.', 'miningmadness.com.',
          'monero.cedric-crispin.com.', 'monero.crypto-pool.fr.', 'monero.fairhash.org.',
          'monero.hashvault.pro.', 'monero.herominers.com.', 'monerod.org.', 'monerohash.com.',
          'moneroocean.stream.', 'monerop.com.', 'multi-pools.com.', 'p2pool.io.',
          'pool.kryptex.com.', 'pool.minexmr.com.', 'pool.monero.hashvault.pro.',
          'pool.rplant.xyz.', 'pool.supportxmr.com.', 'pool.xmr.pt.', 'prohashing.com.',
          'rx.unmineable.com.', 'sg.minexmr.com.', 'sg.stratum.slushpool.com.', 'skypool.org.',
          'solo-xmr.2miners.com.', 'ss.antpool.com.', 'stratum-btm.antpool.com.',
          'stratum-dash.antpool.com.', 'stratum-eth.antpool.com.', 'stratum-ltc.antpool.com.',
          'stratum-xmc.antpool.com.', 'stratum-zec.antpool.com.', 'stratum.antpool.com.',
          'supportxmr.com.', 'trustpool.cc.', 'us-east.stratum.slushpool.com.', 'us1.ethermine.org.',
          'us1.ethpool.org.', 'us2.ethermine.org.', 'us2.ethpool.org.', 'web.xmrpool.eu.',
          'www.domajorpool.com.', 'www.dxpool.com.', 'www.mining-dutch.nl.', 'xmc.antpool.com.',
          'xmr-asia1.nanopool.org.', 'xmr-au1.nanopool.org.', 'xmr-eu1.nanopool.org.',
          'xmr-eu2.nanopool.org.', 'xmr-jp1.nanopool.org.', 'xmr-us-east1.nanopool.org.',
          'xmr-us-west1.nanopool.org.', 'xmr.2miners.com.', 'xmr.crypto-pool.fr.',
          'xmr.gntl.uk.', 'xmr.nanopool.org.', 'xmr.pool-pay.com.', 'xmr.pool.minergate.com.',
          'xmr.solopool.org.', 'xmr.volt-mine.com.', 'xmr.zeropool.io.', 'zec.antpool.com.',
          'zergpool.com.', 'auto.c3pool.org.', 'us.monero.herominers.com.', 'xmr.kryptex.network.']
      uniqueId: event.name + '_' + event.comm
    id: R1008
    isTriggerAlert: true
    mitreTactic: TA0011
    mitreTechnique: T1071.004
    name: Crypto Mining Domain Communication
    profileDependency: 2
    severity: 10
    supportPolicy: false
    tags:
    - network
    - crypto
    - miners
    - malicious
    - dns
  - agentVersionRequirement: ""
    description: Detecting Crypto Miners by suspicious port usage.
    enabled: true
    expressions:
      message: '''Detected crypto mining related port communication on port '' + string(event.dstPort)
        + '' to '' + event.dstAddr + '' with protocol '' + event.proto'
      ruleExpression:
      - eventType: network
        expression: event.proto == 'TCP' && event.pktType == 'OUTGOING' && event.dstPort
          in [3333, 45700] && !cp.was_address_in_egress(event.containerId, event.dstAddr)
      uniqueId: event.comm + '_' + string(event.dstPort)
    id: R1009
    isTriggerAlert: false
    mitreTactic: TA0011
    mitreTechnique: T1071
    name: Crypto Mining Related Port Communication
    profileDependency: 1
    severity: 3
    supportPolicy: false
    tags:
    - network
    - crypto
    - miners
    - malicious
    - networkprofile
  - agentVersionRequirement: ""
    description: Detects symlink creation over sensitive files
    enabled: true
    expressions:
      message: '''Symlink created over sensitive file: '' + event.oldPath + '' ->
        '' + event.newPath'
      ruleExpression:
      - eventType: symlink
        expression: (event.oldPath.startsWith('/etc/shadow') || event.oldPath.startsWith('/etc/sudoers'))
          && !cp.was_path_opened(event.containerId, event.oldPath)
      uniqueId: event.comm + '_' + event.oldPath
    id: R1010
    isTriggerAlert: true
    mitreTactic: TA0006
    mitreTechnique: T1005
    name: Soft link created over sensitive file
    profileDependency: 1
    severity: 5
    supportPolicy: true
    tags:
    - anomaly
    - symlink
    - applicationprofile
  - agentVersionRequirement: ""
    description: Detecting ld_preload hook techniques.
    enabled: false
    expressions:
      message: 'eventType == ''exec'' ? ''Process ('' + event.comm + '') is using
        a dynamic linker hook: '' + process.get_ld_hook_var(event.pid) : ''The dynamic
        linker configuration file ('' + event.path + '') was modified by process (''
        + event.comm + '')'''
      ruleExpression:
      - eventType: exec
        expression: event.comm != 'java' && event.containerName != 'matlab' && process.get_ld_hook_var(event.pid)
          != ''
      - eventType: open
        expression: event.path == '/etc/ld.so.preload' && has(event.flagsRaw) && event.flagsRaw
          != 0
      uniqueId: 'eventType == ''exec'' ? ''exec_'' + event.comm : ''open_'' + event.path'
    id: R1011
    isTriggerAlert: true
    mitreTactic: TA0005
    mitreTechnique: T1574.006
    name: ld_preload hooks technique detected
    profileDependency: 1
    severity: 5
    supportPolicy: true
    tags:
    - exec
    - malicious
    - applicationprofile
  - agentVersionRequirement: ""
    description: Detecting hardlink creation over sensitive files.
    enabled: true
    expressions:
      message: '''Hardlink created over sensitive file: '' + event.oldPath + '' -
        '' + event.newPath'
      ruleExpression:
      - eventType: hardlink
        expression: (event.oldPath.startsWith('/etc/shadow') || event.oldPath.startsWith('/etc/sudoers'))
          && !cp.was_path_opened(event.containerId, event.oldPath)
      uniqueId: event.comm + '_' + event.oldPath
