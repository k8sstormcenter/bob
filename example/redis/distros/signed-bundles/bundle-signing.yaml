# Demo trust policy for signed-bundle overlays (upstream-chart installs only;
# the fork chart renders this from nodeAgent.bundleSigning).
#
# The policy is ROOT-SIGNED: node-agent verifies it against the root public key
# compiled into its image and refuses to enable bundles if the signature or the
# root pin fails. There is NO signing key here and none anywhere on the cluster
# — node-agent only verifies. Re-sign with:
#   sign-object sign-policy --policy trust-policy.json --key keys/root.pem \
#     --output trust-policy.signed.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: node-agent-bundle-policy
  namespace: honey
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: kubescape
    meta.helm.sh/release-namespace: honey
data:
  trust-policy.json: |
    {
      "policy": {
        "classes": {
          "admission": {
            "signers": [
              "key:2c6bd5e1e52cd5721c986bde87e84c382984d8d3263ddde7fc89d2e9c90c3fb3"
            ],
            "allowedSpecPaths": [
              "ingress",
              "egress"
            ]
          },
          "base": {
            "signers": [
              "key:1b962159c04a8b6dd5825b971d8417a144a1358d9e2f8c14368d14e1ebc67fbd"
            ],
            "allowedSpecPaths": [
              "architectures",
              "capabilities",
              "execs",
              "opens",
              "syscalls",
              "seccompProfile",
              "endpoints",
              "imageID",
              "imageTag",
              "rulePolicies",
              "identifiedCallStacks",
              "labelSelector"
            ]
          },
          "overlay": {
            "signers": [
              "key:2c6bd5e1e52cd5721c986bde87e84c382984d8d3263ddde7fc89d2e9c90c3fb3"
            ],
            "allowedSpecPaths": [
              "execs",
              "opens"
            ]
          }
        }
      },
      "annotations": {
        "signature.kubescape.io/certificate": "",
        "signature.kubescape.io/identity": "local-key",
        "signature.kubescape.io/issuer": "local",
