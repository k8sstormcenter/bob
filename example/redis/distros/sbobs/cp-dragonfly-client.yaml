apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ContainerProfile
metadata:
  name: dragonfly-client
  namespace: dragonfly
  annotations:
    kubescape.io/managed-by: User
spec:
  architectures:
  - amd64
  capabilities: []
  execs:
  - path: /usr/local/bin/redis-cli
    args:
    - /usr/local/bin/redis-cli
    - -h
    - dragonfly
    - -p
    - '6379'
    - SET
    - ⋯⋯
  - path: /bin/busybox
    args:
    - /bin/sh
    - -c
    - |
      i=0
      while true; do
        redis-cli -h dragonfly -p 6379 SET "k:$i" "v:$i" >/dev/null
        i=$((i+1)); sleep 2
      done
  - path: /bin/busybox
    args:
    - /bin/sleep
    - '2'
  opens:
  - flags:
    - O_CREAT
    - O_LARGEFILE
    - O_TRUNC
    - O_WRONLY
    path: /dev/null
  - flags:
    - O_CLOEXEC
    - O_LARGEFILE
    - O_RDONLY
    path: /etc/hosts
  - flags:
    - O_CLOEXEC
    - O_LARGEFILE
    - O_RDONLY
    path: /etc/ld-musl-x86_64.path
  - flags:
    - O_CLOEXEC
    - O_LARGEFILE
    - O_RDONLY
    path: /etc/resolv.conf
  - flags:
    - O_CLOEXEC
    - O_LARGEFILE
    - O_RDONLY
    path: /lib/libcrypto.so.3
  - flags:
    - O_CLOEXEC
    - O_LARGEFILE
    - O_RDONLY
    path: /lib/libssl.so.3
  - flags:
    - O_CLOEXEC
    - O_DIRECTORY
    - O_RDONLY
    path: /proc/⋯/task/1/fd
  - flags:
    - O_CLOEXEC
    - O_RDONLY
    path: /proc/⋯/vm/overcommit_memory
  - flags:
    - O_RDONLY
    path: /sys/kernel/mm/transparent_hugepage/enabled
  - flags:
    - O_CLOEXEC
    - O_LARGEFILE
    - O_RDONLY
    path: /usr/lib/libcrypto.so.3
  - flags:
    - O_CLOEXEC
    - O_LARGEFILE
    - O_RDONLY
    path: /usr/lib/libssl.so.3
  - flags:
    - O_CLOEXEC
    - O_LARGEFILE
    - O_RDONLY
    path: /usr/local/lib/libcrypto.so.3
  - flags:
    - O_CLOEXEC
    - O_LARGEFILE
    - O_RDONLY
    path: /usr/local/lib/libssl.so.3
  egress:
  - identifier: a41aab76795492b799ee9308bc6060fba63c42581c5e1fa845fa44ea3bc57b8a
    type: internal
    podSelector:
      matchLabels:
        app: dragonfly
    ports:
    - name: TCP-6379
      port: 6379
      protocol: TCP
  - identifier: e5e8ca3d76f701a19b7478fdc1c8c24ccc6cef9902b52c8c7e015439e2a1ddf3
    type: internal
    podSelector:
      matchLabels:
        k8s-app: kube-dns
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    ports:
    - name: UDP-53
      port: 53
      protocol: UDP
  ingress: null
  matchLabels:
    app: dragonfly-client
  syscalls:
  - bind
  - brk
  - capget
  - capset
  - chdir
  - close_range
  - connect
  - dup2
  - epoll_ctl
  - epoll_pwait
  - exit
  - faccessat2
  - fork
  - fstat
  - fstatfs
  - getdents64
  - getpid
  - gettid
  - ioctl
  - madvise
  - mprotect
  - munmap
  - nanosleep
  - open
  - openat2
  - prctl
  - readlink
  - recvfrom
  - recvmsg
  - rt_sigaction
  - rt_sigprocmask
  - rt_sigreturn
  - sched_getaffinity
  - sendto
  - setgid
  - setgroups
  - setsockopt
  - setuid
  - sigaltstack
  - socket
  - stat
  - statx
  - tgkill
  - tkill
  - unknown
  - writev
  identifiedCallStacks: null
