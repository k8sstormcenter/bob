apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ContainerProfile
metadata:
  name: valkey
  namespace: valkey
  annotations:
    kubescape.io/managed-by: User
spec:
  architectures:
  - amd64
  capabilities:
  - CAP_CHOWN
  - CAP_DAC_OVERRIDE
  - CAP_DAC_READ_SEARCH
  egress: null
  endpoints: null
  execs:
  - args:
    - /usr/bin/cp
    - /opt/bitnami/valkey/mounted-etc/primary.conf
    - /opt/bitnami/valkey/etc/primary.conf
    - /opt/bitnami/valkey/mounted-etc/valkey.conf
    - /opt/bitnami/valkey/etc/valkey.conf
    path: /usr/bin/cp
  - args:
    - /opt/bitnami/valkey/bin/valkey-server
    - --port
    - '6379'
    - --protected-mode
    - 'no'
    - --include
    - /opt/bitnami/valkey/etc/valkey.conf
    - --include
    - /opt/bitnami/valkey/etc/primary.conf
    path: /opt/bitnami/valkey/bin/valkey-server
  - args:
    - /opt/bitnami/valkey/bin/valkey-cli
    - -h
    - localhost
    - -p
    - '6379'
    - ping
    path: /opt/bitnami/valkey/bin/valkey-cli
  - args:
    - /bin/bash
    - -c
    - /opt/bitnami/scripts/start-scripts/start-primary.sh
    - /usr/bin/sh
    - /health/ping_readiness_local.sh 1
    - /health/ping_liveness_local.sh 5
    - /health/ping_liveness_local.sh
    - '5'
    - /health/ping_readiness_local.sh
    - '1'
    path: /usr/bin/bash
  - args:
    - /usr/bin/timeout
    - -s
    - '15'
    - '1'
    - valkey-cli
    - -p
    - '6379'
    - ping
    - '5'
    - -h
    - localhost
    path: /usr/bin/timeout
  - args:
    - /usr/bin/head
    - -n1
    path: /usr/bin/head
  - args:
    - /usr/bin/awk
    - '{print $1;}'
    path: /usr/bin/gawk
  identifiedCallStacks: null
  ingress: null
  matchLabels:
    app.kubernetes.io/component: primary
    app.kubernetes.io/instance: valkey
    app.kubernetes.io/name: valkey
  opens:
  - flags:
    - O_RDONLY
    - O_DIRECTORY
    - O_CLOEXEC
    path: /proc/⋯/task/⋯/fd
  - flags:
    - O_CLOEXEC
    - O_RDONLY
    path: /usr/lib/libattr.so.1.1.2501
  - flags:
    - O_RDONLY
    - O_DIRECTORY
    - O_WRONLY
    - O_CREAT
    - O_EXCL
    path: /opt/bitnami/valkey/etc/primary.conf
  - flags:
