# Helm values for the keydb distro (enapter/keydb 0.48.0, eqalpha image).
# Bakes the SBoB bind label into the pod so the ContainerProfile `keydb`
# binds automatically on start.
#
#   helm install keydb enapter/keydb --version 0.48.0 \
#     -n keydb --create-namespace -f helm-values/keydb.yaml
#   kubectl apply -f sbobs/cp-keydb.yaml
#
# NOTE: the enapter/keydb chart's pod-label key is `podLabels` per its values
# schema; confirm with `helm show values enapter/keydb --version 0.48.0` if the
# label does not land on the pod.
image:
  repository: eqalpha/keydb
  tag: x86_64_v6.3.2
podLabels:
  kubescape.io/user-defined-profile: keydb
