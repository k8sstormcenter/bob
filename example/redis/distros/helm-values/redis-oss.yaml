# Helm values for the redis-oss distro (bitnami/redis 27.0.18, standalone).
# Bakes the SBoB bind label into the master pod so the ContainerProfile
# `redis` binds automatically the moment the pod starts — no post-deploy patch.
#
#   helm install redis oci://registry-1.docker.io/bitnamicharts/redis \
#     --version 27.0.18 -n redis-oss --create-namespace -f helm-values/redis-oss.yaml
#   kubectl apply -f sbobs/cp-redis.yaml     # the profile the label references
architecture: standalone
auth:
  enabled: false
image:
  repository: bitnami/redis
  digest: sha256:08863c2c3f4e051fb6139b38fa223e9c13be5033326a59bead182860d899bf98
master:
  # kubescape.io/user-defined-profile makes node-agent enforce the CP named
  # "redis" (in this namespace) against the master pod.
  podLabels:
    kubescape.io/user-defined-profile: redis
