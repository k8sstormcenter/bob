apiVersion: v1
kind: Namespace
metadata:
  name: wordpress
  labels:
    app.kubernetes.io/part-of: bob-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: wordpress
  labels: {app: wordpress}
spec:
  replicas: 1
  selector: {matchLabels: {app: wordpress}}
  template:
    metadata:
      labels:
        app: wordpress
        kubescape.io/user-defined-profile: wordpress
    spec:
      containers:
      - name: wordpress
        image: ghcr.io/k8sstormcenter/php2shell-wordpress:latest
        imagePullPolicy: IfNotPresent
        env:
        - {name: WORDPRESS_DB_HOST, value: mariadb.wordpress-db.svc.cluster.local}
        - {name: WORDPRESS_DB_PASSWORD, value: wordpress-demo}
        ports: [{containerPort: 80}]
        resources:
          requests: {cpu: "100m", memory: "128Mi"}
          limits: {cpu: "1", memory: "512Mi"}
        readinessProbe:
          httpGet: {path: /license.txt, port: 80}
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /license.txt, port: 80}
          initialDelaySeconds: 10
          periodSeconds: 15
        volumeMounts:
        - {name: uploads, mountPath: /var/www/html/uploads}
        - {name: media, mountPath: /var/www/html/wp-content/uploads}
      volumes:
      - {name: uploads, emptyDir: {}}
      - {name: media, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  namespace: wordpress
spec:
  selector: {app: wordpress}
  ports: [{port: 80, targetPort: 80}]
