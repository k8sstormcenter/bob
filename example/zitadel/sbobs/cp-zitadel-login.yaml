  capabilities: [CAP_IPC_LOCK, CAP_SETUID]
  endpoints: []
  rulePolicies:
    R0002:
      processAllowed: ['runc:[1:INIT]', 'runc:[1:CHILD]', 'runc:[2:INIT]', 'runc:[3:INIT]']
    R0004:
      processAllowed: ['runc:[1:INIT]', 'runc:[1:CHILD]', 'runc:[2:INIT]', 'runc:[3:INIT]']
  ingress:
  - identifier: in-namespace
    type: internal
    podSelector:
      matchLabels: {app.kubernetes.io/instance: zitadel}
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: zitadel}
    ports:
    - {name: TCP-3000, port: 3000, protocol: TCP}
  egress:
  - identifier: cluster-dns
    type: internal
    serviceRefName: kube-dns
    serviceRefNamespace: kube-system
    ports:
    - {name: UDP-53, port: 53, protocol: UDP}
    - {name: TCP-53, port: 53, protocol: TCP}
  - identifier: zitadel-api
    type: internal
    podSelector:
      matchLabels: {app.kubernetes.io/name: zitadel, app.kubernetes.io/component: start}
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: zitadel}
    ports:
    - {name: TCP-8080, port: 8080, protocol: TCP}
