apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ContainerProfile
metadata:
  name: zitadel
  namespace: zitadel
  annotations: {kubescape.io/managed-by: User}
spec:
  architectures: [amd64]
  matchLabels: {app.kubernetes.io/component: start, app.kubernetes.io/instance: zitadel, app.kubernetes.io/name: zitadel}
  execs:
  - path: /app/zitadel
    args: [/app/zitadel, start, --config, /config/zitadel-config-yaml, --masterkeyFromEnv]
  opens:
  - path: /.pgpass
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /app/zitadel
    flags: [O_CLOEXEC, O_RDONLY]
  - path: "/config/\u22EF/zitadel-config-yaml"
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /etc/apache/mime.types
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /etc/apache2/mime.types
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /etc/hosts
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /etc/httpd/conf/mime.types
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /etc/localtime
    flags: [O_RDONLY]
  - path: /etc/machine-id
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /etc/mime.types
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /etc/nsswitch.conf
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /etc/passwd
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /etc/resolv.conf
    flags: [O_CLOEXEC, O_RDONLY]
  - path: "/opt/hostedtoolcache/go/\u22EF/x64/lib/time/zoneinfo.zip"
    flags: [O_RDONLY]
  - path: "/proc/\u22EF/cgroup"
    flags: [O_CLOEXEC, O_RDONLY]
  - path: "/proc/\u22EF/cpuset"
    flags: [O_CLOEXEC, O_RDONLY]
  - path: "/proc/\u22EF/mountinfo"
    flags: [O_CLOEXEC, O_RDONLY]
  - path: "/proc/\u22EF/net/core/somaxconn"
    flags: [O_CLOEXEC, O_RDONLY]
  - path: "/proc/\u22EF/task/\u22EF/fd"
    flags: [O_CLOEXEC, O_DIRECTORY, O_RDONLY]
  - path: "/secrets/login-client/\u22EF/tls.crt"
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /sys/class/dmi/id/product_uuid
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /sys/fs/cgroup/cpu.max
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /sys/kernel/mm/transparent_hugepage/hpage_pmd_size
    flags: [O_RDONLY]
  - path: /usr/local/share/mime/globs2
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /usr/share/mime/globs2
    flags: [O_CLOEXEC, O_RDONLY]
  capabilities: [CAP_NET_ADMIN]
  endpoints: []
  rulePolicies:
    R0002:
      processAllowed: ['runc:[1:INIT]', 'runc:[1:CHILD]', 'runc:[2:INIT]', 'runc:[3:INIT]']
    R0004:
      processAllowed: ['runc:[1:INIT]', 'runc:[1:CHILD]', 'runc:[2:INIT]', 'runc:[3:INIT]']
  ingress:
  - identifier: login
    type: internal
    podSelector:
      matchLabels: {app.kubernetes.io/name: zitadel, app.kubernetes.io/component: login}
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: zitadel}
    ports:
    - {name: TCP-8080, port: 8080, protocol: TCP}
  egress:
  - identifier: cluster-dns
    type: internal
    serviceRefName: kube-dns
    serviceRefNamespace: kube-system
    ports:
    - {name: UDP-53, port: 53, protocol: UDP}
    - {name: TCP-53, port: 53, protocol: TCP}
  - identifier: postgres
    type: internal
    podSelector:
      matchLabels: {app.kubernetes.io/name: postgresql, app.kubernetes.io/instance: zitadel}
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: zitadel}
    ports:
    - {name: TCP-5432, port: 5432, protocol: TCP}
