apiVersion: bobctl.k8sstormcenter.io/v1alpha1
kind: FunctionalTestSuite
metadata: {name: zitadel-functional, description: "Benign ZITADEL traffic that must raise no detections. Covers the OIDC discovery surface, the signing keys, the console, and the health endpoints \u2014 the paths a real identity provider serves continuously."}
target: {service: zitadel, namespace: zitadel, port: 8080, scheme: http}
tests:
- name: oidc-discovery
  http:
    method: GET
    path: /.well-known/openid-configuration
    headers: &id001 {Host: 'localhost:8080'}
    expectedStatus: 200
    responseContains: issuer
- name: oidc-jwks
  http:
    method: GET
    path: /oauth/v2/keys
    headers: *id001
    expectedStatus: 200
    responseContains: keys
- name: oauth-authorize-missing-params
  http:
    method: GET
    path: /oauth/v2/authorize
    headers: *id001
    expectedStatus: 400
- name: console-index
  http:
    method: GET
    path: /ui/console
    headers: *id001
    expectedStatus: 200
- name: console-assets
  http:
    method: GET
    path: /ui/console/assets/environment.json
    headers: *id001
    expectedStatus: 200
- name: healthz
  http:
    method: GET
    path: /debug/healthz
    headers: *id001
    expectedStatus: 200
- name: ready
  http:
    method: GET
    path: /debug/ready
    headers: *id001
    expectedStatus: 200
- name: validate
  http:
    method: GET
    path: /debug/validate
    headers: *id001
    expectedStatus: 200
- name: unknown-path-404
  http:
    method: GET
    path: /this-does-not-exist
    headers: *id001
    expectedStatus: 404
