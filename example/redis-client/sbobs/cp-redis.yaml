# ContainerProfile (unified SBoB): the process view (execs/opens/
# syscalls/endpoints/rulePolicies) and the network view (matchLabels/
# ingress/egress) in ONE object. Replaces the legacy AP+NN pair.
# Bound by the pod label kubescape.io/user-defined-profile: redis
apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ContainerProfile
metadata:
  name: redis
  namespace: redis-demo
  annotations:
    kubescape.io/managed-by: User
    kubescape.io/status: completed
    kubescape.io/completion: complete
  labels:
    kubescape.io/workload-api-group: apps
    kubescape.io/workload-api-version: v1
    kubescape.io/workload-kind: Deployment
    kubescape.io/workload-name: redis
    kubescape.io/workload-namespace: redis-demo
spec:
  architectures:
  - amd64
  execs:
  - path: /usr/local/bin/redis-server
    args:
    - redis-server
    - '*'
  - path: /usr/local/bin/redis-cli
    args:
    - redis-cli
    - "\u22EF\u22EF"
  opens:
  - path: /lib/ld-musl-x86_64.so.1
    flags:
    - O_RDONLY
  - path: /etc/passwd
    flags:
    - O_RDONLY
  - path: /etc/group
    flags:
    - O_RDONLY
  - path: /dev/urandom
    flags:
    - O_RDONLY
  - path: /etc/redis/*/redis.conf
    flags:
    - O_RDONLY
  - path: "/proc/\u22EF/stat"
    flags:
    - O_RDONLY
  - path: "/proc/\u22EF/net/*"
    flags:
    - O_RDONLY
  - path: /sys/devices/*
    flags:
    - O_RDONLY
  capabilities: []
  endpoints: []
  matchLabels:
    app: redis
  ingress:
  - identifier: allowed-client
    type: internal
    podSelector:
      matchLabels:
        app: redis-client
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: redis-demo
    ports:
    - name: TCP-6379
      port: 6379
      protocol: TCP
    dns: ''
    dnsNames: null
    ipAddress: ''
  egress: null
