# ContainerProfile SBoB for redis — the unified profile (process view + network
# view in ONE object; replaces the legacy AP+NN pair).
#
# Binding: the redis pod carries the label
#   kubescape.io/user-defined-profile: redis
# node-agent (rc4) fetches the ContainerProfile named "redis" in this namespace
# and enforces it. The ONLY metadata marker this needs is the annotation
# kubescape.io/managed-by: User — it tells storage this is user-authored (so it
# is never garbage-collected) and node-agent to treat it as authoritative. The
# workload-* labels and status/completion annotations a LEARNED profile carries
# are not needed for a hand-authored user profile.
apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ContainerProfile
metadata:
  name: redis
  namespace: redis-demo
  annotations:
    kubescape.io/managed-by: User
spec:
  architectures: [amd64]
  execs:
    # Only the redis binaries. Any other exec (a shell, a fetched tool) is
    # instantly anomalous → R0001. args use ⋯⋯ (zero-or-more) so flag variations
    # don't FP while the PATH stays the tight discriminant.
    - path: /usr/local/bin/redis-server
      args: [redis-server, "⋯⋯"]
    - path: /usr/local/bin/redis-cli
      args: [redis-cli, "⋯⋯"]
  opens:
    # Stable runtime — keep literal (tight = anomalies are Separable).
    - path: /lib/ld-musl-x86_64.so.1
      flags: [O_RDONLY]
    - path: /etc/passwd
      flags: [O_RDONLY]
    - path: /etc/group
      flags: [O_RDONLY]
    - path: /dev/urandom
      flags: [O_RDONLY]
    # ConfigMap-mounted config: the ..data symlink dir is regenerated on every
    # remount → wildcard the generation segment, keep the filename.
    - path: /etc/redis/⋯/redis.conf
      flags: [O_RDONLY]
    # Persistence dir: redis writes RDB snapshots (BGSAVE → temp-<pid>.rdb, then
    # dump.rdb) here. Benign; wildcard the whole subtree so snapshotting never
    # FPs, while a read OUTSIDE /data still trips R0002.
    - path: /data
      flags: [O_RDONLY, O_DIRECTORY]
    - path: /data/*
      flags: [O_RDWR, O_CREAT, O_RDONLY]
    # Per-PID /proc churn: redis reads its own stat/smaps/net/… under /proc/<pid>.
    # Wildcard the PID segment AND the leaf (⋯ = one segment, * = glob) so the
    # volatile proc reads don't FP.
    - path: /proc/⋯/*
      flags: [O_RDONLY]
    - path: /sys/devices/*
      flags: [O_RDONLY]
  capabilities: []
  endpoints: []
  # rulePolicies: allow the container-runtime init phase (runc:[N:INIT]) that
  # touches /runc, /proc/N/task/N/…, cgroup setgroups during container start —
  # these are the kernel/runtime, not redis, and would otherwise FP R0002/R0004
  # on every pod (re)start. redis itself is NOT in the allow-list, so a real
  # process anomaly under redis still fires.
  rulePolicies:
    R0002:
      processAllowed:
        - "runc:[1:INIT]"
        - "runc:[1:CHILD]"
        - "runc:[2:INIT]"
        - "runc:[3:INIT]"
    R0004:
      processAllowed:
        - "runc:[1:INIT]"
        - "runc:[1:CHILD]"
        - "runc:[2:INIT]"
        - "runc:[3:INIT]"
  # Network: a database SERVER initiates no outbound connections. egress: null →
  # every outbound packet from redis is, by definition, unexpected (R0011).
  # ingress: only the one declared client may reach :6379.
  matchLabels:
    app: redis
  ingress:
    - identifier: allowed-client
      type: internal
      podSelector:
        matchLabels:
          app: redis-client
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: redis-demo
      ports:
        - {name: TCP-6379, port: 6379, protocol: TCP}
  egress: null
