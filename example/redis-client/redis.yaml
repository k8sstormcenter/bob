# Redis server — the datastore whose Bill-of-Behavior we author.
# Namespace + labels are deliberately plain so the end-user can drop this
# next to their own client (or swap in their own redis) with minimal edits.
apiVersion: v1
kind: Namespace
metadata:
  name: redis-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: redis-demo
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        kubescape.io/user-defined-profile: "redis"
    spec:
      containers:
        - name: redis
          # redis-vulnerable (glibc/Debian): a real CVE-carrying redis so the
          # kill-chain attacks in example/redis-attacks.yaml actually EXECUTE
          # (the Lua sandbox escape / RediShell primitives need this image; the
          # stock redis:7-alpine has them patched, so attacks there never land).
          image: ghcr.io/k8sstormcenter/redis-vulnerable:7.2.10
          # Attack-enabling config: protected-mode off + module command enabled
          # so the CONFIG SET / MODULE LOAD attack variants are reachable, and a
          # writable /data dir for the RDB-write persistence attacks.
          args:
            - redis-server
            - --protected-mode
            - "no"
            - --enable-module-command
            - "yes"
            - --dir
            - /data
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: redis-demo
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
