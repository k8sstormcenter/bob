; PHP2Shell (CVE-2026-109618 / CVE-2026-109619) calibration profile.
;
; The vulnerable surface is session.upload_progress, which PHP ships ENABLED by
; default — a stock unpatched 8.4.26 is already exploitable. These values only
; make the underlying use-after-free groom deterministically for a repeatable
; demo; they are reliability knobs, not the vulnerability.

; --- the vulnerable surface (PHP default = On; stated here for clarity) ---
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
session.upload_progress.prefix = "upload_progress_"
session.upload_progress.name = "PHP_SESSION_UPLOAD_PROGRESS"
session.use_cookies = 1
session.use_strict_mode = 0

; --- heap-grooming calibration (deterministic UAF for the classroom demo) ---
memory_limit = 8M
post_max_size = 512M
upload_max_filesize = 512M
max_input_vars = 1000

; --- demo visibility: surface errors so the blast is observable in the pod ---
display_errors = On
display_startup_errors = On
log_errors = On
error_reporting = E_ALL
