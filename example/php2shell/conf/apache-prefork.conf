# Single prefork worker: pins all requests onto one PHP process so the
# session.upload_progress use-after-free (CVE-2026-109618) grooms against a
# predictable heap, making the demo exploit deterministic. Real-world servers
# are exploitable with many workers too — this is only a reliability knob.
<IfModule mpm_prefork_module>
    StartServers          1
    MinSpareServers       1
    MaxSpareServers       1
    MaxRequestWorkers     1
    MaxConnectionsPerChild 0
</IfModule>
