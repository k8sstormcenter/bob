#
# Twin #2 of the php2shell target: byte-identical image to php2shell.yaml, but
# app=php2shell-2 and NO kubescape.io/user-defined-profile label (the rule arm,
# detected by R1505 instead of a bound SBoB). Used by ci-php2shell-k3s-twin.yaml
# to compare SBoB-vs-rule detection and the observed shadow profile across two
# identical workloads.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: php2shell-2
  namespace: php2shell
  labels:
    app: php2shell-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: php2shell-2
  template:
    metadata:
      labels:
        app: php2shell-2
    spec:
      containers:
      - name: php2shell
        image: ghcr.io/k8sstormcenter/php2shell-vulnerable:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests: {cpu: "100m", memory: "256Mi"}
          limits: {cpu: "500m", memory: "1Gi"}
