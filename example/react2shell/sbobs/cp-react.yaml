apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ContainerProfile
metadata:
  name: react
  namespace: react
  annotations:
    kubescape.io/managed-by: User
spec:
  architectures:
  - amd64
  imageID: node@sha256:afdf98210b07b586eb71fa22ba2e432e058e4cd1304d31ed60888755b8c865fb
  imageTag: node:20-alpine
  execs:
  - path: /usr/local/bin/node
    args:
    - node
    - /app/server.js
  opens:
  - path: /app
    flags:
    - O_RDONLY
  - path: /usr/local/bin/node
    flags:
    - O_RDONLY
  - path: /usr/local/lib
    flags:
    - O_RDONLY
  - path: /lib
    flags:
    - O_RDONLY
  - path: /usr/lib
    flags:
    - O_RDONLY
  - path: /etc/passwd
    flags:
    - O_RDONLY
  - path: /etc/resolv.conf
    flags:
    - O_RDONLY
  - path: /etc/hosts
    flags:
    - O_RDONLY
  - path: /etc/nsswitch.conf
    flags:
    - O_RDONLY
  - path: /etc/ssl/certs/ca-certificates.crt
    flags:
    - O_RDONLY
  - path: /dev/null
    flags:
    - O_RDWR
  - path: /dev/urandom
    flags:
    - O_RDONLY
  - path: /proc
    flags:
    - O_RDONLY
  - path: /usr/share/zoneinfo
    flags:
    - O_RDONLY
  - path: /etc/localtime
    flags:
    - O_RDONLY
  syscalls:
  - accept4
  - bind
  - brk
  - clone
  - close
  - connect
  - epoll_create1
  - epoll_ctl
  - epoll_pwait
  - execve
  - exit_group
  - fcntl
  - fstat
  - futex
  - getdents64
  - getsockname
  - listen
  - mmap
  - mprotect
  - munmap
  - openat
  - read
  - readlink
  - recvfrom
  - rt_sigaction
  - rt_sigprocmask
  - sendto
  - setsockopt
  - socket
  - write
  capabilities: []
  endpoints:
  - endpoint: :3000/
    direction: inbound
    methods:
    - GET
    internal: true
  seccompProfile:
    spec:
      defaultAction: ''
  rulePolicies:
    R0002:
      processAllowed:
      - runc:[1:INIT]
      - runc:[2:INIT]
      - runc:[1:CHILD]
    R0004:
      processAllowed:
      - runc:[1:INIT]
      - runc:[2:INIT]
      - runc:[1:CHILD]
  matchLabels:
    app: react
  ingress:
  - identifier: ingress-from-argocd
    ipAddress: ''
    dns: ''
    dnsNames: null
    ports:
    - name: TCP-3000
      port: 3000
      protocol: TCP
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: argocd
    podSelector: null
    type: internal
  egress:
  - identifier: egress-kube-dns
    ipAddress: ''
    dns: ''
    dnsNames: null
    ports:
    - name: UDP-53
      port: 53
      protocol: UDP
    - name: TCP-53
      port: 53
      protocol: TCP
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        k8s-app: kube-dns
    type: internal
