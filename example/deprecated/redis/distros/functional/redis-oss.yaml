apiVersion: bobctl.k8sstormcenter.io/v1alpha1
kind: FunctionalTestSuite
metadata:
  name: redis-functional-realistic
  description: >-
    Realistic redis-protocol workload that exercises the SERVER's full behaviour
    for SBoB learning — not just PING/SET/GET. Covers every data type, keyspace
    management, expiry, scripting (Lua fork of the interpreter), streams,
    pub/sub publish, transactions, admin/introspection, and — critically — the
    PERSISTENCE paths (BGSAVE / BGREWRITEAOF fork a child; CONFIG SET appendonly
    yes turns on AOF file writes). These are the code paths a trivial suite never
    triggers, so the learned profile is otherwise incomplete. RESP over TCP,
    single connection (SUBSCRIBE/MONITOR/blocking ops omitted — need concurrency).
target:
  service: redis-master
  namespace: redis
  port: 6379
  scheme: tcp
tests:
  # ── Connection / server / introspection ───────────────────────────────────
  - {name: ping,          exec: {command: ["redis-cli", "-e", "PING"], expectedExitCode: 0}}
  - {name: echo,          exec: {command: ["redis-cli", "-e", "ECHO", "bob"], expectedExitCode: 0}}
  - {name: select0,       exec: {command: ["redis-cli", "-e", "SELECT", "0"], expectedExitCode: 0}}
  - {name: client-setname, exec: {command: ["redis-cli", "-e", "CLIENT", "SETNAME", "bobclient"], expectedExitCode: 0}}
  - {name: client-id,     exec: {command: ["redis-cli", "-e", "CLIENT", "ID"], expectedExitCode: 0}}
  - {name: client-info,   exec: {command: ["redis-cli", "-e", "CLIENT", "INFO"], expectedExitCode: 0}}
  - {name: command-count, exec: {command: ["redis-cli", "-e", "COMMAND", "COUNT"], expectedExitCode: 0}}
  - {name: config-maxmem, exec: {command: ["redis-cli", "-e", "CONFIG", "GET", "maxmemory"], expectedExitCode: 0}}
  - {name: info-server,   exec: {command: ["redis-cli", "-e", "INFO", "server"], expectedExitCode: 0}}
  - {name: info-persist,  exec: {command: ["redis-cli", "-e", "INFO", "persistence"], expectedExitCode: 0}}
  - {name: info-stats,    exec: {command: ["redis-cli", "-e", "INFO", "stats"], expectedExitCode: 0}}
  - {name: info-cpu,      exec: {command: ["redis-cli", "-e", "INFO", "cpu"], expectedExitCode: 0}}
  - {name: time,          exec: {command: ["redis-cli", "-e", "TIME"], expectedExitCode: 0}}
  - {name: dbsize,        exec: {command: ["redis-cli", "-e", "DBSIZE"], expectedExitCode: 0}}
  - {name: slowlog-get,   exec: {command: ["redis-cli", "-e", "SLOWLOG", "GET", "10"], expectedExitCode: 0}}
  - {name: memory-doctor, exec: {command: ["redis-cli", "-e", "MEMORY", "DOCTOR"], expectedExitCode: 0}}

  # ── Strings + expiry variants ─────────────────────────────────────────────
  - {name: set,           exec: {command: ["redis-cli", "-e", "SET", "s:k", "hello"], expectedExitCode: 0}}
  - {name: set-ex,        exec: {command: ["redis-cli", "-e", "SET", "s:ttl", "v", "EX", "100"], expectedExitCode: 0}}
  - {name: set-nx,        exec: {command: ["redis-cli", "-e", "SET", "s:k", "no", "NX"], expectedExitCode: 0}}
  - {name: append,        exec: {command: ["redis-cli", "-e", "APPEND", "s:k", "-world"], expectedExitCode: 0}}
  - {name: strlen,        exec: {command: ["redis-cli", "-e", "STRLEN", "s:k"], expectedExitCode: 0}}
  - {name: getrange,      exec: {command: ["redis-cli", "-e", "GETRANGE", "s:k", "0", "4"], expectedExitCode: 0}}
  - {name: setrange,      exec: {command: ["redis-cli", "-e", "SETRANGE", "s:k", "0", "J"], expectedExitCode: 0}}
  - {name: getdel,        exec: {command: ["redis-cli", "-e", "GETDEL", "s:ttl"], expectedExitCode: 0}}
  - {name: mset,          exec: {command: ["redis-cli", "-e", "MSET", "s:a", "1", "s:b", "2", "s:c", "3"], expectedExitCode: 0}}
  - {name: mget,          exec: {command: ["redis-cli", "-e", "MGET", "s:a", "s:b", "s:c"], expectedExitCode: 0}}
  - {name: incr,          exec: {command: ["redis-cli", "-e", "INCR", "n:ctr"], expectedExitCode: 0}}
  - {name: incrby,        exec: {command: ["redis-cli", "-e", "INCRBY", "n:ctr", "10"], expectedExitCode: 0}}
  - {name: incrbyfloat,   exec: {command: ["redis-cli", "-e", "INCRBYFLOAT", "n:f", "3.14"], expectedExitCode: 0}}

  # ── Bitmaps ───────────────────────────────────────────────────────────────
  - {name: setbit,        exec: {command: ["redis-cli", "-e", "SETBIT", "bm:k", "7", "1"], expectedExitCode: 0}}
  - {name: getbit,        exec: {command: ["redis-cli", "-e", "GETBIT", "bm:k", "7"], expectedExitCode: 0}}
  - {name: bitcount,      exec: {command: ["redis-cli", "-e", "BITCOUNT", "bm:k"], expectedExitCode: 0}}
  - {name: bitfield,      exec: {command: ["redis-cli", "-e", "BITFIELD", "bm:f", "SET", "u8", "0", "255", "GET", "u8", "0"], expectedExitCode: 0}}

  # ── Hashes ────────────────────────────────────────────────────────────────
  - {name: hset,          exec: {command: ["redis-cli", "-e", "HSET", "h:u", "name", "bob", "age", "5"], expectedExitCode: 0}}
  - {name: hget,          exec: {command: ["redis-cli", "-e", "HGET", "h:u", "name"], expectedExitCode: 0}}
  - {name: hgetall,       exec: {command: ["redis-cli", "-e", "HGETALL", "h:u"], expectedExitCode: 0}}
  - {name: hincrby,       exec: {command: ["redis-cli", "-e", "HINCRBY", "h:u", "age", "1"], expectedExitCode: 0}}
  - {name: hrandfield,    exec: {command: ["redis-cli", "-e", "HRANDFIELD", "h:u", "2"], expectedExitCode: 0}}
  - {name: hscan,         exec: {command: ["redis-cli", "-e", "HSCAN", "h:u", "0"], expectedExitCode: 0}}

  # ── Lists ─────────────────────────────────────────────────────────────────
  - {name: rpush,         exec: {command: ["redis-cli", "-e", "RPUSH", "l:q", "a", "b", "c", "d"], expectedExitCode: 0}}
  - {name: lrange,        exec: {command: ["redis-cli", "-e", "LRANGE", "l:q", "0", "-1"], expectedExitCode: 0}}
  - {name: lpop,          exec: {command: ["redis-cli", "-e", "LPOP", "l:q"], expectedExitCode: 0}}
  - {name: linsert,       exec: {command: ["redis-cli", "-e", "LINSERT", "l:q", "BEFORE", "c", "b2"], expectedExitCode: 0}}
  - {name: lmove,         exec: {command: ["redis-cli", "-e", "LMOVE", "l:q", "l:q2", "LEFT", "RIGHT"], expectedExitCode: 0}}
  - {name: llen,          exec: {command: ["redis-cli", "-e", "LLEN", "l:q"], expectedExitCode: 0}}

  # ── Sets ──────────────────────────────────────────────────────────────────
  - {name: sadd,          exec: {command: ["redis-cli", "-e", "SADD", "set:a", "x", "y", "z"], expectedExitCode: 0}}
  - {name: sadd2,         exec: {command: ["redis-cli", "-e", "SADD", "set:b", "y", "z", "w"], expectedExitCode: 0}}
  - {name: sinter,        exec: {command: ["redis-cli", "-e", "SINTER", "set:a", "set:b"], expectedExitCode: 0}}
  - {name: sunionstore,   exec: {command: ["redis-cli", "-e", "SUNIONSTORE", "set:u", "set:a", "set:b"], expectedExitCode: 0}}
  - {name: sscan,         exec: {command: ["redis-cli", "-e", "SSCAN", "set:a", "0"], expectedExitCode: 0}}

  # ── Sorted sets ───────────────────────────────────────────────────────────
  - {name: zadd,          exec: {command: ["redis-cli", "-e", "ZADD", "z:lb", "1", "a", "2", "b", "3", "c"], expectedExitCode: 0}}
  - {name: zrangebyscore, exec: {command: ["redis-cli", "-e", "ZRANGEBYSCORE", "z:lb", "-inf", "+inf"], expectedExitCode: 0}}
  - {name: zincrby,       exec: {command: ["redis-cli", "-e", "ZINCRBY", "z:lb", "5", "a"], expectedExitCode: 0}}
  - {name: zpopmax,       exec: {command: ["redis-cli", "-e", "ZPOPMAX", "z:lb"], expectedExitCode: 0}}
  - {name: zrangestore,   exec: {command: ["redis-cli", "-e", "ZRANGESTORE", "z:dst", "z:lb", "0", "-1"], expectedExitCode: 0}}

  # ── HyperLogLog / Geo ─────────────────────────────────────────────────────
  - {name: pfadd,         exec: {command: ["redis-cli", "-e", "PFADD", "hll:v", "a", "b", "c"], expectedExitCode: 0}}
  - {name: pfcount,       exec: {command: ["redis-cli", "-e", "PFCOUNT", "hll:v"], expectedExitCode: 0}}
  - {name: geoadd,        exec: {command: ["redis-cli", "-e", "GEOADD", "geo:p", "13.361", "38.115", "palermo"], expectedExitCode: 0}}
  - {name: geosearch,     exec: {command: ["redis-cli", "-e", "GEOSEARCH", "geo:p", "FROMMEMBER", "palermo", "BYRADIUS", "200", "km", "ASC"], expectedExitCode: 0}}

  # ── Streams ───────────────────────────────────────────────────────────────
  - {name: xadd1,         exec: {command: ["redis-cli", "-e", "XADD", "st:s", "*", "f", "1"], expectedExitCode: 0}}
  - {name: xadd2,         exec: {command: ["redis-cli", "-e", "XADD", "st:s", "*", "f", "2"], expectedExitCode: 0}}
  - {name: xlen,          exec: {command: ["redis-cli", "-e", "XLEN", "st:s"], expectedExitCode: 0}}
  - {name: xrange,        exec: {command: ["redis-cli", "-e", "XRANGE", "st:s", "-", "+"], expectedExitCode: 0}}
  - {name: xinfo,         exec: {command: ["redis-cli", "-e", "XINFO", "STREAM", "st:s"], expectedExitCode: 0}}
  - {name: xtrim,         exec: {command: ["redis-cli", "-e", "XTRIM", "st:s", "MAXLEN", "100"], expectedExitCode: 0}}

  # ── Scripting (Lua) + functions ───────────────────────────────────────────
  - {name: eval,          exec: {command: ["redis-cli", "-e", "EVAL", "return redis.call('SET', KEYS[1], ARGV[1])", "1", "lua:k", "luaval"], expectedExitCode: 0}}
  - {name: eval-compute,  exec: {command: ["redis-cli", "-e", "EVAL", "local t=0 for i=1,100 do t=t+i end return t", "0"], expectedExitCode: 0}}
  - {name: script-load,   exec: {command: ["redis-cli", "-e", "SCRIPT", "LOAD", "return 1"], expectedExitCode: 0}}
  - {name: function-list, exec: {command: ["redis-cli", "-e", "FUNCTION", "LIST"], expectedExitCode: 0}}
  - {name: function-stats,exec: {command: ["redis-cli", "-e", "FUNCTION", "STATS"], expectedExitCode: 0}}

  # NOTE: MULTI/EXEC transactions and SUBSCRIBE/MONITOR/blocking ops are omitted —
  # bobctl's RESP client opens a fresh RESP2 connection per test, so multi-command
  # transaction state and concurrent pub/sub cannot be exercised through it. Drive
  # those via a dedicated load pod (redis-benchmark / a Lua-scripted client) if the
  # profile needs the transaction/replication-buffer code paths.

  # ── Pub/Sub publish (fire-and-forget) ─────────────────────────────────────
  - {name: publish,       exec: {command: ["redis-cli", "-e", "PUBLISH", "ch:events", "hello-subscribers"], expectedExitCode: 0}}
  - {name: pubsub-chan,   exec: {command: ["redis-cli", "-e", "PUBSUB", "CHANNELS"], expectedExitCode: 0}}

  # ── Generic keyspace / expiry / object introspection ──────────────────────
  - {name: expire,        exec: {command: ["redis-cli", "-e", "EXPIRE", "s:k", "300"], expectedExitCode: 0}}
  - {name: ttl,           exec: {command: ["redis-cli", "-e", "TTL", "s:k"], expectedExitCode: 0}}
  - {name: persist,       exec: {command: ["redis-cli", "-e", "PERSIST", "s:k"], expectedExitCode: 0}}
  - {name: type,          exec: {command: ["redis-cli", "-e", "TYPE", "z:lb"], expectedExitCode: 0}}
  - {name: object-encoding, exec: {command: ["redis-cli", "-e", "OBJECT", "ENCODING", "z:lb"], expectedExitCode: 0}}
  - {name: copy,          exec: {command: ["redis-cli", "-e", "COPY", "s:k", "s:kcopy"], expectedExitCode: 0}}
  - {name: scan,          exec: {command: ["redis-cli", "-e", "SCAN", "0", "COUNT", "100"], expectedExitCode: 0}}
  - {name: randomkey,     exec: {command: ["redis-cli", "-e", "RANDOMKEY"], expectedExitCode: 0}}
  - {name: touch,         exec: {command: ["redis-cli", "-e", "TOUCH", "s:a", "s:b"], expectedExitCode: 0}}

  # ── Persistence — the fork-triggering paths (key for a realistic profile) ──
  - {name: bgsave,        exec: {command: ["redis-cli", "-e", "BGSAVE", "SCHEDULE"], expectedExitCode: 0}}
  - {name: lastsave,      exec: {command: ["redis-cli", "-e", "LASTSAVE"], expectedExitCode: 0}}
  - {name: config-aof-on, exec: {command: ["redis-cli", "-e", "CONFIG", "SET", "appendonly", "yes"], expectedExitCode: 0}}
  - {name: config-aof-off, exec: {command: ["redis-cli", "-e", "CONFIG", "SET", "appendonly", "no"], expectedExitCode: 0}}

  # ── Cleanup ───────────────────────────────────────────────────────────────
  - {name: unlink,        exec: {command: ["redis-cli", "-e", "UNLINK", "s:kcopy", "l:q2", "set:u", "z:dst"], expectedExitCode: 0}}
