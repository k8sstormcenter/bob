apiVersion: bobctl.k8sstormcenter.io/v1alpha1
kind: FunctionalTestSuite
metadata:
  name: redis-distro-functional-tests
  description: >-
    Benign redis-protocol read/write path implemented by every distro under
    comparison (redis, valkey, keydb, dragonfly). Must not alert.
target:
  service: redis
  namespace: redis-oss
  port: 6379
  scheme: tcp
tests:
  - name: ping
    exec: {command: ["redis-cli", "-e", "PING"], expectedExitCode: 0}
  - name: info-server
    exec: {command: ["redis-cli", "-e", "INFO", "server"], expectedExitCode: 0}
  - name: set-key
    exec: {command: ["redis-cli", "-e", "SET", "bob:probe", "v1"], expectedExitCode: 0}
  - name: get-key
    exec: {command: ["redis-cli", "-e", "GET", "bob:probe"], expectedExitCode: 0}
  - name: dbsize
    exec: {command: ["redis-cli", "-e", "DBSIZE"], expectedExitCode: 0}
  - name: client-list
    exec: {command: ["redis-cli", "-e", "CLIENT", "LIST"], expectedExitCode: 0}
  - name: command-count
    exec: {command: ["redis-cli", "-e", "COMMAND", "COUNT"], expectedExitCode: 0}
  - name: del-key
    exec: {command: ["redis-cli", "-e", "DEL", "bob:probe"], expectedExitCode: 0}
