apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ContainerProfile
metadata:
  name: vizier-metadata-nats-wait
  namespace: pl
  annotations: {kubescape.io/managed-by: User}
spec:
  execs:
  - path: /bin/busybox
    args: [/bin/sh, -c, 'set -xe; URL="${PROTOCOL}://${SERVICE_NAME}:${SERVICE_PORT}${HEALTH_PATH}"; until [ $(curl -m 0.5 -s -o /dev/null -w "%{http_code}" -k ${URL}) -eq 200 ]; do echo "waiting for ${URL}"; sleep 2; done;']
    envs: []
    argsrequired: false
  - path: /bin/busybox
    args: [/bin/sleep, '2']
    envs: []
    argsrequired: false
  - path: /usr/bin/curl
    args: [/usr/bin/curl, -m, '0.5', -s, -o, /dev/null, -w, '%{http_code}', -k, 'http://pl-nats-mgmt:8222']
    envs: []
    argsrequired: false
