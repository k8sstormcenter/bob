# SBoB for kelvin/qb-wait — generalised from a recorded ContainerProfile.
# opens 63 -> 9 after collapse+portability.
apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ContainerProfile
metadata:
  name: kelvin-qb-wait
  namespace: pl
  annotations:
    kubescape.io/managed-by: User
    kubescape.io/completion: complete
    kubescape.io/status: completed
spec:
  execs:
  - path: /bin/busybox
  - path: /usr/bin/curl
  opens:
  - path: /.config/curlrc
  - path: /.curlrc
  - path: /dev/null
  - path: /etc/⋯
  - path: /etc/⋯/openssl.cnf
  - path: /lib/⋯
  - path: /proc/⋯/1/fd
  - path: /usr/lib/⋯
  - path: /usr/local/lib/⋯
  syscalls:
  - arch_prctl
  - capget
  - capset
  - close_range
  - dup2
  - epoll_ctl
  - epoll_pwait
  - eventfd2
  - exit
  - exit_group
  - faccessat2
  - fork
  - fstatfs
  - futex
  - getdents64
  - getegid
  - geteuid
  - getgid
  - gettid
  - getuid
  - membarrier
  - newfstatat
  - open
  - openat
  - openat2
  - pipe
  - pipe2
  - poll
  - prctl
  - recvmsg
  - sendto
  - set_tid_address
  - setgroups
  - stat
  - statx
  - tkill
  - unknown
  - wait4
  - writev
  capabilities:
  - CAP_DAC_OVERRIDE
  - CAP_DAC_READ_SEARCH
  - CAP_SETGID
  - CAP_SETUID
  egress:
  - identifier: ceb1bd1c4e29911ce508482bd2e727fce6fe7e157ae0d62e4b5cce145343ff16
    podSelector:
      matchLabels:
        app: pl-monitoring
        component: vizier
        name: vizier-query-broker
    ports:
    - name: TCP-50300
      protocol: TCP
      port: 50300
  - identifier: e5e8ca3d76f701a19b7478fdc1c8c24ccc6cef9902b52c8c7e015439e2a1ddf3
    podSelector:
      matchLabels:
        k8s-app: kube-dns
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    ports:
    - name: UDP-53
      protocol: UDP
      port: 53
