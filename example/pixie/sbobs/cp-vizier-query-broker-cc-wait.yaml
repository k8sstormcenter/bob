# SBoB for vizier-query-broker/cc-wait — generalised from a recorded ContainerProfile.
# opens 63 -> 9 after collapse+portability.
apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ContainerProfile
metadata:
  name: vizier-query-broker-cc-wait
  namespace: pl
  annotations:
    kubescape.io/managed-by: User
    kubescape.io/completion: complete
    kubescape.io/status: completed
spec:
  execs:
  - path: /bin/busybox
  - path: /usr/bin/curl
  opens:
  - path: /.config/curlrc
  - path: /.curlrc
  - path: /dev/null
  - path: /etc/⋯
  - path: /etc/⋯/openssl.cnf
  - path: /lib/⋯
  - path: /proc/⋯/1/fd
  - path: /usr/lib/⋯
  - path: /usr/local/lib/⋯
  syscalls:
  - brk
  - close
  - close_range
  - connect
  - dup2
  - epoll_ctl
  - epoll_pwait
  - eventfd2
  - exit_group
  - faccessat2
  - fork
  - fstat
  - fstatfs
  - getegid
  - geteuid
  - getgid
  - getpid
  - getsockopt
  - gettid
  - getuid
  - ioctl
  - membarrier
  - mmap
  - mprotect
  - munmap
  - nanosleep
  - newfstatat
  - open
  - openat
  - openat2
  - pipe
