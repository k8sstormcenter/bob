apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ContainerProfile
metadata:
  name: pl-nats-pl-nats
  namespace: pl
  annotations: {kubescape.io/managed-by: User}
spec:
  execs:
  - path: /nats-server
    args: [/nats-server, --config, /etc/nats-config/nats.conf]
    envs: []
    argsrequired: false
  opens:
  - path: /etc/localtime
    flags: [O_RDONLY]
  - path: "/etc/nats-config/\u22EF/nats.conf"
    flags: [O_CLOEXEC, O_RDONLY]
  - path: "/etc/nats-server-tls-certs/\u22EF/ca.crt"
    flags: [O_CLOEXEC, O_RDONLY]
  - path: "/etc/nats-server-tls-certs/\u22EF/server.crt"
    flags: [O_CLOEXEC, O_RDONLY]
  - path: "/etc/nats-server-tls-certs/\u22EF/server.key"
    flags: [O_CLOEXEC, O_RDONLY]
  - path: "/proc/\u22EF/cgroup"
    flags: [O_CLOEXEC, O_RDONLY]
  - path: "/proc/\u22EF/mountinfo"
    flags: [O_CLOEXEC, O_RDONLY]
  - path: "/proc/\u22EF/net/*"
    flags: [O_CLOEXEC, O_RDONLY]
  - path: "/proc/\u22EF/stat"
    flags: [O_CLOEXEC, O_RDONLY]
  - path: "/proc/\u22EF/task/*"
    flags: [O_CLOEXEC, O_DIRECTORY, O_RDONLY]
  - path: /sys/fs/cgroup/*
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /sys/kernel/mm/transparent_hugepage/hpage_pmd_size
    flags: [O_RDONLY]
  - path: /var/run/nats/nats.pid
    flags: [O_CLOEXEC, O_CREAT, O_TRUNC, O_WRONLY]
  capabilities: [CAP_DAC_OVERRIDE, CAP_DAC_READ_SEARCH, CAP_NET_ADMIN]
  ingress:
  - identifier: 0a52270744d47da0e770b43cf46a02db90adfdaed097b34c8eacf9c267793a14
    ipAddress: 10.42.0.1
    ports:
    - {name: TCP-4222, protocol: TCP, port: 4222}
    - {name: TCP-8222, protocol: TCP, port: 8222}
  - identifier: 47a42bd64869e8ed568c98f218ab5d89ea818764568dffb66fe316abd30926cf
    ipAddress: 10.42.1.0
    ports:
    - {name: TCP-4222, protocol: TCP, port: 4222}
  - identifier: be971f99ebb4711c4b6e7c0c841a69031c22bcf1b3a3c0195b23f7cefc76a653
    podSelector:
      matchLabels: {app: pl-monitoring, component: vizier, name: vizier-metadata, plane: control, vizier-name: pixie}
    ports:
    - {name: TCP-8222, protocol: TCP, port: 8222}
    - {name: TCP-4222, protocol: TCP, port: 4222}
  - identifier: 45d5ad2344012200296b36dd59abfae78c961c8a703540a298ae24ecc2fad58d
    podSelector:
      matchLabels: {app: pixie-operator, component: pixie-operator, name: vizier-operator, plane: control}
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: px-operator}
    ports:
    - {name: TCP-8222, protocol: TCP, port: 8222}
  - identifier: dbdcdb16791c07e66a8882eadcf9d357a53e8f2d4af6558994e9e3295188eb52
    podSelector:
      matchLabels: {app: pl-monitoring, component: vizier, name: vizier-cloud-connector, plane: control, vizier-bootstrap: 'true', vizier-name: pixie}
    ports:
    - {name: TCP-8222, protocol: TCP, port: 8222}
