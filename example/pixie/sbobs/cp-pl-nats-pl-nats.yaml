  - identifier: e23b35d90d5eaf9f53654dc4ce085c87b57a167a44f9567c1448423131aeb405
    podSelector:
      matchLabels: {app: pl-monitoring, component: vizier, name: vizier-query-broker, plane: control, vizier-name: pixie}
