apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ContainerProfile
metadata:
  name: olm-operator
  namespace: olm
  annotations: {kubescape.io/managed-by: User}
spec:
  execs:
  - path: /bin/olm
    args: [/bin/olm, --namespace, olm, --writeStatusName]
    envs: []
    argsrequired: false
  opens:
  - path: /bin/olm
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /etc/localtime
    flags: [O_RDONLY]
  - path: /etc/passwd
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /opt/hostedtoolcache/go/1.21.7/x64/lib/time/zoneinfo.zip
    flags: [O_RDONLY]
  - path: "/proc/\u22EF/kernel/*"
    flags: [O_CLOEXEC, O_RDONLY]
  - path: "/proc/\u22EF/net/*"
    flags: [O_CLOEXEC, O_RDONLY]
  - path: "/proc/\u22EF/task/*"
    flags: [O_CLOEXEC, O_DIRECTORY, O_RDONLY]
  - path: /sys/kernel/mm/transparent_hugepage/hpage_pmd_size
    flags: [O_RDONLY]
  - path: "/var/run/secrets/kubernetes.io/serviceaccount/\u22EF/ca.crt"
    flags: [O_CLOEXEC, O_RDONLY]
  - path: "/var/run/secrets/kubernetes.io/serviceaccount/\u22EF/token"
    flags: [O_CLOEXEC, O_RDONLY]
  capabilities: [CAP_DAC_OVERRIDE, CAP_DAC_READ_SEARCH, CAP_NET_ADMIN]
  ingress:
  - identifier: 0a52270744d47da0e770b43cf46a02db90adfdaed097b34c8eacf9c267793a14
    ipAddress: 10.42.0.1
    ports:
    - {name: TCP-8080, protocol: TCP, port: 8080}
