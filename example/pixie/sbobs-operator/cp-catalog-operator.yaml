apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ContainerProfile
metadata:
  name: catalog-operator
  namespace: olm
  annotations: {kubescape.io/managed-by: User}
spec:
  execs:
  - path: /bin/catalog
    args: [/bin/catalog, --namespace, olm, '--configmapServerImage=quay.io/operator-framework/configmap-operator-registry:latest', --util-image, 'quay.io/operator-framework/olm@sha256:1b6002156f568d722c29138575733591037c24b4bfabc67946f268ce4752c3e6', --opmImage, 'quay.io/operator-framework/opm@sha256:d999588bd4e9509ec9e75e49adfb6582d256e9421e454c7fb5e9fe57e7b1aada']
    envs: []
    argsrequired: false
  opens:
  - path: /bin/catalog
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /etc/hosts
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /etc/localtime
    flags: [O_RDONLY]
  - path: /etc/nsswitch.conf
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /etc/passwd
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /etc/resolv.conf
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /opt/hostedtoolcache/go/1.21.7/x64/lib/time/zoneinfo.zip
    flags: [O_RDONLY]
  - path: "/proc/\u22EF/kernel/*"
    flags: [O_CLOEXEC, O_RDONLY]
  - path: "/proc/\u22EF/net/*"
    flags: [O_CLOEXEC, O_RDONLY]
  - path: "/proc/\u22EF/task/*"
    flags: [O_CLOEXEC, O_DIRECTORY, O_RDONLY]
  - path: /sys/kernel/mm/transparent_hugepage/hpage_pmd_size
    flags: [O_RDONLY]
  - path: "/var/run/secrets/kubernetes.io/serviceaccount/\u22EF/ca.crt"
    flags: [O_CLOEXEC, O_RDONLY]
  - path: "/var/run/secrets/kubernetes.io/serviceaccount/\u22EF/token"
    flags: [O_CLOEXEC, O_RDONLY]
  capabilities: [CAP_DAC_OVERRIDE, CAP_DAC_READ_SEARCH, CAP_NET_ADMIN]
  egress:
  - identifier: 2297897752f7953edd031ddd6f824a44163c479b649d3db6fef80eff7303dcd2
    podSelector:
      matchLabels: {olm.catalogSource: pixie-operator-index, olm.managed: 'true'}
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: px-operator}
    ports:
    - {name: TCP-50051, protocol: TCP, port: 50051}
  - identifier: e5e8ca3d76f701a19b7478fdc1c8c24ccc6cef9902b52c8c7e015439e2a1ddf3
    podSelector:
      matchLabels: {k8s-app: kube-dns}
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: kube-system}
    ports:
    - {name: UDP-53, protocol: UDP, port: 53}
  ingress:
  - identifier: 209567a3863579abd33381b8530e8ba80051db1f3ed6c9cf0672c6b27ab4e936
    ipAddress: 10.42.1.1
    ports:
    - {name: TCP-8080, protocol: TCP, port: 8080}
