# ContainerProfile SBoB for argocd-server — the API front-end.
#
# WHY THIS IS HAND-AUTHORED (not purely learned): argocd-server is a Go control-
# plane process that NEVER fork-execs during normal operation. A learned profile
# therefore captures execs=[] — and an empty exec allowlist means node-agent has
# nothing to contrast against, so R0001 never fires on an attacker's `cat`/`perl`/
# `ln`. Declaring the ONE legitimate exec chain (tini → argocd-server → argocd)
# turns every other exec into an anomaly. This is the core reason internal
# control-plane components need a User-authored baseline, not just learning.
#
# Binding: the argocd-server pod carries
#   kubescape.io/user-defined-profile: argocd-server
# node-agent enforces the CP named "argocd-server" REGARDLESS of the replicaset
# hash — which also sidesteps the RS-keying churn that breaks a learned profile
# when the deployment re-rolls.
apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ContainerProfile
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    kubescape.io/managed-by: User
spec:
  architectures: [amd64]
  execs:
    # The ONLY legitimate exec chain. tini is PID1; it exec's argocd-server,
    # which is a symlink to argocd. Any other exec → R0001.
    - path: /usr/bin/tini
      args: [/usr/bin/tini, "⋯⋯"]
    - path: /usr/local/bin/argocd-server
      args: [argocd-server, "⋯⋯"]
    - path: /usr/local/bin/argocd
      args: [argocd-server, "⋯⋯"]
  opens:
    # argocd-server (Go, static-ish) does minimal file I/O after startup. Keep
    # the dynamic-linker + CA bundle it reads at boot; the TLS cert + config it
    # serves from. Volatile segments wildcarded, the rest literal so anomalies
    # stay Separable.
    - path: /etc/ssl/certs/ca-certificates.crt
      flags: [O_RDONLY]
    - path: /etc/ld.so.cache
      flags: [O_RDONLY]
    - path: /etc/passwd
      flags: [O_RDONLY]
    # per-PID proc churn (Go runtime reads its own status/maps)
    - path: /proc/*
      flags: [O_RDONLY]
    - path: /sys/*
      flags: [O_RDONLY]
    # argocd-server is a Kubernetes API client: it reads its projected SA token
    # in normal operation. The token lives under an atomic-swap timestamp dir
    # (..2026_..) regenerated on rotation → wildcard that segment. Declaring this
    # as baseline is what stops R0002 AND R0006 from FPing on the legitimate
    # read (the k8s-client suppression that also makes the attacker's `cat` of
    # the same token NOT a reliable tell — hence the attack suite asserts R0001
    # on the exec instead).
    - path: /run/secrets/kubernetes.io/serviceaccount/⋯/token
      flags: [O_RDONLY]
    - path: /run/secrets/kubernetes.io/serviceaccount/token
      flags: [O_RDONLY]
  capabilities: []
  endpoints: []
  # Allow the container-runtime init phase so a pod (re)start doesn't FP
  # R0002/R0004 on runc's own touches. argocd-server itself is NOT in the
  # allow-list, so a real anomaly under it still fires. R0006: argocd-server
  # legitimately reads its SA token (k8s client) — allow it so R0006 doesn't FP
  # on the benign control-plane access; the attacker's `cat` of the token is
  # still caught by R0001 (unexpected process).
  rulePolicies:
    R0002:
      processAllowed: ["runc:[1:INIT]", "runc:[1:CHILD]", "runc:[2:INIT]", "runc:[3:INIT]"]
    R0004:
      processAllowed: ["runc:[1:INIT]", "runc:[1:CHILD]", "runc:[2:INIT]", "runc:[3:INIT]"]
    R0006:
      processAllowed: ["argocd-server"]
  # Network: unlike a database server, argocd-server is BOTH a server (UI/API
  # ingress on 8080) AND a legitimate client (egress to repo-server, redis, dex,
  # and the kube-apiserver). egress is therefore NOT null — declaring null would
  # FP R0011 on every normal control-plane call. The in-cluster peers it dials
  # are declared; anything outside them is unexpected egress.
  matchLabels:
    app.kubernetes.io/name: argocd-server
  ingress:
    - identifier: ui-api-clients
      type: internal
      ports:
        - {name: TCP-8080, port: 8080, protocol: TCP}
  egress:
    - identifier: argocd-repo-server
      type: internal
      podSelector:
        matchLabels:
          app.kubernetes.io/name: argocd-repo-server
      ports:
        - {name: TCP-8081, port: 8081, protocol: TCP}
    - identifier: argocd-redis
      type: internal
      podSelector:
        matchLabels:
          app.kubernetes.io/name: argocd-redis
      ports:
        - {name: TCP-6379, port: 6379, protocol: TCP}
    - identifier: argocd-dex-server
      type: internal
      podSelector:
        matchLabels:
          app.kubernetes.io/name: argocd-dex-server
      ports:
        - {name: TCP-5556, port: 5556, protocol: TCP}
