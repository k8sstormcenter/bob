apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ContainerProfile
metadata:
  name: argocd-dex-server
  namespace: argocd
  annotations: {kubescape.io/managed-by: User}
spec:
  architectures: [amd64]
  matchLabels: {app.kubernetes.io/name: argocd-dex-server}
  execs:
  - path: /shared/argocd-dex
    args: [/shared/argocd-dex, rundex]
  opens:
  - path: /.kube/config
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /etc/apache/mime.types
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /etc/apache2/mime.types
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /etc/httpd/conf/mime.types
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /etc/localtime
    flags: [O_RDONLY]
  - path: /etc/mime.types
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /etc/passwd
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /proc/⋯/task/⋯/fd
    flags: [O_CLOEXEC, O_DIRECTORY, O_RDONLY]
  - path: /run/secrets/kubernetes.io/serviceaccount/⋯/*
    flags: [O_RDONLY]
  - path: /run/secrets/kubernetes.io/serviceaccount/⋯/ca.crt
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /run/secrets/kubernetes.io/serviceaccount/⋯/namespace
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /run/secrets/kubernetes.io/serviceaccount/⋯/token
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /sys/kernel/mm/transparent_hugepage/hpage_pmd_size
    flags: [O_RDONLY]
  - path: /tmp/tls.crt
    flags: [O_CLOEXEC, O_CREAT, O_TRUNC, O_WRONLY]
  - path: /tmp/tls.key
    flags: [O_CLOEXEC, O_CREAT, O_TRUNC, O_WRONLY]
  - path: /usr/local/go/lib/time/zoneinfo.zip
    flags: [O_RDONLY]
  - path: /usr/local/share/mime/globs2
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /usr/share/mime/globs2
    flags: [O_CLOEXEC, O_RDONLY]
  capabilities: [CAP_DAC_OVERRIDE, CAP_DAC_READ_SEARCH]
  rulePolicies:
    R0002:
      processAllowed: ['runc:[1:INIT]', 'runc:[1:CHILD]', 'runc:[2:INIT]', 'runc:[3:INIT]']
    R0004:
      processAllowed: ['runc:[1:INIT]', 'runc:[1:CHILD]', 'runc:[2:INIT]', 'runc:[3:INIT]']
    R0006:
      processAllowed: [argocd-dex]
  endpoints: null
  ingress:
  - identifier: argocd-components
    type: internal
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: argocd}
    ports:
    - {name: TCP-5556, port: 5556, protocol: TCP}
    ipAddresses: [10.42.0.0/16, 10.244.0.0/16]
  egress:
  - dns: ''
    dnsNames: null
    identifier: dd18fa52244005a49761004e6173ec450c0779087cedb1eaf1ae49142a6550a2
    ipAddress: 10.43.0.1
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: default}
    podSelector:
      matchLabels: {component: apiserver, provider: kubernetes}
    ports:
    - {name: TCP-443, port: 443, protocol: TCP}
    type: internal
