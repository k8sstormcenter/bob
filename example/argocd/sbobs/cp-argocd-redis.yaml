apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ContainerProfile
metadata:
  name: argocd-redis
  namespace: argocd
  annotations: {kubescape.io/managed-by: User}
spec:
  architectures: [amd64]
  matchLabels: {app.kubernetes.io/name: argocd-redis}
  execs:
  - path: /bin/busybox
    args: [/usr/bin/id, -u]
  - path: /bin/busybox
    args: [/usr/local/bin/docker-entrypoint.sh, --save, --appendonly, 'no']
  - path: /usr/local/bin/redis-server
    args: [/usr/local/bin/redis-server, --save, --appendonly, 'no']
  opens:
  - path: /data/*
    flags: [O_LARGEFILE, O_RDONLY]
  - path: /dev/urandom
    flags: [O_LARGEFILE, O_RDONLY]
  - path: /etc/ld-musl-x86_64.path
    flags: [O_CLOEXEC, O_LARGEFILE, O_RDONLY]
  - path: /etc/localtime
    flags: [O_CLOEXEC, O_LARGEFILE, O_NONBLOCK, O_RDONLY]
  - path: /etc/passwd
    flags: [O_CLOEXEC, O_LARGEFILE, O_RDONLY]
  - path: /etc/ssl/openssl.cnf
    flags: [O_LARGEFILE, O_RDONLY]
  - path: /lib/libcrypto.so.3
    flags: [O_CLOEXEC, O_LARGEFILE, O_RDONLY]
  - path: /lib/libssl.so.3
    flags: [O_CLOEXEC, O_LARGEFILE, O_RDONLY]
  - path: /proc/⋯/net/core/somaxconn
    flags: [O_LARGEFILE, O_RDONLY]
  - path: /proc/⋯/stat
    flags: [O_LARGEFILE, O_RDONLY]
  - path: /proc/⋯/task/⋯/fd
    flags: [O_CLOEXEC, O_DIRECTORY, O_RDONLY]
  - path: /proc/⋯/vm/overcommit_memory
    flags: [O_CLOEXEC, O_LARGEFILE, O_RDONLY]
  - path: /run/secrets/kubernetes.io/serviceaccount/⋯/*
    flags: [O_RDONLY]
  - path: /run/secrets/kubernetes.io/serviceaccount/⋯/token
    flags: [O_RDONLY]
  - path: /sys/devices/system/clocksource/clocksource0/current_clocksource
    flags: [O_LARGEFILE, O_RDONLY]
  - path: /sys/kernel/mm/transparent_hugepage/enabled
    flags: [O_LARGEFILE, O_RDONLY]
  - path: /usr/local/bin/docker-entrypoint.sh
    flags: [O_CLOEXEC, O_LARGEFILE, O_RDONLY]
  capabilities: [CAP_DAC_OVERRIDE, CAP_DAC_READ_SEARCH, CAP_NET_ADMIN, CAP_SETGID, CAP_SETUID]
  rulePolicies:
    R0002:
      processAllowed: ['runc:[1:INIT]', 'runc:[1:CHILD]', 'runc:[2:INIT]', 'runc:[3:INIT]']
    R0004:
      processAllowed: ['runc:[1:INIT]', 'runc:[1:CHILD]', 'runc:[2:INIT]', 'runc:[3:INIT]']
  endpoints: null
  ingress:
  - identifier: argocd-components
    type: internal
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: argocd}
    ports:
    - {name: TCP-6379, port: 6379, protocol: TCP}
    ipAddresses: [10.42.0.0/16, 10.244.0.0/16]
  egress: null
