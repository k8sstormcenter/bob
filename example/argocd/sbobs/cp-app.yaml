apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ContainerProfile
metadata:
  name: argocd-repo-server
  namespace: argocd
  annotations:
    kubescape.io/managed-by: User
spec:
  architectures:
  - amd64
  imageID: quay.io/argoproj/argocd@sha256:2019f67cda4d38bec55cdb0a595361f0ea10d8dff9e91d6b994f77c62f193f21
  imageTag: quay.io/argoproj/argocd:v2.9.3
  execs:
  - path: /usr/bin/tini
    args:
    - /usr/bin/tini
    - --
    - /usr/local/bin/argocd-repo-server
  - path: /usr/local/bin/argocd-repo-server
    args:
    - /usr/local/bin/argocd-repo-server
  - path: /usr/bin/gpg
    args:
    - /usr/bin/gpg
  - path: /usr/bin/gpg-agent
    args:
    - /usr/bin/gpg-agent
  - path: /usr/local/bin/gpg-wrapper.sh
    args:
    - /usr/local/bin/gpg-wrapper.sh
  - path: /usr/bin/git
    args:
    - /usr/bin/git
  - path: /usr/lib/git-core/git
    args:
    - /usr/lib/git-core/git
  - path: /usr/lib/git-core/git-remote-http
    args:
    - /usr/lib/git-core/git-remote-http
  - path: /usr/lib/git-core/git-remote-https
    args:
    - /usr/lib/git-core/git-remote-https
  - path: /usr/local/bin/helm
    args:
    - /usr/local/bin/helm
    - template
  - path: /usr/local/bin/kustomize
    args:
    - /usr/local/bin/kustomize
    - build
  opens:
  - path: /app/config
    flags:
    - O_RDONLY
  - path: /home/argocd
    flags:
    - O_RDWR
    - O_CREAT
  - path: /tmp
    flags:
    - O_RDWR
    - O_CREAT
  - path: /usr/lib
    flags:
    - O_RDONLY
  - path: /usr/local
    flags:
    - O_RDONLY
  - path: /usr/share
    flags:
    - O_RDONLY
  - path: /etc/gnupg
    flags:
    - O_RDONLY
  - path: /etc/gcrypt
    flags:
    - O_RDONLY
  - path: /etc/ssl/certs/ca-certificates.crt
    flags:
    - O_RDONLY
  - path: /etc/resolv.conf
    flags:
    - O_RDONLY
  - path: /etc/hosts
    flags:
    - O_RDONLY
  - path: /etc/nsswitch.conf
    flags:
    - O_RDONLY
  - path: /etc/passwd
    flags:
    - O_RDONLY
  - path: /etc/mime.types
    flags:
    - O_RDONLY
  - path: /etc/ld.so.cache
    flags:
    - O_RDONLY
  - path: /dev/urandom
    flags:
    - O_RDONLY
  - path: /helm-working-dir
    flags:
    - O_RDWR
    - O_CREAT
  syscalls:
  - accept4
  - bind
  - brk
  - clone
  - close
  - connect
  - epoll_create1
  - epoll_ctl
  - epoll_pwait
  - execve
  - exit
  - exit_group
  - fcntl
  - fstat
  - futex
  - getdents64
  - getpeername
  - getsockname
  - getsockopt
  - listen
  - mmap
  - mprotect
  - munmap
  - newfstatat
  - openat
  - pipe2
  - poll
  - read
  - readlink
  - recvfrom
  - recvmsg
  - rt_sigaction
  - rt_sigprocmask
  - rt_sigreturn
  - sendto
  - setsockopt
  - socket
  - stat
  - statx
  - wait4
  - write
  - writev
  capabilities: []
  endpoints:
  - endpoint: :8084/healthz
    direction: inbound
    methods:
    - GET
    internal: true
  seccompProfile:
    spec:
      defaultAction: ''
  rulePolicies:
    R0002:
      processAllowed:
      - git
      - git-remote-http
      - helm
      - kustomize
      - argocd-repo-ser
      - runc:[1:INIT]
      - runc:[2:INIT]
      - runc:[1:CHILD]
    R0004:
      processAllowed:
      - runc:[1:INIT]
      - runc:[2:INIT]
      - runc:[1:CHILD]
  matchLabels:
    app.kubernetes.io/name: argocd-repo-server
  ingress:
  - identifier: ingress-from-app-controller
    ipAddress: ''
    dns: ''
    dnsNames: null
    ports:
    - name: TCP-8084
      port: 8084
      protocol: TCP
    podSelector:
      matchLabels:
        app.kubernetes.io/part-of: argocd
    namespaceSelector: null
    type: internal
  egress:
  - identifier: egress-kube-dns
    ipAddress: ''
    dns: ''
    dnsNames: null
    ports:
    - name: UDP-53
      port: 53
      protocol: UDP
    - name: TCP-53
      port: 53
      protocol: TCP
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        k8s-app: kube-dns
    type: internal
  - identifier: egress-git-source
    ipAddress: ''
    dns: github.com.
    dnsNames:
    - github.com.
    ports:
    - name: TCP-443
      port: 443
      protocol: TCP
    namespaceSelector: null
    podSelector: null
    type: external
