apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ContainerProfile
metadata:
  name: argocd-application-controller
  namespace: argocd
  annotations: {kubescape.io/managed-by: User}
spec:
  architectures: [amd64]
  execs:
  - path: /usr/bin/tini
    args: [/usr/bin/tini, ⋯⋯]
  - path: /usr/local/bin/argocd
    args: [/usr/local/bin/argocd-application-controller, ⋯⋯]
  opens:
  - path: /home/argocd/*
    flags: [O_CLOEXEC, O_CREAT, O_DIRECTORY, O_EXCL, O_RDONLY, O_RDWR, O_TRUNC, O_WRONLY]
  - path: /run/secrets/kubernetes.io/serviceaccount/*
    flags: [O_CLOEXEC, O_CREAT, O_DIRECTORY, O_EXCL, O_RDONLY, O_RDWR, O_TRUNC, O_WRONLY]
  - path: /tmp/*
    flags: [O_CLOEXEC, O_CREAT, O_DIRECTORY, O_EXCL, O_RDONLY, O_RDWR, O_TRUNC, O_WRONLY]
  - flags: [O_CLOEXEC, O_RDONLY]
    path: /usr/lib/x86_64-linux-gnu/libc.so.6
  - flags: [O_CLOEXEC, O_RDONLY]
    path: /usr/local/bin/argocd
  - flags: [O_RDONLY]
    path: /usr/share/zoneinfo/Etc/UTC
  capabilities: [CAP_DAC_OVERRIDE, CAP_DAC_READ_SEARCH, CAP_NET_ADMIN]
  endpoints:
  - direction: inbound
    endpoint: :8082/healthz
    headers:
      Connection: [close]
      Host: ['*:8082']
    internal: true
    methods: [GET]
  - direction: inbound
    endpoint: :6443/metrics
    headers:
      Accept-Encoding: [gzip]
      Host: ['*:6443']
    internal: true
    methods: [GET]
  rulePolicies:
    R0002:
      processAllowed: ['runc:[1:INIT]', 'runc:[1:CHILD]', 'runc:[2:INIT]', 'runc:[3:INIT]']
    R0004:
      processAllowed: ['runc:[1:INIT]', 'runc:[1:CHILD]', 'runc:[2:INIT]', 'runc:[3:INIT]']
    R0006:
      processAllowed: [tini, argocd-applicat]
  matchLabels: {app.kubernetes.io/name: argocd-application-controller}
  ingress:
  - identifier: 0a52270744d47da0e770b43cf46a02db90adfdaed097b34c8eacf9c267793a14
    namespaceSelector: null
    podSelector: null
    ports:
    - {name: TCP-8082, port: 8082, protocol: TCP}
    type: external
    ipAddresses: [10.42.0.0/16, 10.244.0.0/16]
  egress:
  - identifier: dd18fa52244005a49761004e6173ec450c0779087cedb1eaf1ae49142a6550a2
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: default}
    podSelector:
      matchLabels: {component: apiserver, provider: kubernetes}
    ports:
    - {name: TCP-443, port: 443, protocol: TCP}
    type: internal
    ipAddresses: [10.43.0.0/16, 10.96.0.0/12]
  - identifier: 760ff312ee1dc2fb28f74beb6f89fd37143fc11476e33af1541f9426b37945a2
    namespaceSelector: null
    podSelector:
      matchLabels: {app.kubernetes.io/name: argocd-redis}
    ports:
    - {name: TCP-6379, port: 6379, protocol: TCP}
    type: internal
  - identifier: e5e8ca3d76f701a19b7478fdc1c8c24ccc6cef9902b52c8c7e015439e2a1ddf3
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: kube-system}
    podSelector:
      matchLabels: {k8s-app: kube-dns}
    ports:
    - {name: UDP-53, port: 53, protocol: UDP}
    type: internal
  - identifier: 75c91e0bdb3e8b695c7f2184c070f716e3e511035fa875b25184bd360ca13706
    namespaceSelector: null
    podSelector:
      matchLabels: {app.kubernetes.io/name: argocd-repo-server}
    ports:
    - {name: TCP-8081, port: 8081, protocol: TCP}
    type: internal
