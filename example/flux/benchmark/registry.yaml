apiVersion: v1
kind: Namespace
metadata:
  name: flux-registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flux-registry
  namespace: flux-registry
  labels: {app: flux-registry}
spec:
  replicas: 1
  selector:
    matchLabels: {app: flux-registry}
  template:
    metadata:
      labels: {app: flux-registry}
    spec:
      containers:
      - name: registry
        image: registry:2
        ports:
        - {name: registry, containerPort: 5000, protocol: TCP}
        env:
        - {name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true"}
        volumeMounts:
        - {name: data, mountPath: /var/lib/registry}
        readinessProbe:
          httpGet: {path: /v2/, port: 5000}
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: "1", memory: 512Mi}
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: flux-registry
  namespace: flux-registry
  labels: {app: flux-registry}
spec:
  type: ClusterIP
  selector: {app: flux-registry}
  ports:
  - {name: registry, port: 5000, targetPort: registry, protocol: TCP}
