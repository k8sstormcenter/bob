apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ContainerProfile
metadata:
  name: flux-notification-controller
  namespace: flux-system
  annotations: {kubescape.io/managed-by: User}
spec:
  architectures: [amd64]
  capabilities: [CAP_DAC_OVERRIDE, CAP_DAC_READ_SEARCH, CAP_NET_ADMIN]
  execs:
  - args: [/usr/local/bin/notification-controller, --watch-all-namespaces=true, --log-level=info, --log-encoding=json, --enable-leader-election]
    path: /usr/local/bin/notification-controller
  opens:
  - path: /data
    flags: [O_CLOEXEC, O_DIRECTORY, O_RDONLY]
  - path: /data/*
    flags: [O_CLOEXEC, O_CREAT, O_RDONLY, O_RDWR, O_WRONLY]
  - flags: [O_CLOEXEC, O_RDONLY]
    path: /etc/hosts
  - flags: [O_RDONLY]
    path: /etc/localtime
  - flags: [O_CLOEXEC, O_RDONLY]
    path: /etc/nsswitch.conf
  - flags: [O_CLOEXEC, O_RDONLY]
    path: /etc/resolv.conf
  - flags: [O_CLOEXEC, O_RDONLY]
    path: /proc/⋯/cgroup
  - flags: [O_CLOEXEC, O_RDONLY]
    path: /proc/⋯/mountinfo
  - flags: [O_CLOEXEC, O_RDONLY]
    path: /proc/⋯/net/*
  - flags: [O_CLOEXEC, O_DIRECTORY, O_RDONLY]
    path: /proc/⋯/task/*
  - flags: [O_CLOEXEC, O_RDONLY]
    path: /run/secrets/kubernetes.io/serviceaccount/⋯/ca.crt
  - flags: [O_CLOEXEC, O_RDONLY]
    path: /run/secrets/kubernetes.io/serviceaccount/⋯/namespace
  - flags: [O_CLOEXEC, O_RDONLY]
    path: /run/secrets/kubernetes.io/serviceaccount/⋯/token
  - flags: [O_CLOEXEC, O_RDONLY]
    path: /sys/fs/cgroup/*
  - flags: [O_RDONLY]
    path: /sys/kernel/mm/transparent_hugepage/hpage_pmd_size
  - flags: [O_CLOEXEC, O_RDONLY]
    path: /usr/local/bin/notification-controller
  syscalls: []
  endpoints:
  - direction: inbound
    endpoint: :9440/readyz
    headers:
      Connection: [close]
      Host: ['*:9440']
    internal: true
    methods: [GET]
  - direction: inbound
    endpoint: :80/
    headers:
      Accept-Encoding: [gzip]
      Host: [notification-controller.flux-system.svc.cluster.local.]
    internal: true
    methods: [POST]
  - direction: outbound
    endpoint: :9093/api/v2/alerts
    headers:
      Accept-Encoding: [gzip]
      Host: ['alertmanager.honey.svc.cluster.local:9093']
    internal: true
    methods: [POST]
  - direction: inbound
    endpoint: :9440/healthz
    headers:
      Connection: [close]
      Host: ['*:9440']
    internal: true
    methods: [GET]
  - direction: inbound
    endpoint: :6443/metrics
    headers:
      Accept-Encoding: [gzip]
      Host: ['*:6443']
    internal: true
    methods: [GET]
  rulePolicies:
    R0002:
      processAllowed: ['runc:[1:INIT]', 'runc:[1:CHILD]', 'runc:[2:INIT]', 'runc:[3:INIT]']
    R0004:
      processAllowed: ['runc:[1:INIT]', 'runc:[1:CHILD]', 'runc:[2:INIT]', 'runc:[3:INIT]']
    R0006:
      processAllowed: [notification-co, flux]
  matchLabels: {app: notification-controller}
  ingress: []
  egress:
  - identifier: dd18fa52244005a49761004e6173ec450c0779087cedb1eaf1ae49142a6550a2
