    type: internal
  - identifier: e5e8ca3d76f701a19b7478fdc1c8c24ccc6cef9902b52c8c7e015439e2a1ddf3
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: kube-system}
    podSelector:
      matchLabels: {k8s-app: kube-dns}
    ports:
    - {name: UDP-53, port: 53, protocol: UDP}
    type: internal
  - identifier: b7c835a2fe0ca3366d748a90f28db25fbc2ad8d2e010b7bbaecef77ef37a7ecd
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: honey}
    podSelector:
      matchLabels: {app: alertmanager}
    ports:
    - {name: TCP-9093, port: 9093, protocol: TCP}
    type: internal
  imageID: ghcr.io/fluxcd/notification-controller@sha256:9ce503e7bcb8493fafe2aaef0c2ac4396df4f6890256acf9cd444a2dcd2a69ed
  imageTag: ghcr.io/fluxcd/notification-controller:v1.9.2
