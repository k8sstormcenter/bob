apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ContainerProfile
metadata:
  name: flux-image-automation-controller
  namespace: flux-system
  annotations: {kubescape.io/managed-by: User}
spec:
  architectures: [amd64]
  matchLabels: {app: image-automation-controller}
  execs:
  - path: /usr/local/bin/image-automation-controller
    args: [/usr/local/bin/image-automation-controller, ⋯⋯]
  opens:
  - path: /etc/localtime
    flags: [O_RDONLY]
  - path: /proc/⋯
    flags: [O_RDONLY]
  - path: /proc/⋯/*
    flags: [O_RDONLY]
  - path: /proc/⋯/cgroup
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /proc/⋯/mountinfo
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /proc/⋯/net/core/somaxconn
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /proc/⋯/task/⋯/fd
    flags: [O_CLOEXEC, O_DIRECTORY, O_RDONLY]
  - path: /run/secrets/kubernetes.io/serviceaccount/⋯/ca.crt
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /run/secrets/kubernetes.io/serviceaccount/⋯/namespace
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /run/secrets/kubernetes.io/serviceaccount/⋯/token
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /sys/fs/cgroup/cpu.max
    flags: [O_CLOEXEC, O_RDONLY]
  - path: /sys/kernel/mm/transparent_hugepage/hpage_pmd_size
    flags: [O_RDONLY]
  - path: /tmp/⋯/*
    flags: [O_RDONLY, O_RDWR, O_CREAT]
  - path: /usr/local/bin/image-automation-controller
    flags: [O_CLOEXEC, O_RDONLY]
  capabilities: [CAP_DAC_OVERRIDE, CAP_DAC_READ_SEARCH, CAP_NET_ADMIN]
  rulePolicies:
    R0002:
      processAllowed: ['runc:[1:INIT]', 'runc:[1:CHILD]', 'runc:[2:INIT]', 'runc:[3:INIT]']
    R0004:
      processAllowed: ['runc:[1:INIT]', 'runc:[1:CHILD]', 'runc:[2:INIT]', 'runc:[3:INIT]']
  endpoints:
  - direction: inbound
    endpoint: :9440/readyz
    headers:
      Connection: [close]
      Host: ['10.42.0.231:9440']
    internal: true
    methods: [GET]
  - direction: inbound
    endpoint: :9440/healthz
    headers:
      Connection: [close]
      Host: ['10.42.0.231:9440']
    internal: true
    methods: [GET]
  ingress:
  - identifier: kubelet-probes
    type: internal
    entity: host
    ports:
    - {name: TCP-9440, port: 9440, protocol: TCP}
    - {name: TCP-9090, port: 9090, protocol: TCP}
    - {name: TCP-8080, port: 8080, protocol: TCP}
  egress:
  - dns: ''
    dnsNames: null
    identifier: dd18fa52244005a49761004e6173ec450c0779087cedb1eaf1ae49142a6550a2
    ipAddress: 10.43.0.1
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: default}
    podSelector:
      matchLabels: {component: apiserver, provider: kubernetes}
    ports:
    - {name: TCP-443, port: 443, protocol: TCP}
    type: internal
  - identifier: git-and-oci-upstream
    type: external
    dnsNames: [github.com., ghcr.io., stefanprodan.github.io.]
    ipAddresses: [140.82.112.0/20, 185.199.108.0/22]
    ports:
    - {name: TCP-443, port: 443, protocol: TCP}
  - identifier: kube-dns
    type: internal
    serviceRefNamespace: kube-system
    serviceRefName: kube-dns
    ports:
    - {name: UDP-53, port: 53, protocol: UDP}
    ipAddresses: [10.43.0.0/16, 10.96.0.0/12]
  - identifier: source-controller
    type: internal
    serviceRefNamespace: flux-system
    serviceRefName: source-controller
    ports:
    - {name: TCP-80, port: 80, protocol: TCP}
    ipAddresses: [10.43.0.0/16, 10.96.0.0/12]
  - identifier: notification-controller
    type: internal
    serviceRefNamespace: flux-system
    serviceRefName: notification-controller
    ports:
    - {name: TCP-80, port: 80, protocol: TCP}
    ipAddresses: [10.43.0.0/16, 10.96.0.0/12]
