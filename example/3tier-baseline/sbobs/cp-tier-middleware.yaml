# ─────────────────────────────────────────────────────────────────────────────
# TIER 2b — MIDDLEWARE  (Kafka, RabbitMQ, NATS, Zookeeper, Envoy, HAProxy,
#                        Redis-as-cache, Pulsar)
#
# Sits between backend and database: accepts from the backend, may reach the
# database and its own cluster peers, and nothing else.
#
# SAYS **NO** TO
#   • egress to anywhere but DNS / database / its own peers — a broker reaching
#     the internet is exfiltration or an unpinned plugin download
#   • ingress from the frontend — the frontend must not publish to a queue directly
#   • CAP_SYS_ADMIN / NET_ADMIN / SYS_PTRACE / BPF — brokers need none.
#     NOTE: a service-mesh sidecar (Envoy under Istio) DOES need NET_ADMIN to
#     program iptables; do not bind this profile to mesh-injected pods.
#   • curl / wget / package managers at runtime
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ContainerProfile
metadata:
  name: tier-middleware
  namespace: CHANGEME
  annotations:
    kubescape.io/managed-by: User
