# "Flashy 3-tier app" — the kind of YAML an AI hands a non-specialist:
# stock images, root by default, frontend talks straight to the DB.
apiVersion: v1
kind: Namespace
metadata: {name: vibe-app}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: vibe-app}
spec:
  replicas: 1
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports: [{containerPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: vibe-app}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: api
          image: python:3.12-slim
          command: ["sh","-c","pip install flask >/dev/null 2>&1; python -c \"
import http.server,socketserver
socketserver.TCPServer(('',8000),http.server.SimpleHTTPRequestHandler).serve_forever()\""]
          ports: [{containerPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: db, namespace: vibe-app}
spec:
  replicas: 1
  selector: {matchLabels: {app: db}}
  template:
    metadata: {labels: {app: db}}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env: [{name: POSTGRES_PASSWORD, value: hunter2}]
          ports: [{containerPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cache, namespace: vibe-app}
spec:
  replicas: 1
  selector: {matchLabels: {app: cache}}
  template:
    metadata: {labels: {app: cache}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: vibe-app}
spec:
  replicas: 1
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh","-c","while true; do sleep 30; done"]
